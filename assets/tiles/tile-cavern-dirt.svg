<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Deep Packed Cavern Loam Base -->
    <linearGradient id="cdDirtBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c1a0e" />
      <stop offset="40%" stop-color="#3d2515" />
      <stop offset="80%" stop-color="#2a190e" />
      <stop offset="100%" stop-color="#1e1108" />
    </linearGradient>

    <!-- Warm Brown Soil Variations -->
    <radialGradient id="cdSoilWarm" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6e4626" />
      <stop offset="55%" stop-color="#4d3019" />
      <stop offset="100%" stop-color="#36200f" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cdSoilDamp" cx="70%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#231309" />
      <stop offset="60%" stop-color="#1a0e06" />
      <stop offset="100%" stop-color="#1a0e06" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cdSoilOchre" cx="75%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#805430" />
      <stop offset="60%" stop-color="#5a381e" />
      <stop offset="100%" stop-color="#3d2515" stop-opacity="0" />
    </radialGradient>

    <!-- River Pebble Gradients -->
    <linearGradient id="cdPebbleA" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="45%" stop-color="#64748b" />
      <stop offset="90%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="cdPebbleB" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#a89a88" />
      <stop offset="50%" stop-color="#7a6c5a" />
      <stop offset="90%" stop-color="#4a3e2e" />
      <stop offset="100%" stop-color="#2d251a" />
    </linearGradient>

    <!-- Cavern Dust Mote Ambient Glow -->
    <radialGradient id="cdDustGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.16" />
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0" />
    </radialGradient>

    <filter id="cdPebbleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.6" dy="1.0" stdDeviation="0.7" flood-color="#0a0502" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Deep Earth Loam Base -->
  <rect width="128" height="128" fill="url(#cdDirtBase)" />

  <!-- Warm Soil Patches & Packed Clay Undulations -->
  <ellipse cx="44" cy="36" rx="38" ry="26" fill="url(#cdSoilWarm)" />
  <ellipse cx="94" cy="30" rx="32" ry="24" fill="url(#cdSoilOchre)" />
  <ellipse cx="88" cy="94" rx="36" ry="28" fill="url(#cdSoilWarm)" />
  <ellipse cx="32" cy="98" rx="34" ry="26" fill="url(#cdSoilDamp)" />
  <ellipse cx="64" cy="64" rx="28" ry="20" fill="url(#cdSoilWarm)" opacity="0.6" />

  <!-- Packed Cavern Soil Crinkle Contours -->
  <g fill="none" stroke="#22130a" stroke-opacity="0.45">
    <path d="M 8 24 Q 28 32 46 22 Q 62 14 78 26 Q 96 36 120 28" stroke-width="1.2" />
    <path d="M 12 56 Q 34 46 54 58 Q 74 68 96 54 Q 112 48 122 58" stroke-width="1.0" />
    <path d="M 6 82 Q 24 74 48 84 Q 68 94 92 82 Q 110 74 122 84" stroke-width="1.1" />
    <path d="M 14 112 Q 38 104 62 116 Q 84 124 108 112" stroke-width="1.0" />
  </g>

  <!-- ==================== THIN SUBTERRANEAN ROOT TENDRILS ==================== -->
  <g fill="none" stroke-linecap="round">
    <!-- Root System 1 (meandering through quadrant 0,0 and across center) -->
    <path d="M 0 16 Q 14 20 28 16 Q 42 12 52 24 Q 60 34 68 38 Q 78 42 86 52" stroke="#4a2c16" stroke-width="1.4" />
    <path d="M 0 16 Q 14 20 28 16 Q 42 12 52 24 Q 60 34 68 38 Q 78 42 86 52" stroke="#784b28" stroke-width="0.7" stroke-opacity="0.6" />
    <!-- Fine Offshoot Tendrils -->
    <path d="M 28 16 Q 34 24 38 28" stroke="#4a2c16" stroke-width="0.9" />
    <path d="M 52 24 Q 58 18 64 20" stroke="#4a2c16" stroke-width="0.8" />
    <path d="M 68 38 Q 72 32 76 34" stroke="#4a2c16" stroke-width="0.7" />

    <!-- Root System 2 (in quadrant 0,1) -->
    <path d="M 6 102 Q 18 94 32 98 Q 44 102 54 94 Q 62 88 72 90" stroke="#4a2c16" stroke-width="1.2" />
    <path d="M 32 98 Q 38 108 42 114" stroke="#4a2c16" stroke-width="0.8" />
    <path d="M 54 94 Q 58 84 62 82" stroke="#4a2c16" stroke-width="0.7" />

    <!-- Root System 3 (in quadrant 1,1) -->
    <path d="M 88 128 Q 94 114 102 108 Q 112 102 122 104 Q 126 104 128 106" stroke="#4a2c16" stroke-width="1.3" />
    <path d="M 102 108 Q 106 98 112 94" stroke="#4a2c16" stroke-width="0.8" />
  </g>

  <!-- ==================== SCATTERED RIVER PEBBLES & GRAVEL ==================== -->
  <g filter="url(#cdPebbleShadow)">
    <!-- Quadrant 0,0 Pebble -->
    <g transform="translate(34, 42) rotate(22)">
      <ellipse cx="0" cy="0" rx="7.5" ry="5.5" fill="url(#cdPebbleA)" stroke="#1a110a" stroke-width="0.7" />
      <path d="M -5 0 Q -4 -4 2 -4 Q 5 -3 6 0" fill="none" stroke="#cbd5e1" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.6" />
    </g>

    <!-- Quadrant 1,0 Pebble Group -->
    <g transform="translate(104, 26) rotate(-18)">
      <ellipse cx="0" cy="0" rx="8.5" ry="6" fill="url(#cdPebbleB)" stroke="#1a110a" stroke-width="0.7" />
      <path d="M -6 0 Q -5 -4 3 -4 Q 6 -3 7 0" fill="none" stroke="#e2d8cc" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.6" />
    </g>
    <ellipse cx="116" cy="34" rx="3.5" ry="2.5" fill="url(#cdPebbleA)" stroke="#1a110a" stroke-width="0.5" />

    <!-- Quadrant 0,1 Pebble -->
    <g transform="translate(24, 76) rotate(-12)">
      <ellipse cx="0" cy="0" rx="8" ry="5.8" fill="url(#cdPebbleB)" stroke="#1a110a" stroke-width="0.7" />
      <path d="M -6 0 Q -5 -4 2 -4 Q 6 -3 7 0" fill="none" stroke="#e2d8cc" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.6" />
    </g>

    <!-- Quadrant 1,1 Pebble -->
    <g transform="translate(90, 78) rotate(35)">
      <ellipse cx="0" cy="0" rx="9" ry="6.2" fill="url(#cdPebbleA)" stroke="#1a110a" stroke-width="0.7" />
      <path d="M -7 0 Q -5 -4 3 -4 Q 7 -3 8 0" fill="none" stroke="#cbd5e1" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.6" />
    </g>
    <ellipse cx="80" cy="88" rx="4" ry="2.8" fill="url(#cdPebbleB)" stroke="#1a110a" stroke-width="0.5" />

    <!-- Center Pebble -->
    <ellipse cx="54" cy="62" rx="4.5" ry="3.2" fill="url(#cdPebbleA)" stroke="#1a110a" stroke-width="0.5" />
    <path d="M 51 60 Q 53 58 57 59" fill="none" stroke="#cbd5e1" stroke-width="0.7" stroke-opacity="0.5" />

    <!-- Small Gravel Chips -->
    <circle cx="16" cy="30" r="1.5" fill="#64748b" />
    <circle cx="78" cy="18" r="1.4" fill="#7a6c5a" />
    <circle cx="48" cy="86" r="1.6" fill="#64748b" />
    <circle cx="112" cy="72" r="1.5" fill="#7a6c5a" />
    <circle cx="68" cy="106" r="1.3" fill="#64748b" />
  </g>

  <!-- ==================== FAINT DUST TEXTURE & GRIT PARTICLES ==================== -->
  <g fill="#e2b17a" opacity="0.38">
    <circle cx="12" cy="14" r="0.8" />
    <circle cx="42" cy="22" r="0.7" />
    <circle cx="88" cy="12" r="0.9" />
    <circle cx="120" cy="18" r="0.8" />
    <circle cx="28" cy="58" r="0.7" />
    <circle cx="72" cy="50" r="0.8" />
    <circle cx="106" cy="46" r="0.7" />
    <circle cx="18" cy="88" r="0.8" />
    <circle cx="60" cy="80" r="0.7" />
    <circle cx="98" cy="94" r="0.9" />
    <circle cx="36" cy="120" r="0.8" />
    <circle cx="82" cy="122" r="0.7" />
  </g>

  <!-- Soft Ambient Cavern Dust Light -->
  <rect width="128" height="128" fill="url(#cdDustGlow)" pointer-events="none" />

  <!-- Crisp 2x2 Tactical Grid Alignment Crosshairs (Warm Earth Ochre) -->
  <g stroke="#f59e0b" stroke-opacity="0.50" stroke-width="1.4" fill="none" pointer-events="none">
    <rect x="0.7" y="0.7" width="126.6" height="126.6" />
    <line x1="64" y1="0" x2="64" y2="128" stroke-dasharray="6 3" />
    <line x1="0" y1="64" x2="128" y2="64" stroke-dasharray="6 3" />
  </g>
</svg>