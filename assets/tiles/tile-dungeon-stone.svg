<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Deep Damp Crypt Mortar Bed -->
    <linearGradient id="dsMortar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090b0e" />
      <stop offset="50%" stop-color="#12151c" />
      <stop offset="100%" stop-color="#0b0e12" />
    </linearGradient>

    <!-- Beveled Charcoal Ashlar Stone Gradients -->
    <linearGradient id="dsStoneA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b4352" />
      <stop offset="35%" stop-color="#2c3340" />
      <stop offset="75%" stop-color="#202530" />
      <stop offset="100%" stop-color="#151921" />
    </linearGradient>

    <linearGradient id="dsStoneB" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#323a48" />
      <stop offset="40%" stop-color="#252b36" />
      <stop offset="80%" stop-color="#1a1f28" />
      <stop offset="100%" stop-color="#12161d" />
    </linearGradient>

    <linearGradient id="dsStoneDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b323e" />
      <stop offset="45%" stop-color="#1f242d" />
      <stop offset="85%" stop-color="#151920" />
      <stop offset="100%" stop-color="#0e1116" />
    </linearGradient>

    <!-- Cold Crypt Ambient Mist / Shadow -->
    <radialGradient id="dsCryptVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="55%" stop-color="#1e293b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.45" />
    </radialGradient>

    <filter id="dsStoneShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0.8" dy="1.2" stdDeviation="0.8" flood-color="#050608" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Deep Mortar Bed Layer -->
  <rect width="128" height="128" fill="url(#dsMortar)" />

  <!-- Mortar Slate Grit & Crushed Gravel -->
  <g fill="#1f2530" opacity="0.75">
    <circle cx="63.5" cy="18" r="1.1" />
    <circle cx="64.8" cy="42" r="0.9" />
    <circle cx="63.2" cy="78" r="1.2" />
    <circle cx="64.5" cy="108" r="0.8" />
    <circle cx="20" cy="63.5" r="1.0" />
    <circle cx="52" cy="64.2" r="1.2" />
    <circle cx="82" cy="63.8" r="0.9" />
    <circle cx="114" cy="64.5" r="1.1" />
    <!-- Seamless Outer Borders -->
    <circle cx="1.5" cy="35" r="0.9" />
    <circle cx="126.5" cy="35" r="0.9" />
    <circle cx="48" cy="1.5" r="1.0" />
    <circle cx="48" cy="126.5" r="1.0" />
  </g>

  <!-- ==================== QUADRANT 0,0 (Top-Left Cell) ==================== -->
  <g filter="url(#dsStoneShadow)">
    <!-- Block 1 (Top Wide Ashlar) -->
    <rect x="3" y="3" width="58" height="28" rx="3" fill="url(#dsStoneA)" stroke="#0e1116" stroke-width="1.2" />
    <path d="M 4.5 30 L 4.5 5.5 Q 4.5 4.5 5.5 4.5 L 59.5 4.5" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45" />
    <path d="M 60 5.5 L 60 29.5 Q 60 30.5 59 30.5 L 6 30.5" fill="none" stroke="#08090d" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8" />
    <!-- Fracture Lines -->
    <path d="M 16 10 L 26 16 L 38 13 L 48 20" fill="none" stroke="#12161d" stroke-width="0.9" stroke-opacity="0.65" />
    <path d="M 26 16 L 28 24" fill="none" stroke="#12161d" stroke-width="0.7" stroke-opacity="0.55" />
    <circle cx="12" cy="22" r="1.2" fill="#141820" opacity="0.6" />
    <circle cx="50" cy="10" r="1.0" fill="#64748b" opacity="0.35" />

    <!-- Block 2 (Bottom-Left) -->
    <rect x="3" y="35" width="27" height="26" rx="3" fill="url(#dsStoneB)" stroke="#0e1116" stroke-width="1.2" />
    <path d="M 4.5 60 L 4.5 36.5 Q 4.5 36 5.5 36 L 28.5 36" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.4" />
    <path d="M 29 37 L 29 59.5 L 6 59.5" fill="none" stroke="#08090d" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 8 42 L 18 48 L 24 45" fill="none" stroke="#12161d" stroke-width="0.8" stroke-opacity="0.6" />

    <!-- Block 3 (Bottom-Right) -->
    <rect x="34" y="35" width="27" height="26" rx="3" fill="url(#dsStoneDark)" stroke="#0e1116" stroke-width="1.2" />
    <path d="M 35.5 60 L 35.5 36.5 Q 35.5 36 36.5 36 L 59.5 36" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.4" />
    <path d="M 60 37 L 60 59.5 L 37 59.5" fill="none" stroke="#08090d" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.8" />
    <circle cx="46" cy="46" r="1.3" fill="#12161d" opacity="0.6" />
  </g>

  <!-- ==================== QUADRANT 1,0 (Top-Right Cell) ==================== -->
  <g filter="url(#dsStoneShadow)">
    <!-- Block 4 (Top-Left) -->
    <rect x="67" y="3" width="27" height="28" rx="3" fill="url(#dsStoneB)" stroke="#0e1116" stroke-width="1.2" />
    <path d="M 68.5 30 L 68.5 4.5 Q 68.5 4 69.5 4 L 92.5 4" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.4" />
    <path d="M 93 5 L 93 29.5 L 70 29.5" fill="none" stroke="#08090d" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.8" />
    <circle cx="80" cy="16" r="1.1" fill="#64748b" opacity="0.35" />

    <!-- Block 5 (Top-Right) -->
    <rect x="98" y="3" width="27" height="28" rx="3" fill="url(#dsStoneDark)" stroke="#0e1116" stroke-width="1.2" />
    <path d="M 99.5 30 L 99.5 4.5 Q 99.5 4 100.5 4 L 123.5 4" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.4" />
    <path d="M 124 5 L 124 29.5 L 101 29.5" fill="none" stroke="#08090d" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 104 12 L 112 18 L 120 15" fill="none" stroke="#12161d" stroke-width="0.8" stroke-opacity="0.6" />

    <!-- Block 6 (Bottom Wide Ashlar) -->
    <rect x="67" y="35" width="58" height="26" rx="3" fill="url(#dsStoneA)" stroke="#0e1116" stroke-width="1.2" />
    <path d="M 68.5 60 L 68.5 36.5 Q 68.5 36 69.5 36 L 123.5 36" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45" />
    <path d="M 124 37 L 124 59.5 Q 124 60.5 123 60.5 L 70 60.5" fill="none" stroke="#08090d" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 84 44 Q 96 40 108 47" fill="none" stroke="#12161d" stroke-width="0.9" stroke-opacity="0.6" />
  </g>

  <!-- ==================== QUADRANT 0,1 (Bottom-Left Cell) ==================== -->
  <g filter="url(#dsStoneShadow)">
    <!-- Block 7 (Top) -->
    <rect x="3" y="67" width="34" height="27" rx="3" fill="url(#dsStoneDark)" stroke="#0e1116" stroke-width="1.2" />
    <path d="M 4.5 93 L 4.5 68.5 Q 4.5 68 5.5 68 L 35.5 68" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.4" />
    <path d="M 36 69 L 36 93.5 L 6 93.5" fill="none" stroke="#08090d" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 10 74 L 22 80" fill="none" stroke="#12161d" stroke-width="0.8" stroke-opacity="0.55" />

    <!-- Block 8 (Vertical Ashlar Runner) -->
    <rect x="41" y="67" width="20" height="58" rx="3" fill="url(#dsStoneA)" stroke="#0e1116" stroke-width="1.2" />
    <path d="M 42.5 123 L 42.5 68.5 Q 42.5 68 43.5 68 L 59.5 68" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.45" />
    <path d="M 60 69 L 60 123.5 Q 60 124.5 59 124.5 L 44 124.5" fill="none" stroke="#08090d" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 47 84 L 54 94 L 48 106" fill="none" stroke="#12161d" stroke-width="0.8" stroke-opacity="0.6" />
    <circle cx="51" cy="76" r="1.2" fill="#64748b" opacity="0.35" />

    <!-- Block 9 (Bottom) -->
    <rect x="3" y="98" width="34" height="27" rx="3" fill="url(#dsStoneB)" stroke="#0e1116" stroke-width="1.2" />
    <path d="M 4.5 123 L 4.5 99.5 Q 4.5 99 5.5 99 L 35.5 99" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.4" />
    <path d="M 36 100 L 36 123.5 L 6 123.5" fill="none" stroke="#08090d" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.8" />
    <circle cx="18" cy="110" r="1.3" fill="#12161d" opacity="0.6" />
  </g>

  <!-- ==================== QUADRANT 1,1 (Bottom-Right Cell) ==================== -->
  <g filter="url(#dsStoneShadow)">
    <!-- Block 10 (Large Upper Ashlar) -->
    <rect x="67" y="67" width="58" height="33" rx="3" fill="url(#dsStoneB)" stroke="#0e1116" stroke-width="1.2" />
    <path d="M 68.5 99 L 68.5 68.5 Q 68.5 68 69.5 68 L 123.5 68" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45" />
    <path d="M 124 69 L 124 98.5 Q 124 99.5 123 99.5 L 70 99.5" fill="none" stroke="#08090d" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 78 78 L 92 75 L 104 82 L 116 78" fill="none" stroke="#12161d" stroke-width="0.9" stroke-opacity="0.6" />
    <circle cx="114" cy="88" r="1.2" fill="#64748b" opacity="0.35" />

    <!-- Block 11 -->
    <rect x="67" y="104" width="27" height="21" rx="3" fill="url(#dsStoneDark)" stroke="#0e1116" stroke-width="1.2" />
    <path d="M 68.5 123 L 68.5 105.5 Q 68.5 105 69.5 105 L 92.5 105" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.4" />
    <path d="M 93 106 L 93 123.5 L 70 123.5" fill="none" stroke="#08090d" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.8" />

    <!-- Block 12 -->
    <rect x="98" y="104" width="27" height="21" rx="3" fill="url(#dsStoneA)" stroke="#0e1116" stroke-width="1.2" />
    <path d="M 99.5 123 L 99.5 105.5 Q 99.5 105 100.5 105 L 123.5 105" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.45" />
    <path d="M 124 106 L 124 123.5 L 101 123.5" fill="none" stroke="#08090d" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 106 114 Q 114 111 120 116" fill="none" stroke="#12161d" stroke-width="0.8" stroke-opacity="0.55" />
  </g>

  <!-- ==================== DAMP CRYPT MOSS SEAMS ==================== -->
  <g opacity="0.85">
    <!-- Seam Moss at Intersection (x=64, y=64) -->
    <circle cx="64" cy="64" r="3.2" fill="#1b3615" />
    <circle cx="65.5" cy="62.5" r="2.2" fill="#2d5523" />
    <circle cx="62.8" cy="65.2" r="1.8" fill="#447a35" />

    <!-- Seam Moss along center vertical mortar -->
    <circle cx="63.5" cy="33" r="2.4" fill="#1b3615" />
    <circle cx="64.5" cy="34" r="1.6" fill="#36632b" />
    <circle cx="64" cy="98" r="2.2" fill="#1b3615" />
    <circle cx="63.2" cy="99" r="1.5" fill="#36632b" />

    <!-- Seam Moss along horizontal mortar -->
    <circle cx="33" cy="64" r="2.5" fill="#1b3615" />
    <circle cx="34.5" cy="63.5" r="1.7" fill="#2d5523" />
    <circle cx="96" cy="64" r="2.4" fill="#1b3615" />
    <circle cx="97.2" cy="64.8" r="1.6" fill="#36632b" />
  </g>

  <!-- Cold Crypt Ambient Vignette Glow -->
  <rect width="128" height="128" fill="url(#dsCryptVignette)" pointer-events="none" />

  <!-- Crisp 2x2 Tactical Grid Alignment Crosshairs (Cold Steel Slate) -->
  <g stroke="#94a3b8" stroke-opacity="0.48" stroke-width="1.4" fill="none" pointer-events="none">
    <rect x="0.7" y="0.7" width="126.6" height="126.6" />
    <line x1="64" y1="0" x2="64" y2="128" stroke-dasharray="6 3" />
    <line x1="0" y1="64" x2="128" y2="64" stroke-dasharray="6 3" />
  </g>
</svg>