<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="woodPlank1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>
    <linearGradient id="woodPlank2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#582900" />
    </linearGradient>
  </defs>
  <!-- Background Gap -->
  <rect width="128" height="128" fill="#1c1917" />

  <!-- Plank 1 (Top) -->
  <rect x="0" y="2" width="128" height="28" fill="url(#woodPlank1)" stroke="#271003" stroke-width="1.5" />
  <line x1="15" y1="16" x2="110" y2="16" stroke="#451a03" stroke-width="1" stroke-dasharray="25 15" opacity="0.6" />
  <!-- Nails -->
  <circle cx="8" cy="16" r="2.5" fill="#ca8a04" stroke="#451a03" stroke-width="1" />
  <circle cx="120" cy="16" r="2.5" fill="#ca8a04" stroke="#451a03" stroke-width="1" />

  <!-- Plank 2 -->
  <rect x="0" y="34" width="128" height="28" fill="url(#woodPlank2)" stroke="#271003" stroke-width="1.5" />
  <line x1="20" y1="48" x2="95" y2="48" stroke="#3b1d02" stroke-width="1" stroke-dasharray="30 20" opacity="0.6" />
  <!-- Moss Fleck -->
  <circle cx="48" cy="38" r="3" fill="#65a30d" opacity="0.7" />
  <circle cx="52" cy="40" r="2" fill="#4d7c0f" opacity="0.8" />
  <!-- Nails -->
  <circle cx="8" cy="48" r="2.5" fill="#ca8a04" stroke="#451a03" stroke-width="1" />
  <circle cx="120" cy="48" r="2.5" fill="#ca8a04" stroke="#451a03" stroke-width="1" />

  <!-- Plank 3 -->
  <rect x="0" y="66" width="128" height="28" fill="url(#woodPlank1)" stroke="#271003" stroke-width="1.5" />
  <line x1="10" y1="80" x2="115" y2="80" stroke="#451a03" stroke-width="1" stroke-dasharray="18 22" opacity="0.6" />
  <!-- Wood Knot -->
  <ellipse cx="85" cy="80" rx="4" ry="3" fill="#451a03" />
  <!-- Nails -->
  <circle cx="8" cy="80" r="2.5" fill="#ca8a04" stroke="#451a03" stroke-width="1" />
  <circle cx="120" cy="80" r="2.5" fill="#ca8a04" stroke="#451a03" stroke-width="1" />

  <!-- Plank 4 (Bottom) -->
  <rect x="0" y="98" width="128" height="28" fill="url(#woodPlank2)" stroke="#271003" stroke-width="1.5" />
  <line x1="25" y1="112" x2="105" y2="112" stroke="#3b1d02" stroke-width="1" stroke-dasharray="35 15" opacity="0.6" />
  <!-- Moss Fleck -->
  <circle cx="92" cy="118" r="3" fill="#65a30d" opacity="0.6" />
  <!-- Nails -->
  <circle cx="8" cy="112" r="2.5" fill="#ca8a04" stroke="#451a03" stroke-width="1" />
  <circle cx="120" cy="112" r="2.5" fill="#ca8a04" stroke="#451a03" stroke-width="1" />

  <!-- Grid Border Overlay -->
  <rect x="0" y="0" width="128" height="128" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.15" />
</svg>