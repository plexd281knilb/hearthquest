<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="stoneWarm1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78716c" />
      <stop offset="100%" stop-color="#44403c" />
    </linearGradient>
    <linearGradient id="stoneWarm2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8a29e" />
      <stop offset="100%" stop-color="#57534e" />
    </linearGradient>
    <linearGradient id="stoneWarm3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8c7851" />
      <stop offset="100%" stop-color="#453218" />
    </linearGradient>
  </defs>
  <!-- Mortar Bed Base -->
  <rect width="128" height="128" fill="#292524" />

  <!-- Flagstones Row 1 -->
  <rect x="2" y="2" width="60" height="38" rx="4" fill="url(#stoneWarm1)" stroke="#1c1917" stroke-width="2" />
  <rect x="66" y="2" width="60" height="38" rx="4" fill="url(#stoneWarm2)" stroke="#1c1917" stroke-width="2" />

  <!-- Flagstones Row 2 (Staggered Brick Pattern) -->
  <rect x="2" y="44" width="38" height="40" rx="4" fill="url(#stoneWarm3)" stroke="#1c1917" stroke-width="2" />
  <rect x="44" y="44" width="50" height="40" rx="4" fill="url(#stoneWarm1)" stroke="#1c1917" stroke-width="2" />
  <rect x="98" y="44" width="28" height="40" rx="4" fill="url(#stoneWarm2)" stroke="#1c1917" stroke-width="2" />

  <!-- Flagstones Row 3 -->
  <rect x="2" y="88" width="70" height="38" rx="4" fill="url(#stoneWarm2)" stroke="#1c1917" stroke-width="2" />
  <rect x="76" y="88" width="50" height="38" rx="4" fill="url(#stoneWarm3)" stroke="#1c1917" stroke-width="2" />

  <!-- Cozy Flour Dusting Flecks & Texture Highlights -->
  <circle cx="25" cy="18" r="3" fill="#fef3c7" opacity="0.35" />
  <circle cx="45" cy="28" r="2" fill="#fef3c7" opacity="0.4" />
  <circle cx="85" cy="15" r="3.5" fill="#fef3c7" opacity="0.3" />
  <circle cx="110" cy="22" r="2" fill="#fef3c7" opacity="0.45" />

  <circle cx="18" cy="62" r="2.5" fill="#fef3c7" opacity="0.4" />
  <circle cx="68" cy="70" r="4" fill="#fef3c7" opacity="0.35" />
  <circle cx="112" cy="60" r="2" fill="#fef3c7" opacity="0.4" />

  <circle cx="36" cy="105" r="3" fill="#fef3c7" opacity="0.35" />
  <circle cx="95" cy="108" r="2.5" fill="#fef3c7" opacity="0.4" />

  <!-- Subtle Grid Edge Bevel for VTT Grid Align -->
  <rect x="0" y="0" width="128" height="128" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.15" />
</svg>