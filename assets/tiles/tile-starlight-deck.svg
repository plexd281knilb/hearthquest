<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Translucent Celestial Observatory Obsidian-Indigo Base -->
    <linearGradient id="stDeckGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17153b" stop-opacity="0.78" />
      <stop offset="50%" stop-color="#0d1326" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#221e54" stop-opacity="0.78" />
    </linearGradient>

    <linearGradient id="stGoldTrim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="stRuneRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
  </defs>

  <!-- Deep Semi-Translucent Celestial Deck -->
  <rect width="128" height="128" fill="url(#stDeckGrad)" />

  <!-- Carved Obsidian & Star-Bronze Quadrant Panels (aligned to 2x2 grid squares) -->
  <g stroke="#312e81" stroke-width="1.4" fill="none">
    <rect x="4" y="4" width="56" height="56" rx="3" stroke-opacity="0.7" />
    <rect x="68" y="4" width="56" height="56" rx="3" stroke-opacity="0.7" />
    <rect x="4" y="68" width="56" height="56" rx="3" stroke-opacity="0.7" />
    <rect x="68" y="68" width="56" height="56" rx="3" stroke-opacity="0.7" />
  </g>

  <!-- Subtle Silver-Cyan Inlay Corner Filigree -->
  <g stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1" fill="none">
    <path d="M 8 16 L 8 8 L 16 8" />
    <path d="M 112 8 L 120 8 L 120 16" />
    <path d="M 8 112 L 8 120 L 16 120" />
    <path d="M 112 120 L 120 120 L 120 112" />
  </g>

  <!-- Constellation Thread Lines -->
  <g stroke="#818cf8" stroke-width="0.9" stroke-opacity="0.45" stroke-dasharray="3 3" fill="none">
    <line x1="20" y1="22" x2="46" y2="38" />
    <line x1="46" y1="38" x2="64" y2="64" />
    <line x1="108" y1="24" x2="86" y2="44" />
    <line x1="26" y1="104" x2="48" y2="86" />
  </g>

  <!-- Twinkling Starlight Nodes -->
  <circle cx="20" cy="22" r="2" fill="#38bdf8" opacity="0.9" />
  <circle cx="46" cy="38" r="1.5" fill="#fbcfe8" opacity="0.85" />
  <circle cx="108" cy="24" r="2.2" fill="#fef08a" opacity="0.9" />
  <circle cx="86" cy="44" r="1.6" fill="#67e8f9" opacity="0.85" />
  <circle cx="26" cy="104" r="2" fill="#c084fc" opacity="0.9" />
  <circle cx="106" cy="106" r="1.8" fill="#fde68a" opacity="0.85" />

  <!-- Center Astrolabe Medallion on Intersecting Vertex -->
  <circle cx="64" cy="64" r="22" fill="#0f172a" fill-opacity="0.55" stroke="url(#stRuneRing)" stroke-width="1.8" stroke-dasharray="6 3" />
  <circle cx="64" cy="64" r="15" fill="none" stroke="url(#stGoldTrim)" stroke-width="1.3" opacity="0.85" />

  <!-- Four Cardinal Brass & Cyan Compass Points -->
  <polygon points="64,45 67,56 64,60 61,56" fill="#67e8f9" />
  <polygon points="64,83 67,72 64,68 61,72" fill="#67e8f9" />
  <polygon points="45,64 56,67 60,64 56,61" fill="#67e8f9" />
  <polygon points="83,64 72,67 68,64 72,61" fill="#67e8f9" />
  <circle cx="64" cy="64" r="4" fill="#fef08a" stroke="#ffffff" stroke-width="1" />

  <!-- Crisp 2x2 Tactical Grid Alignment Crosshairs -->
  <g stroke="#7dd3fc" stroke-opacity="0.52" stroke-width="1.4" fill="none">
    <rect x="0.7" y="0.7" width="126.6" height="126.6" />
    <line x1="64" y1="0" x2="64" y2="128" stroke-dasharray="6 3" />
    <line x1="0" y1="64" x2="128" y2="64" stroke-dasharray="6 3" />
  </g>
</svg>
