<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="astralDeck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="astralRune" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  <!-- Celestial Astral Deck Deep Base -->
  <rect width="128" height="128" fill="url(#astralDeck)" />

  <!-- Diagonal Celestial Hardwood Inlay -->
  <line x1="0" y1="32" x2="128" y2="32" stroke="#4338ca" stroke-width="1.5" opacity="0.6" />
  <line x1="0" y1="64" x2="128" y2="64" stroke="#4338ca" stroke-width="1.5" opacity="0.6" />
  <line x1="0" y1="96" x2="128" y2="96" stroke="#4338ca" stroke-width="1.5" opacity="0.6" />

  <!-- Starry Constellation Nodes in the Wood Deck -->
  <circle cx="24" cy="18" r="2" fill="#38bdf8" />
  <circle cx="48" cy="46" r="1.5" fill="#fbcfe8" />
  <circle cx="104" cy="20" r="2.5" fill="#fef08a" />
  <circle cx="80" cy="80" r="2" fill="#38bdf8" />
  <circle cx="28" cy="110" r="2" fill="#c084fc" />
  <circle cx="108" cy="105" r="1.5" fill="#fbcfe8" />

  <!-- Astral Astrolabe Rune Circle Inlay (Center) -->
  <circle cx="64" cy="64" r="28" fill="none" stroke="url(#astralRune)" stroke-width="2" stroke-dasharray="8 4" opacity="0.8" />
  <circle cx="64" cy="64" r="18" fill="none" stroke="#fde047" stroke-width="1.5" opacity="0.7" />
  
  <!-- Four Cardinal Star Points -->
  <polygon points="64,38 67,46 64,54 61,46" fill="#38bdf8" opacity="0.9" />
  <polygon points="64,74 67,82 64,90 61,82" fill="#38bdf8" opacity="0.9" />
  <polygon points="38,64 46,67 54,64 46,61" fill="#38bdf8" opacity="0.9" />
  <polygon points="74,64 82,67 90,64 82,61" fill="#38bdf8" opacity="0.9" />
  
  <!-- Center Starlight Gem Core -->
  <circle cx="64" cy="64" r="4.5" fill="#fef08a" stroke="#ffffff" stroke-width="1" />

  <!-- Grid Border Highlight -->
  <rect x="0" y="0" width="128" height="128" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.25" />
</svg>