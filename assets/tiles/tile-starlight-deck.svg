<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Deep Cosmic Slate Mortar Bed -->
    <linearGradient id="stMortarBed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070712" />
      <stop offset="50%" stop-color="#0f1124" />
      <stop offset="100%" stop-color="#090a18" />
    </linearGradient>

    <!-- Dark Indigo Slate Slabs -->
    <linearGradient id="stSlateA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24285e" />
      <stop offset="40%" stop-color="#181b42" />
      <stop offset="80%" stop-color="#121330" />
      <stop offset="100%" stop-color="#0d0e22" />
    </linearGradient>

    <linearGradient id="stSlateB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2e6e" />
      <stop offset="45%" stop-color="#1b1f48" />
      <stop offset="85%" stop-color="#131535" />
      <stop offset="100%" stop-color="#0c0d20" />
    </linearGradient>

    <!-- Antique Inlaid Brass & Bronze Trim -->
    <linearGradient id="stBrassTrim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Bronze Rivet Radial Gradient -->
    <radialGradient id="stBronzeRivet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>

    <!-- Arcane Cyan/Purple Rune Ring Gradient -->
    <linearGradient id="stRuneGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <!-- Stardust Shimmer Radial Glow -->
    <radialGradient id="stDustGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0" />
    </radialGradient>

    <filter id="stDropShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0.6" dy="1.0" stdDeviation="0.7" flood-color="#04040a" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Deep Obsidian Indigo Base Bed -->
  <rect width="128" height="128" fill="url(#stMortarBed)" />

  <!-- ==================== QUADRANT SLABS (2x2 Grid) ==================== -->
  <g filter="url(#stDropShadow)">
    <!-- Top-Left Slab (0,0) -->
    <rect x="3" y="3" width="58" height="58" rx="4" fill="url(#stSlateA)" stroke="#090a18" stroke-width="1.2" />
    <path d="M 4.5 59 L 4.5 5.5 Q 4.5 4.5 5.5 4.5 L 59.5 4.5" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45" />
    <path d="M 60 6 L 60 59.5 Q 60 60.5 59 60.5 L 6 60.5" fill="none" stroke="#060710" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8" />
    <!-- Slate Cleavage Fractures -->
    <path d="M 12 18 L 32 34 L 48 30" fill="none" stroke="#10132b" stroke-width="0.8" stroke-opacity="0.6" />
    <path d="M 28 46 L 42 52" fill="none" stroke="#10132b" stroke-width="0.7" stroke-opacity="0.5" />

    <!-- Top-Right Slab (1,0) -->
    <rect x="67" y="3" width="58" height="58" rx="4" fill="url(#stSlateB)" stroke="#090a18" stroke-width="1.2" />
    <path d="M 68.5 59 L 68.5 5.5 Q 68.5 4.5 69.5 4.5 L 123.5 4.5" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45" />
    <path d="M 124 6 L 124 59.5 Q 124 60.5 123 60.5 L 70 60.5" fill="none" stroke="#060710" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 76 22 L 96 16 L 114 26" fill="none" stroke="#10132b" stroke-width="0.8" stroke-opacity="0.6" />

    <!-- Bottom-Left Slab (0,1) -->
    <rect x="3" y="67" width="58" height="58" rx="4" fill="url(#stSlateB)" stroke="#090a18" stroke-width="1.2" />
    <path d="M 4.5 123 L 4.5 69.5 Q 4.5 68.5 5.5 68.5 L 59.5 68.5" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45" />
    <path d="M 60 70 L 60 123.5 Q 60 124.5 59 124.5 L 6 124.5" fill="none" stroke="#060710" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 16 88 L 38 78 L 52 92" fill="none" stroke="#10132b" stroke-width="0.8" stroke-opacity="0.6" />

    <!-- Bottom-Right Slab (1,1) -->
    <rect x="67" y="67" width="58" height="58" rx="4" fill="url(#stSlateA)" stroke="#090a18" stroke-width="1.2" />
    <path d="M 68.5 123 L 68.5 69.5 Q 68.5 68.5 69.5 68.5 L 123.5 68.5" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45" />
    <path d="M 124 70 L 124 123.5 Q 124 124.5 123 124.5 L 70 124.5" fill="none" stroke="#060710" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 82 84 L 102 98 L 118 90" fill="none" stroke="#10132b" stroke-width="0.8" stroke-opacity="0.6" />
  </g>

  <!-- ==================== BRASS FILIGREE & INLAID RUNES ==================== -->
  <!-- Corner Inlay Filigree Borders -->
  <g stroke="#f59e0b" stroke-opacity="0.42" stroke-width="0.9" fill="none">
    <!-- Top-Left Inlay -->
    <path d="M 9 20 L 9 9 L 20 9" />
    <path d="M 13 13 L 23 13" />
    <path d="M 13 13 L 13 23" />
    <circle cx="13" cy="13" r="1.5" fill="#fbbf24" fill-opacity="0.5" stroke="none" />

    <!-- Top-Right Inlay -->
    <path d="M 119 20 L 119 9 L 108 9" />
    <path d="M 115 13 L 105 13" />
    <path d="M 115 13 L 115 23" />
    <circle cx="115" cy="13" r="1.5" fill="#fbbf24" fill-opacity="0.5" stroke="none" />

    <!-- Bottom-Left Inlay -->
    <path d="M 9 108 L 9 119 L 20 119" />
    <path d="M 13 115 L 23 115" />
    <path d="M 13 115 L 13 105" />
    <circle cx="13" cy="115" r="1.5" fill="#fbbf24" fill-opacity="0.5" stroke="none" />

    <!-- Bottom-Right Inlay -->
    <path d="M 119 108 L 119 119 L 108 119" />
    <path d="M 115 115 L 105 115" />
    <path d="M 115 115 L 115 105" />
    <circle cx="115" cy="115" r="1.5" fill="#fbbf24" fill-opacity="0.5" stroke="none" />
  </g>

  <!-- Constellation Thread Lines Across Quadrants -->
  <g stroke="#818cf8" stroke-width="0.9" stroke-opacity="0.48" stroke-dasharray="3 2" fill="none">
    <line x1="20" y1="22" x2="38" y2="40" />
    <line x1="38" y1="40" x2="52" y2="32" />
    <line x1="108" y1="20" x2="88" y2="36" />
    <line x1="88" y1="36" x2="76" y2="50" />
    <line x1="22" y1="106" x2="42" y2="92" />
    <line x1="42" y1="92" x2="52" y2="108" />
    <line x1="106" y1="106" x2="90" y2="92" />
    <line x1="90" y1="92" x2="76" y2="102" />
  </g>

  <!-- Twinkling Stardust Nodes -->
  <g>
    <circle cx="20" cy="22" r="2.2" fill="#38bdf8" />
    <circle cx="20" cy="22" r="1.0" fill="#ffffff" />
    <circle cx="38" cy="40" r="1.8" fill="#fbcfe8" />
    <circle cx="52" cy="32" r="1.6" fill="#67e8f9" />
    <circle cx="108" cy="20" r="2.2" fill="#fde047" />
    <circle cx="108" cy="20" r="1.0" fill="#ffffff" />
    <circle cx="88" cy="36" r="1.8" fill="#c084fc" />
    <circle cx="22" cy="106" r="2.0" fill="#c084fc" />
    <circle cx="42" cy="92" r="1.6" fill="#38bdf8" />
    <circle cx="106" cy="106" r="2.0" fill="#fde047" />
    <circle cx="90" cy="92" r="1.7" fill="#67e8f9" />
  </g>

  <!-- ==================== BRONZE SLAB RIVETS ==================== -->
  <g stroke="#3a1a04" stroke-width="0.6">
    <!-- Top-Left Slab Rivets -->
    <circle cx="9" cy="9" r="2.0" fill="url(#stBronzeRivet)" />
    <circle cx="55" cy="9" r="2.0" fill="url(#stBronzeRivet)" />
    <circle cx="9" cy="55" r="2.0" fill="url(#stBronzeRivet)" />
    <circle cx="55" cy="55" r="2.0" fill="url(#stBronzeRivet)" />

    <!-- Top-Right Slab Rivets -->
    <circle cx="73" cy="9" r="2.0" fill="url(#stBronzeRivet)" />
    <circle cx="119" cy="9" r="2.0" fill="url(#stBronzeRivet)" />
    <circle cx="73" cy="55" r="2.0" fill="url(#stBronzeRivet)" />
    <circle cx="119" cy="55" r="2.0" fill="url(#stBronzeRivet)" />

    <!-- Bottom-Left Slab Rivets -->
    <circle cx="9" cy="73" r="2.0" fill="url(#stBronzeRivet)" />
    <circle cx="55" cy="73" r="2.0" fill="url(#stBronzeRivet)" />
    <circle cx="9" cy="119" r="2.0" fill="url(#stBronzeRivet)" />
    <circle cx="55" cy="119" r="2.0" fill="url(#stBronzeRivet)" />

    <!-- Bottom-Right Slab Rivets -->
    <circle cx="73" cy="73" r="2.0" fill="url(#stBronzeRivet)" />
    <circle cx="119" cy="73" r="2.0" fill="url(#stBronzeRivet)" />
    <circle cx="73" cy="119" r="2.0" fill="url(#stBronzeRivet)" />
    <circle cx="119" cy="119" r="2.0" fill="url(#stBronzeRivet)" />
  </g>

  <!-- Specular Glints on Bronze Rivets -->
  <g fill="#fef9c3" opacity="0.65">
    <circle cx="8.5" cy="8.5" r="0.6" />
    <circle cx="54.5" cy="8.5" r="0.6" />
    <circle cx="72.5" cy="8.5" r="0.6" />
    <circle cx="118.5" cy="8.5" r="0.6" />
    <circle cx="8.5" cy="118.5" r="0.6" />
    <circle cx="118.5" cy="118.5" r="0.6" />
  </g>

  <!-- ==================== CENTER CELESTIAL ASTROLABE ==================== -->
  <!-- Ambient Center Stardust Field -->
  <circle cx="64" cy="64" r="32" fill="url(#stDustGlow)" pointer-events="none" />

  <!-- Outer Astrolabe Rune Ring -->
  <circle cx="64" cy="64" r="24" fill="#0b0d1e" fill-opacity="0.75" stroke="url(#stRuneGlow)" stroke-width="1.8" stroke-dasharray="6 3" />
  <!-- Inner Etched Brass Ring -->
  <circle cx="64" cy="64" r="16" fill="none" stroke="url(#stBrassTrim)" stroke-width="1.4" opacity="0.9" />
  <circle cx="64" cy="64" r="12" fill="#080a18" fill-opacity="0.8" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6" />

  <!-- Four Cardinal Brass & Cyan Compass Stars -->
  <polygon points="64,43 67.5,56 64,60 60.5,56" fill="url(#stBrassTrim)" stroke="#38bdf8" stroke-width="0.5" />
  <polygon points="64,85 67.5,72 64,68 60.5,72" fill="url(#stBrassTrim)" stroke="#38bdf8" stroke-width="0.5" />
  <polygon points="43,64 56,67.5 60,64 56,60.5" fill="url(#stBrassTrim)" stroke="#38bdf8" stroke-width="0.5" />
  <polygon points="85,64 72,67.5 68,64 72,60.5" fill="url(#stBrassTrim)" stroke="#38bdf8" stroke-width="0.5" />

  <!-- Center Star-Gem Core -->
  <circle cx="64" cy="64" r="4.5" fill="#fde047" stroke="#ffffff" stroke-width="1.0" />
  <circle cx="64" cy="64" r="2.0" fill="#ffffff" />

  <!-- Micro Stardust Particles Scattered -->
  <g fill="#a5f3fc" opacity="0.7">
    <circle cx="30" cy="15" r="0.6" />
    <circle cx="98" cy="46" r="0.6" />
    <circle cx="48" cy="80" r="0.7" />
    <circle cx="84" cy="115" r="0.6" />
    <circle cx="15" cy="70" r="0.5" />
    <circle cx="115" cy="60" r="0.6" />
  </g>

  <!-- Crisp 2x2 Tactical Grid Alignment Crosshairs (Starlight Cyan) -->
  <g stroke="#7dd3fc" stroke-opacity="0.52" stroke-width="1.4" fill="none" pointer-events="none">
    <rect x="0.7" y="0.7" width="126.6" height="126.6" />
    <line x1="64" y1="0" x2="64" y2="128" stroke-dasharray="6 3" />
    <line x1="0" y1="64" x2="128" y2="64" stroke-dasharray="6 3" />
  </g>
</svg>