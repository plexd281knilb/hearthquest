<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Golden Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Hearth Flame Outer Gradient -->
    <linearGradient id="flameOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="30%" stop-color="#ea580c" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Hearth Flame Inner Gradient -->
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="hearthGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Halo -->
  <circle cx="256" cy="256" r="248" fill="#0b0f19" stroke="url(#goldBorder)" stroke-width="12" />

  <!-- Shield Base Shape -->
  <path d="M 256 64 C 368 64 424 104 424 232 C 424 352 328 416 256 448 C 184 416 88 352 88 232 C 88 104 144 64 256 64 Z"
        fill="url(#shieldBg)"
        stroke="url(#goldBorder)"
        stroke-width="16"
        stroke-linejoin="round"
        filter="drop-shadow(0 12px 24px rgba(0,0,0,0.6))" />

  <!-- Inner Inset Shield Line -->
  <path d="M 256 92 C 348 92 396 124 396 230 C 396 328 316 382 256 412 C 196 382 116 328 116 230 C 116 124 164 92 256 92 Z"
        fill="none"
        stroke="#f59e0b"
        stroke-width="4"
        stroke-dasharray="8 6"
        opacity="0.6" />

  <!-- Hearth Firewood Logs -->
  <g transform="translate(0, 40)">
    <!-- Left Log -->
    <rect x="176" y="320" width="160" height="26" rx="13" transform="rotate(-18 256 333)" fill="#78350f" stroke="#451a03" stroke-width="4" />
    <!-- Right Log -->
    <rect x="176" y="320" width="160" height="26" rx="13" transform="rotate(18 256 333)" fill="#92400e" stroke="#451a03" stroke-width="4" />
    <!-- Glowing Embers Under Logs -->
    <circle cx="256" cy="336" r="44" fill="#ea580c" opacity="0.8" filter="url(#hearthGlow)" />
  </g>

  <!-- Outer Hearth Flame -->
  <path d="M 256 140 C 296 200 352 240 344 320 C 336 380 286 390 256 390 C 226 390 176 380 168 320 C 160 240 216 200 256 140 Z"
        fill="url(#flameOuter)"
        filter="url(#hearthGlow)" />

  <!-- Center Core Flame -->
  <path d="M 256 195 C 280 240 310 270 304 330 C 298 370 270 376 256 376 C 242 376 214 370 208 330 C 202 270 232 240 256 195 Z"
        fill="url(#flameInner)" />

  <!-- Innermost White Heart Spark -->
  <ellipse cx="256" cy="324" rx="22" ry="34" fill="#ffffff" opacity="0.9" filter="url(#hearthGlow)" />

  <!-- Golden 4-Pointed Star of Adventure Above the Hearth -->
  <path d="M 256 94 Q 256 124 236 124 Q 256 124 256 154 Q 256 124 276 124 Q 256 124 256 94 Z"
        fill="#fde047"
        filter="url(#hearthGlow)" />
</svg>
