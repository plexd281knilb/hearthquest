<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="parch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6ebd8"/>
      <stop offset="50%" stop-color="#ecd8b7"/>
      <stop offset="100%" stop-color="#dec198"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#451a03" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#parch)"/>
  <rect x="14" y="14" width="772" height="472" rx="14" fill="none" stroke="#78350f" stroke-width="3" stroke-dasharray="10 4"/>
  <rect x="20" y="20" width="760" height="460" rx="10" fill="none" stroke="#92400e" stroke-width="1"/>

  <!-- Winding Millbrook Stream -->
  <path d="M 0 130 C 140 160, 210 70, 340 110 C 470 150, 560 40, 800 95 L 800 132 C 560 80, 470 185, 340 146 C 210 105, 140 195, 0 165 Z" fill="url(#river)" opacity="0.72"/>
  <path d="M 0 145 C 140 175, 210 86, 340 126 C 470 166, 560 58, 800 112" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-dasharray="12 10" opacity="0.8"/>

  <!-- Cobblestone Roads & Dotted Quest Trail -->
  <path d="M 110 385 Q 240 315 390 295 T 660 220" fill="none" stroke="#a88459" stroke-width="22" stroke-linecap="round" opacity="0.45"/>
  <path d="M 110 385 Q 240 315 390 295 T 660 220" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M 390 295 L 365 118" fill="none" stroke="#a88459" stroke-width="18" stroke-linecap="round" opacity="0.4"/>

  <!-- Hills & Stylized Trees -->
  <g fill="#4d7c0f" opacity="0.82">
    <circle cx="95" cy="95" r="22"/><circle cx="122" cy="88" r="18"/><circle cx="72" cy="108" r="16"/>
    <circle cx="675" cy="365" r="26"/><circle cx="705" cy="378" r="20"/><circle cx="645" cy="382" r="19"/>
    <circle cx="560" cy="405" r="17"/><circle cx="195" cy="420" r="18"/>
  </g>

  <!-- Wooden Bridge over Millbrook -->
  <g filter="url(#softShadow)">
    <rect x="342" y="102" width="46" height="50" rx="4" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <line x1="342" y1="114" x2="388" y2="114" stroke="#b45309" stroke-width="2"/>
    <line x1="342" y1="127" x2="388" y2="127" stroke="#b45309" stroke-width="2"/>
    <line x1="342" y1="140" x2="388" y2="140" stroke="#b45309" stroke-width="2"/>
  </g>

  <!-- Location 1: Western Caravan Gate -->
  <g transform="translate(88, 355)" filter="url(#softShadow)">
    <rect x="0" y="0" width="48" height="36" rx="4" fill="#9a3412" stroke="#431407" stroke-width="2"/>
    <polygon points="-6,0 24,-22 54,0" fill="#7c2d12" stroke="#431407" stroke-width="2"/>
    <rect x="16" y="14" width="16" height="22" rx="8" fill="#292524"/>
  </g>
  <rect x="44" y="405" width="144" height="24" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="116" y="421" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#451a03">1. West Gate Square</text>

  <!-- Location 2: Oakhaven Hearth Inn & Town Square -->
  <g transform="translate(342, 248)" filter="url(#softShadow)">
    <rect x="0" y="0" width="74" height="50" rx="5" fill="#b45309" stroke="#451a03" stroke-width="2"/>
    <polygon points="-8,0 37,-28 82,0" fill="#991b1b" stroke="#451a03" stroke-width="2"/>
    <rect x="52" y="-30" width="11" height="22" fill="#57534e" stroke="#292524" stroke-width="1.5"/>
    <circle cx="58" cy="-38" r="5" fill="#fafaf9" opacity="0.65"/>
    <rect x="14" y="14" width="14" height="14" rx="2" fill="#fde047" stroke="#451a03" stroke-width="1.5"/>
    <rect x="45" y="14" width="14" height="14" rx="2" fill="#fde047" stroke="#451a03" stroke-width="1.5"/>
    <rect x="30" y="26" width="14" height="24" rx="3" fill="#451a03"/>
  </g>
  <rect x="294" y="310" width="174" height="24" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="381" y="326" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#451a03">2. Oakhaven Hearth Hall</text>

  <!-- Location 3: Locked Cellar / Old Mill Vault -->
  <g transform="translate(625, 178)" filter="url(#softShadow)">
    <rect x="0" y="0" width="68" height="54" rx="6" fill="#475569" stroke="#1e293b" stroke-width="2.5"/>
    <polygon points="-6,0 34,-30 74,0" fill="#334155" stroke="#0f172a" stroke-width="2"/>
    <rect x="23" y="24" width="22" height="30" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="34" cy="39" r="3.5" fill="#fbbf24"/>
  </g>
  <rect x="576" y="244" width="166" height="24" rx="6" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
  <text x="659" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#7f1d1d">3. Mill Vault (Goblin Lair)</text>

  <!-- Compass Rose -->
  <g transform="translate(715, 425)">
    <circle cx="0" cy="0" r="34" fill="#fef3c7" opacity="0.88" stroke="#78350f" stroke-width="2"/>
    <polygon points="0,-28 6,-6 28,0 6,6 0,28 -6,6 -28,0 -6,-6" fill="#b45309"/>
    <polygon points="0,-28 4,-4 0,0" fill="#dc2626"/>
    <text x="0" y="-32" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#451a03">N</text>
  </g>

  <!-- Title Banner -->
  <g transform="translate(230, 30)" filter="url(#softShadow)">
    <rect x="0" y="0" width="340" height="38" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
    <text x="170" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#fef3c7">MAP OF OAKHAVEN VILLAGE</text>
  </g>
</svg>
