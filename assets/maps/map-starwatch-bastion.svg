<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyChart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#skyChart)"/>
  <rect x="14" y="14" width="772" height="472" rx="14" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="10 5"/>

  <!-- Starry Orbit Rings -->
  <circle cx="400" cy="255" r="195" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="5 6" opacity="0.45"/>
  <circle cx="400" cy="255" r="120" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>
  <g fill="#fef08a" opacity="0.85">
    <circle cx="95" cy="90" r="2.2"/><circle cx="170" cy="60" r="1.8"/><circle cx="645" cy="80" r="2.5"/>
    <circle cx="720" cy="150" r="2"/><circle cx="125" cy="410" r="2"/><circle cx="610" cy="430" r="2.5"/>
  </g>

  <!-- Stone Causeway Route -->
  <path d="M 135 335 Q 290 275 405 265 T 650 180" fill="none" stroke="#64748b" stroke-width="18" opacity="0.5" stroke-linecap="round"/>
  <path d="M 135 335 Q 290 275 405 265 T 650 180" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Location 1: Outer Causeway Gate -->
  <g transform="translate(105, 300)" filter="url(#glow)">
    <rect x="0" y="0" width="54" height="40" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="-4,0 27,-22 58,0" fill="#4338ca" stroke="#a5b4fc" stroke-width="1.5"/>
  </g>
  <rect x="54" y="352" width="160" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="134" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#e0f2fe">1. Outer Bastion Gate</text>

  <!-- Location 2: Astrolabe Gallery -->
  <g transform="translate(375, 224)" filter="url(#glow)">
    <circle cx="30" cy="24" r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="30" cy="24" r="14" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="30" cy="24" r="4" fill="#fde047"/>
  </g>
  <rect x="322" y="286" width="166" height="24" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
  <text x="405" y="302" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#e0e7ff">2. Runic Gallery</text>

  <!-- Location 3: Locked Observatory Spire -->
  <g transform="translate(615, 134)" filter="url(#glow)">
    <rect x="10" y="0" width="48" height="60" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <path d="M 6 0 A 28 28 0 0 1 62 0 Z" fill="#4f46e5" stroke="#fbbf24" stroke-width="2"/>
    <rect x="24" y="32" width="20" height="28" rx="9" fill="#020617" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="568" y="206" width="166" height="24" rx="6" fill="#3b0764" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="651" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#fecdd3">3. Locked Eclipse Vault</text>

  <!-- Celestial Compass -->
  <g transform="translate(715, 425)">
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    <polygon points="0,-26 5,-5 26,0 5,5 0,26 -5,5 -26,0 -5,-5" fill="#fbbf24"/>
    <text x="0" y="-30" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#fef08a">N</text>
  </g>

  <g transform="translate(215, 28)">
    <rect x="0" y="0" width="370" height="38" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <text x="185" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#fef3c7">CHART OF STARWATCH CITADEL</text>
  </g>
</svg>
