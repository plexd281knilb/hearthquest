<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="woodParch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfccb"/>
      <stop offset="55%" stop-color="#d9e8c3"/>
      <stop offset="100%" stop-color="#c3d8ab"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#14532d" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#woodParch)"/>
  <rect x="14" y="14" width="772" height="472" rx="14" fill="none" stroke="#166534" stroke-width="3" stroke-dasharray="10 4"/>

  <!-- Winding Forest Creek -->
  <path d="M 60 0 C 90 150, 240 210, 210 340 C 190 420, 270 460, 310 500" fill="none" stroke="#0ea5e9" stroke-width="26" opacity="0.55" stroke-linecap="round"/>

  <!-- Canopy Clusters -->
  <g fill="#15803d" opacity="0.72">
    <circle cx="85" cy="95" r="34"/><circle cx="130" cy="80" r="28"/><circle cx="670" cy="95" r="36"/>
    <circle cx="715" cy="135" r="28"/><circle cx="115" cy="405" r="34"/><circle cx="695" cy="410" r="32"/>
  </g>

  <!-- Trail connecting the 3 locations -->
  <path d="M 140 270 Q 280 215 415 245 T 650 185" fill="none" stroke="#92400e" stroke-width="16" opacity="0.32" stroke-linecap="round"/>
  <path d="M 140 270 Q 280 215 415 245 T 650 185" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Location 1: Ranger Outpost -->
  <g transform="translate(106, 232)" filter="url(#drop)">
    <rect x="0" y="0" width="56" height="42" rx="6" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <polygon points="-6,0 28,-24 62,0" fill="#166534" stroke="#052e16" stroke-width="2"/>
    <circle cx="28" cy="21" r="8" fill="#fef08a"/>
  </g>
  <rect x="52" y="286" width="166" height="24" rx="6" fill="#fefce8" stroke="#166534" stroke-width="1.5"/>
  <text x="135" y="302" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#14532d">1. Silverleaf Outpost</text>

  <!-- Location 2: Hanging Rope Bridge -->
  <g transform="translate(362, 218)" filter="url(#drop)">
    <rect x="0" y="6" width="96" height="24" rx="4" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <line x1="16" y1="6" x2="16" y2="30" stroke="#451a03" stroke-width="2"/>
    <line x1="36" y1="6" x2="36" y2="30" stroke="#451a03" stroke-width="2"/>
    <line x1="56" y1="6" x2="56" y2="30" stroke="#451a03" stroke-width="2"/>
    <line x1="76" y1="6" x2="76" y2="30" stroke="#451a03" stroke-width="2"/>
  </g>
  <rect x="328" y="262" width="166" height="24" rx="6" fill="#fefce8" stroke="#166534" stroke-width="1.5"/>
  <text x="411" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#14532d">2. Briarwood Crossing</text>

  <!-- Location 3: Elder Oak Watchtower -->
  <g transform="translate(618, 138)" filter="url(#drop)">
    <rect x="10" y="0" width="46" height="62" rx="6" fill="#57534e" stroke="#1c1917" stroke-width="2"/>
    <polygon points="2,0 33,-28 64,0" fill="#1e3a8a" stroke="#0f172a" stroke-width="2"/>
    <rect x="24" y="34" width="18" height="28" rx="8" fill="#1c1917" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="576" y="212" width="154" height="24" rx="6" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
  <text x="653" y="228" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#7f1d1d">3. Hollow Oak Vault</text>

  <!-- Compass Rose -->
  <g transform="translate(715, 425)">
    <circle cx="0" cy="0" r="32" fill="#fefce8" stroke="#166534" stroke-width="2"/>
    <polygon points="0,-26 5,-5 26,0 5,5 0,26 -5,5 -26,0 -5,-5" fill="#15803d"/>
    <text x="0" y="-30" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#14532d">N</text>
  </g>

  <g transform="translate(215, 28)" filter="url(#drop)">
    <rect x="0" y="0" width="370" height="38" rx="10" fill="#14532d" stroke="#facc15" stroke-width="2"/>
    <text x="185" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#fefce8">MAP OF SILVERLEAF CANOPY</text>
  </g>
</svg>
