<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Soft Ground Cast Shadow Blur -->
    <filter id="logShadowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.0" />
    </filter>

    <!-- Bark Cylinder Linear Gradient -->
    <linearGradient id="logBarkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3118" />
      <stop offset="25%" stop-color="#45230e" />
      <stop offset="70%" stop-color="#341808" />
      <stop offset="100%" stop-color="#1b0a02" />
    </linearGradient>

    <!-- Branch Bark Gradient -->
    <linearGradient id="logBranchGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64381c" />
      <stop offset="50%" stop-color="#46240f" />
      <stop offset="100%" stop-color="#220e03" />
    </linearGradient>

    <!-- Hollow Interior Deep Cavity -->
    <radialGradient id="logHollowHole" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0a0401" />
      <stop offset="70%" stop-color="#180902" />
      <stop offset="100%" stop-color="#2a1205" />
    </radialGradient>

    <!-- Bracket Fungi Shelf Gradient -->
    <linearGradient id="bracketFungi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#ea580c" />
      <stop offset="75%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Ivy Leaf Radial Gradient -->
    <linearGradient id="ivyLeafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="55%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>

  <!-- ==================== AMBIENT GROUND CAST SHADOW ==================== -->
  <g filter="url(#logShadowBlur)" opacity="0.6">
    <!-- Main trunk shadow -->
    <path d="M 22 52 L 116 94 C 118 100, 110 106, 100 102 L 20 66 C 14 62, 16 54, 22 52 Z" fill="#080a05" />
    <!-- Forked branch shadow -->
    <path d="M 60 52 L 76 24 C 80 22, 84 26, 80 32 L 68 60 Z" fill="#080a05" />
    <!-- Lower stub shadow -->
    <path d="M 84 84 L 92 104 C 94 108, 88 110, 84 106 L 78 88 Z" fill="#080a05" />
  </g>

  <!-- ==================== BROKEN TWIGS ON GROUND ==================== -->
  <g stroke="#3a1c0b" stroke-linecap="round">
    <!-- Detached twig 1 (North) -->
    <path d="M 40 26 L 48 30 L 56 28 M 48 30 L 52 36" stroke-width="1.2" fill="none" />
    <!-- Detached twig 2 (South) -->
    <path d="M 52 94 L 62 98 L 70 96 M 62 98 L 64 104" stroke-width="1.1" fill="none" />
    <!-- Wood splinters -->
    <line x1="106" y1="78" x2="114" y2="76" stroke-width="1.0" />
    <line x1="110" y1="100" x2="118" y2="98" stroke-width="0.9" />
  </g>

  <!-- ==================== FORKED BRANCHES ==================== -->
  <!-- Upper Forked Branch (Sprouting Northward) -->
  <g>
    <!-- Branch Base & Stem -->
    <path d="M 58 46 Q 64 34 72 22 Q 74 18 78 19 Q 80 22 76 28 Q 70 40 68 52 Z" fill="url(#logBranchGrad)" stroke="#1a0a02" stroke-width="1.1" />
    <!-- Branch Sunlit Northwest Highlight -->
    <path d="M 60 45 Q 65 33 73 21" fill="none" stroke="#fed7aa" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.55" />
    <!-- Branch Twig Fork -->
    <path d="M 72 28 Q 80 26 86 29 Q 88 31 84 32 Q 78 31 74 34" fill="url(#logBranchGrad)" stroke="#1a0a02" stroke-width="0.8" />
  </g>

  <!-- Lower Snapped Stub Branch (Southward) -->
  <g>
    <path d="M 80 78 Q 84 88 88 98 Q 91 100 93 98 Q 93 94 88 84 Q 86 78 85 76 Z" fill="url(#logBranchGrad)" stroke="#1a0a02" stroke-width="1.1" />
    <ellipse cx="90.5" cy="98.5" rx="2.5" ry="1.8" fill="#a06c3a" stroke="#1a0a02" stroke-width="0.7" />
  </g>

  <!-- ==================== MAIN FALLEN LOG TRUNK ==================== -->
  <g>
    <!-- Log Trunk Body -->
    <path d="M 22 36 L 108 76 C 116 80, 116 90, 108 94 L 24 58 Z" fill="url(#logBarkGrad)" stroke="#140601" stroke-width="1.4" />

    <!-- Sunlit Top Edge Chamfer Highlight -->
    <path d="M 24 37 L 108 76" fill="none" stroke="#fef3c7" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.5" />

    <!-- Underside Contact Shadow along bottom of trunk -->
    <path d="M 26 57 L 108 93" fill="none" stroke="#120501" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.85" />

    <!-- Ridged Bark Furrows & Longitudinal Striations -->
    <g fill="none" stroke="#240e04" stroke-linecap="round">
      <path d="M 32 42 Q 64 56 100 73" stroke-width="1.2" stroke-opacity="0.65" />
      <path d="M 30 48 Q 62 62 98 79" stroke-width="1.0" stroke-opacity="0.6" />
      <path d="M 36 53 Q 66 68 102 85" stroke-width="1.1" stroke-opacity="0.65" />
      <!-- Knothole on trunk -->
      <ellipse cx="78" cy="70" rx="3.5" ry="2.0" fill="#180902" stroke="#361706" stroke-width="0.8" />
    </g>

    <!-- Broken/Splintered Right Trunk End -->
    <path d="M 108 76 L 112 80 L 108 83 L 114 87 L 108 91 L 112 93 L 108 94" fill="#8c5828" stroke="#140601" stroke-width="1.1" />
  </g>

  <!-- ==================== HOLLOW END / CAVERNOUS CAVITY (Left End) ==================== -->
  <g>
    <!-- Cut Wood Annulus Rim -->
    <ellipse cx="23" cy="47" rx="9.5" ry="12.5" fill="#a87442" stroke="#180a03" stroke-width="1.3" />
    <path d="M 19 36 C 25 36, 29 42, 28 50" fill="none" stroke="#fde68a" stroke-width="0.9" stroke-opacity="0.55" />

    <!-- Deep Cavernous Hollow Pith Hole -->
    <ellipse cx="23" cy="47" rx="6.5" ry="8.8" fill="url(#logHollowHole)" stroke="#090301" stroke-width="1.1" />
    <ellipse cx="22" cy="47" rx="3.5" ry="5.0" fill="#040100" />
  </g>

  <!-- ==================== BRACKET FUNGI (Shelf Mushrooms) ==================== -->
  <g stroke="#3a1604" stroke-width="0.5">
    <!-- Bracket Fungi 1 (Large Fan on Upper Bark) -->
    <g transform="translate(44, 40) rotate(-18)">
      <path d="M 0 0 C 4 -6, 12 -6, 14 0 C 14 4, 10 7, 0 4 Z" fill="url(#bracketFungi)" />
      <path d="M 2 -2 C 6 -4, 10 -4, 12 -1" fill="none" stroke="#fef9c3" stroke-width="0.7" />
    </g>

    <!-- Bracket Fungi 2 (Clustered Below 1) -->
    <g transform="translate(38, 45) rotate(-22)">
      <path d="M 0 0 C 3 -5, 9 -5, 11 0 C 11 3, 8 5, 0 3 Z" fill="url(#bracketFungi)" />
      <path d="M 2 -1.5 C 5 -3, 8 -3, 9 -0.8" fill="none" stroke="#fef9c3" stroke-width="0.6" />
    </g>

    <!-- Bracket Fungi 3 (On Underside Trunk) -->
    <g transform="translate(68, 77) rotate(20)">
      <path d="M 0 0 C 3 4, 10 4, 11 0 C 10 -3, 6 -3, 0 -1 Z" fill="url(#bracketFungi)" />
      <path d="M 2 1.5 C 5 2.5, 8 2.5, 9 1" fill="none" stroke="#fef9c3" stroke-width="0.6" />
    </g>

    <!-- Bracket Fungi 4 (On Branch Fork) -->
    <g transform="translate(68, 32) rotate(-65)">
      <path d="M 0 0 C 2.5 -4, 7 -4, 8 0 C 8 2.5, 6 4, 0 2 Z" fill="url(#bracketFungi)" />
    </g>
  </g>

  <!-- ==================== IVY LEAVES & CREEPING VINES ==================== -->
  <!-- Creeping Vine Runners -->
  <g fill="none" stroke="#14532d" stroke-linecap="round">
    <path d="M 48 58 Q 54 48 62 50 Q 72 52 82 64 Q 92 70 98 68" stroke-width="1.0" />
    <path d="M 62 50 Q 64 42 66 36" stroke-width="0.8" />
  </g>

  <!-- 3-Lobed Ivy Leaves -->
  <g stroke="#0f3d20" stroke-width="0.4">
    <!-- Leaf 1 (At x=56, y=49) -->
    <g transform="translate(56, 49) rotate(-15)">
      <polygon points="0,-4 3,-1 4,3 0,2 -4,3 -3,-1" fill="url(#ivyLeafGrad)" />
      <line x1="0" y1="2" x2="0" y2="-3" stroke="#86efac" stroke-width="0.5" />
    </g>

    <!-- Leaf 2 (At x=64, y=44) -->
    <g transform="translate(64, 44) rotate(25)">
      <polygon points="0,-4.5 3,-1 4,3 0,2 -4,3 -3,-1" fill="url(#ivyLeafGrad)" />
      <line x1="0" y1="2" x2="0" y2="-3.5" stroke="#86efac" stroke-width="0.5" />
    </g>

    <!-- Leaf 3 (At x=74, y=56) -->
    <g transform="translate(74, 56) rotate(40)">
      <polygon points="0,-4 3,-1 4,3 0,2 -4,3 -3,-1" fill="url(#ivyLeafGrad)" />
      <line x1="0" y1="2" x2="0" y2="-3" stroke="#86efac" stroke-width="0.5" />
    </g>

    <!-- Leaf 4 (At x=86, y=64) -->
    <g transform="translate(86, 64) rotate(-30)">
      <polygon points="0,-3.5 2.5,-1 3.5,2.5 0,1.8 -3.5,2.5 -2.5,-1" fill="url(#ivyLeafGrad)" />
      <line x1="0" y1="1.8" x2="0" y2="-2.5" stroke="#86efac" stroke-width="0.4" />
    </g>

    <!-- Leaf 5 (At x=96, y=68) -->
    <g transform="translate(96, 68) rotate(10)">
      <polygon points="0,-3 2,-0.8 3,2 0,1.5 -3,2 -2,-0.8" fill="url(#ivyLeafGrad)" />
    </g>
  </g>
</svg>