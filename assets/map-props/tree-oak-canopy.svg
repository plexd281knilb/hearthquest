<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Soft Ground Cast Shadow Filter -->
    <filter id="oakShadowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>

    <!-- Deep Trunk Bark Gradient -->
    <linearGradient id="oakTrunkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a2a14" />
      <stop offset="50%" stop-color="#361d0d" />
      <stop offset="100%" stop-color="#211006" />
    </linearGradient>

    <!-- Deep Shadow Leaf Cloud Gradient -->
    <radialGradient id="oakLeafDark" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1b4218" />
      <stop offset="60%" stop-color="#133011" />
      <stop offset="100%" stop-color="#0b1c09" />
    </radialGradient>

    <!-- Mid-Canopy Lush Green Gradient -->
    <radialGradient id="oakLeafMid" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3b8c34" />
      <stop offset="50%" stop-color="#2a6d25" />
      <stop offset="90%" stop-color="#1d4e19" />
      <stop offset="100%" stop-color="#143611" />
    </radialGradient>

    <!-- Sunlit Upper Leaf Cloud Gradient -->
    <radialGradient id="oakLeafSun" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="45%" stop-color="#65a30d" />
      <stop offset="85%" stop-color="#447c12" />
      <stop offset="100%" stop-color="#2d550c" />
    </radialGradient>

    <!-- Specular Leaf Highlight Gradient -->
    <radialGradient id="oakSunHighlight" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="60%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </radialGradient>
  </defs>

  <!-- ==================== AMBIENT GROUND CAST SHADOW ==================== -->
  <g filter="url(#oakShadowBlur)" opacity="0.58">
    <ellipse cx="68" cy="70" rx="46" ry="43" fill="#080e05" />
    <circle cx="80" cy="80" r="28" fill="#080e05" />
    <circle cx="56" cy="78" r="30" fill="#080e05" />
    <circle cx="78" cy="60" r="32" fill="#080e05" />
  </g>

  <!-- ==================== UNDER-CANOPY TRUNK & MOSSY BARK CORE ==================== -->
  <!-- Peeking trunk branches radiating into canopy -->
  <g stroke="url(#oakTrunkGrad)" stroke-linecap="round">
    <path d="M 64 64 L 46 44" stroke-width="8" />
    <path d="M 64 64 L 84 46" stroke-width="7" />
    <path d="M 64 64 L 48 82" stroke-width="7.5" />
    <path d="M 64 64 L 82 80" stroke-width="8" />
  </g>

  <!-- Moss Clinging to Branch Junctions -->
  <g>
    <circle cx="52" cy="50" r="3.5" fill="#365314" />
    <circle cx="50" cy="49" r="2.2" fill="#4d7c0f" />
    <circle cx="76" cy="52" r="3.2" fill="#365314" />
    <circle cx="77" cy="53" r="2.0" fill="#65a30d" />
    <circle cx="54" cy="76" r="3.0" fill="#365314" />
    <circle cx="76" cy="74" r="3.2" fill="#365314" />
  </g>

  <!-- Gnarled Center Trunk Pith -->
  <ellipse cx="64" cy="64" rx="7" ry="6" fill="#1b0e06" stroke="#381d0c" stroke-width="1.5" />

  <!-- ==================== TIER 1: DEEP SHADOW LEAF CLOUDS (Outer Base) ==================== -->
  <g stroke="#091807" stroke-width="0.8">
    <!-- North Leaf Cloud -->
    <path d="M 44 26 C 50 14, 76 14, 84 26 C 94 28, 98 42, 90 50 C 76 56, 52 56, 38 48 C 30 40, 34 28, 44 26 Z" fill="url(#oakLeafDark)" />
    <!-- East Leaf Cloud -->
    <path d="M 86 38 C 100 40, 114 54, 110 70 C 108 82, 96 92, 82 90 C 74 88, 70 80, 72 70 C 72 56, 78 44, 86 38 Z" fill="url(#oakLeafDark)" />
    <!-- South Leaf Cloud -->
    <path d="M 46 98 C 56 112, 80 112, 88 100 C 98 94, 96 80, 86 74 C 74 68, 54 68, 44 76 C 34 82, 36 94, 46 98 Z" fill="url(#oakLeafDark)" />
    <!-- West Leaf Cloud -->
    <path d="M 22 56 C 14 68, 20 86, 36 90 C 48 94, 56 86, 54 74 C 52 64, 48 56, 38 52 C 28 48, 24 50, 22 56 Z" fill="url(#oakLeafDark)" />
  </g>

  <!-- ==================== TIER 2: MID-CANOPY OVERLAPPING SCALLOPED LEAF CLOUDS ==================== -->
  <g stroke="#143611" stroke-width="0.7">
    <!-- North-West Foliage Mound -->
    <path d="M 32 36 C 30 20, 52 16, 62 26 C 70 20, 84 24, 82 36 C 88 44, 84 56, 74 60 C 62 64, 48 64, 38 56 C 30 52, 28 42, 32 36 Z" fill="url(#oakLeafMid)" />
    <circle cx="48" cy="30" r="14" fill="url(#oakLeafMid)" />
    <circle cx="66" cy="32" r="13" fill="url(#oakLeafMid)" />

    <!-- North-East Foliage Mound -->
    <path d="M 72 32 C 84 24, 102 32, 104 46 C 106 58, 98 68, 86 70 C 74 70, 68 62, 70 50 C 70 40, 68 34, 72 32 Z" fill="url(#oakLeafMid)" />
    <circle cx="88" cy="48" r="14" fill="url(#oakLeafMid)" />

    <!-- South-East Foliage Mound -->
    <path d="M 64 68 C 76 64, 92 70, 96 82 C 100 94, 90 106, 78 106 C 66 106, 58 98, 60 88 C 60 78, 58 72, 64 68 Z" fill="url(#oakLeafMid)" />
    <circle cx="80" cy="88" r="14" fill="url(#oakLeafMid)" />

    <!-- South-West Foliage Mound -->
    <path d="M 30 64 C 40 58, 54 62, 56 74 C 56 86, 48 98, 36 96 C 24 94, 18 82, 22 72 C 24 66, 26 64, 30 64 Z" fill="url(#oakLeafMid)" />
    <circle cx="36" cy="76" r="14" fill="url(#oakLeafMid)" />
    <circle cx="50" cy="88" r="12" fill="url(#oakLeafMid)" />

    <!-- Center Canopy Dome -->
    <circle cx="62" cy="58" r="20" fill="url(#oakLeafMid)" />
  </g>

  <!-- ==================== TIER 3: SUNLIT GOLDEN-GREEN LEAF CLUSTERS (Facing Sun from NW) ==================== -->
  <g stroke="#2d550c" stroke-width="0.6">
    <!-- NW Sunlit Crest Cluster -->
    <path d="M 36 30 C 40 18, 60 18, 66 28 C 74 24, 82 30, 80 40 C 76 48, 64 52, 54 48 C 42 50, 34 40, 36 30 Z" fill="url(#oakLeafSun)" />
    <circle cx="46" cy="28" r="10" fill="url(#oakLeafSun)" />
    <circle cx="62" cy="30" r="9" fill="url(#oakLeafSun)" />

    <!-- West Sunlit Crest -->
    <circle cx="28" cy="48" r="8.5" fill="url(#oakLeafSun)" />
    <circle cx="34" cy="62" r="9.5" fill="url(#oakLeafSun)" />

    <!-- North Sunlit Crest -->
    <circle cx="76" cy="32" r="8" fill="url(#oakLeafSun)" />

    <!-- Center-Top Sunlit Mound -->
    <circle cx="56" cy="50" r="12" fill="url(#oakLeafSun)" />
    <circle cx="68" cy="54" r="11" fill="url(#oakLeafSun)" />
  </g>

  <!-- ==================== SPECULAR SUNLIT LEAF HIGHLIGHTS & DAPPLES ==================== -->
  <g fill="url(#oakSunHighlight)" stroke="#4d7c0f" stroke-width="0.4">
    <!-- Brightest Northwest Scalloped Edges -->
    <circle cx="44" cy="24" r="5.5" />
    <circle cx="58" cy="25" r="5.0" />
    <circle cx="36" cy="36" r="4.8" />
    <circle cx="26" cy="46" r="4.2" />
    <circle cx="52" cy="44" r="6.0" />
    <circle cx="64" cy="46" r="5.5" />
  </g>

  <!-- Sunlit Leaf Cluster Specks -->
  <g fill="#bef264" opacity="0.85">
    <circle cx="42" cy="22" r="1.5" />
    <circle cx="46" cy="20" r="1.2" />
    <circle cx="56" cy="22" r="1.4" />
    <circle cx="60" cy="24" r="1.1" />
    <circle cx="34" cy="34" r="1.3" />
    <circle cx="50" cy="42" r="1.5" />
    <circle cx="62" cy="44" r="1.4" />
    <circle cx="70" cy="50" r="1.2" />
  </g>

  <!-- Deep Canopy Shade Crevices (Adding 3D volume) -->
  <g fill="#0b1c09" opacity="0.65">
    <ellipse cx="78" cy="64" rx="4" ry="2.5" />
    <ellipse cx="50" cy="68" rx="3.5" ry="2" />
    <ellipse cx="64" cy="74" rx="4" ry="2" />
    <ellipse cx="70" cy="38" rx="3" ry="1.8" />
  </g>
</svg>