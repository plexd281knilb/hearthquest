<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="brazierShadowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
    <filter id="ambientLightFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" />
    </filter>

    <!-- Warm Amber Ambient Light Halo -->
    <radialGradient id="brazierLightHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#fef08a" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#f97316" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#ea580c" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>

    <!-- Coals Glow -->
    <radialGradient id="coalBedGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="65%" stop-color="#ea580c" />
      <stop offset="90%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#292524" />
    </radialGradient>

    <!-- Wrought Iron Gradient -->
    <linearGradient id="ironGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Hot Core Gradient -->
    <radialGradient id="flameCoreGrad" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#dc2626" />
    </radialGradient>
  </defs>

  <!-- Ground Ambient Fire Illumination Field -->
  <circle cx="64" cy="64" r="58" fill="url(#brazierLightHalo)" filter="url(#ambientLightFilter)" />

  <!-- Ground Contact Shadow under Tripod Feet -->
  <g id="contactShadow" fill="#09090b" opacity="0.4" filter="url(#brazierShadowFilter)">
    <circle cx="64" cy="68" r="28" />
    <circle cx="64" cy="108" r="7" />
    <circle cx="28" cy="46" r="7" />
    <circle cx="100" cy="46" r="7" />
  </g>

  <!-- Wrought Iron Tripod Stand (3 Radiating Legs with Scrollwork) -->
  <g id="tripodLegs">
    <!-- South Leg (Downwards) -->
    <path d="M 60 78 L 59 104 C 59 109, 69 109, 69 104 L 68 78 Z" fill="url(#ironGrad)" stroke="#09090b" stroke-width="0.8" />
    <circle cx="64" cy="105" r="4.2" fill="url(#ironGrad)" stroke="#09090b" stroke-width="0.8" />
    <circle cx="64" cy="105" r="2" fill="#0f172a" />
    <path d="M 62 82 L 62 102" stroke="#94a3b8" stroke-width="0.6" opacity="0.6" />

    <!-- North-West Leg -->
    <g transform="rotate(120 64 64)">
      <path d="M 60 78 L 59 104 C 59 109, 69 109, 69 104 L 68 78 Z" fill="url(#ironGrad)" stroke="#09090b" stroke-width="0.8" />
      <circle cx="64" cy="105" r="4.2" fill="url(#ironGrad)" stroke="#09090b" stroke-width="0.8" />
      <circle cx="64" cy="105" r="2" fill="#0f172a" />
      <path d="M 62 82 L 62 102" stroke="#94a3b8" stroke-width="0.6" opacity="0.6" />
    </g>

    <!-- North-East Leg -->
    <g transform="rotate(240 64 64)">
      <path d="M 60 78 L 59 104 C 59 109, 69 109, 69 104 L 68 78 Z" fill="url(#ironGrad)" stroke="#09090b" stroke-width="0.8" />
      <circle cx="64" cy="105" r="4.2" fill="url(#ironGrad)" stroke="#09090b" stroke-width="0.8" />
      <circle cx="64" cy="105" r="2" fill="#0f172a" />
      <path d="M 62 82 L 62 102" stroke="#94a3b8" stroke-width="0.6" opacity="0.6" />
    </g>

    <!-- Iron Leg Brace Struts / Center Spoke Ring -->
    <circle cx="64" cy="64" r="16" fill="none" stroke="url(#ironGrad)" stroke-width="2.5" />
    <circle cx="64" cy="64" r="16" fill="none" stroke="#09090b" stroke-width="0.8" />
  </g>

  <!-- Brazier Fire Bowl -->
  <g id="brazierBowl">
    <!-- Outer Heavy Iron Bowl Rim -->
    <circle cx="64" cy="64" r="26" fill="#18181b" stroke="#09090b" stroke-width="1.5" />
    <circle cx="64" cy="64" r="25" fill="none" stroke="url(#ironGrad)" stroke-width="3" />
    <circle cx="64" cy="64" r="23.2" fill="none" stroke="#94a3b8" stroke-width="0.75" opacity="0.6" />

    <!-- 12 Iron Rim Rivets / Studs -->
    <g id="rivets" fill="#cbd5e1" stroke="#09090b" stroke-width="0.4">
      <circle cx="64" cy="39" r="1.2" />
      <circle cx="76.5" cy="42.3" r="1.2" />
      <circle cx="85.7" cy="51.5" r="1.2" />
      <circle cx="89" cy="64" r="1.2" />
      <circle cx="85.7" cy="76.5" r="1.2" />
      <circle cx="76.5" cy="85.7" r="1.2" />
      <circle cx="64" cy="89" r="1.2" />
      <circle cx="51.5" cy="85.7" r="1.2" />
      <circle cx="42.3" cy="76.5" r="1.2" />
      <circle cx="39" cy="64" r="1.2" />
      <circle cx="42.3" cy="51.5" r="1.2" />
      <circle cx="51.5" cy="42.3" r="1.2" />
    </g>

    <!-- Inner Charcoal & Glowing Coal Bed -->
    <circle cx="64" cy="64" r="22" fill="url(#coalBedGlow)" />

    <!-- Charcoal Lumps & Hot Ember Fissures -->
    <polygon points="56,58 62,54 60,61 54,62" fill="#1c1917" />
    <polygon points="68,56 74,60 70,66 65,62" fill="#1c1917" />
    <polygon points="58,68 64,72 61,75 55,71" fill="#1c1917" />
    <polygon points="70,68 76,71 73,76 67,73" fill="#1c1917" />
    <polygon points="62,50 67,52 65,56 61,54" fill="#1c1917" />

    <!-- Layer 1: Swirling Outer Orange/Red Flame Petals -->
    <path d="M 64 44 C 74 48, 80 58, 76 68 C 72 78, 56 80, 52 70 C 48 60, 54 48, 64 44 Z"
          fill="#ea580c" opacity="0.85" />
    <!-- Dynamic flame petal tongues -->
    <path d="M 64 42 C 68 50, 72 52, 77 48 C 76 56, 82 60, 84 66 C 80 72, 75 72, 74 78 C 68 84, 60 84, 54 78 C 53 72, 48 72, 44 66 C 46 60, 52 56, 51 48 C 56 52, 60 50, 64 42 Z"
          fill="#f97316" />

    <!-- Layer 2: Bright Golden Yellow Mid-Flame Petals -->
    <path d="M 64 48 C 68 54, 72 56, 75 54 C 73 60, 77 64, 76 68 C 72 74, 66 76, 64 74 C 62 76, 56 74, 52 68 C 51 64, 55 60, 53 54 C 56 56, 60 54, 64 48 Z"
          fill="#fde047" />

    <!-- Layer 3: White-Hot Blazing Core -->
    <ellipse cx="64" cy="64" rx="7.5" ry="6.5" fill="url(#flameCoreGrad)" />
    <circle cx="64" cy="63" r="3.2" fill="#ffffff" />

    <!-- Ember Sparks Drifting Outward -->
    <circle cx="50" cy="40" r="1.2" fill="#fef08a" />
    <circle cx="78" cy="38" r="1.5" fill="#fef08a" />
    <circle cx="86" cy="52" r="1" fill="#f97316" />
    <circle cx="44" cy="76" r="1.3" fill="#fde047" />
    <circle cx="74" cy="86" r="1.1" fill="#f97316" />
    <circle cx="38" cy="56" r="0.9" fill="#fef08a" />
    <circle cx="84" cy="78" r="1" fill="#fef08a" />
  </g>
</svg>
