<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="campShadowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <filter id="campGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" />
    </filter>

    <!-- Warm Firelight Ground Halo -->
    <radialGradient id="firelightHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.28" />
      <stop offset="85%" stop-color="#ea580c" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>

    <!-- Hot Embers Gradient -->
    <radialGradient id="emberBedGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#ea580c" />
      <stop offset="85%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#1c1917" />
    </radialGradient>

    <!-- River Stone Gradient -->
    <radialGradient id="stoneGrad1" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>

    <radialGradient id="stoneGrad2" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a8a29e" />
      <stop offset="50%" stop-color="#57534e" />
      <stop offset="100%" stop-color="#292524" />
    </radialGradient>

    <!-- Charred Log Gradient -->
    <linearGradient id="charredLog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b1704" />
      <stop offset="35%" stop-color="#78350f" />
      <stop offset="70%" stop-color="#292524" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>
  </defs>

  <!-- Ambient Campfire Ground Glow -->
  <circle cx="64" cy="64" r="56" fill="url(#firelightHalo)" filter="url(#campGlowFilter)" />

  <!-- Ground Cast Shadow under Stones -->
  <g id="stoneShadows" fill="#09090b" opacity="0.45" filter="url(#campShadowFilter)">
    <circle cx="64" cy="66" r="38" />
  </g>

  <!-- Ash Pit Bed -->
  <ellipse cx="64" cy="64" rx="28" ry="26" fill="#1c1917" stroke="#0c0a09" stroke-width="1.2" />
  <ellipse cx="64" cy="64" rx="22" ry="20" fill="url(#emberBedGrad)" />

  <!-- Ring of River Stones (11 Smooth Stones Encircling the Pit) -->
  <!-- Stone 1 (North) -->
  <g transform="translate(64, 28)">
    <ellipse cx="0" cy="0" rx="9" ry="6.5" fill="url(#stoneGrad1)" stroke="#0f172a" stroke-width="0.75" />
    <path d="M -6 1 C -3 4, 3 4, 6 1" stroke="#fef08a" stroke-width="0.8" fill="none" opacity="0.6" />
  </g>
  <!-- Stone 2 (North-East) -->
  <g transform="translate(84, 34) rotate(30)">
    <ellipse cx="0" cy="0" rx="8.5" ry="6" fill="url(#stoneGrad2)" stroke="#1c1917" stroke-width="0.75" />
    <path d="M -5 1 C -2 3.5, 2 3.5, 5 1" stroke="#fef08a" stroke-width="0.8" fill="none" opacity="0.6" />
  </g>
  <!-- Stone 3 (East-North-East) -->
  <g transform="translate(97, 50) rotate(65)">
    <ellipse cx="0" cy="0" rx="9" ry="6.5" fill="url(#stoneGrad1)" stroke="#0f172a" stroke-width="0.75" />
    <path d="M -5 1 C -2 3.5, 2 3.5, 5 1" stroke="#fef08a" stroke-width="0.8" fill="none" opacity="0.6" />
  </g>
  <!-- Stone 4 (East-South-East) -->
  <g transform="translate(98, 72) rotate(110)">
    <ellipse cx="0" cy="0" rx="8.5" ry="6" fill="url(#stoneGrad2)" stroke="#1c1917" stroke-width="0.75" />
    <path d="M -5 1 C -2 3.5, 2 3.5, 5 1" stroke="#fef08a" stroke-width="0.8" fill="none" opacity="0.6" />
  </g>
  <!-- Stone 5 (South-East) -->
  <g transform="translate(86, 91) rotate(145)">
    <ellipse cx="0" cy="0" rx="9.5" ry="7" fill="url(#stoneGrad1)" stroke="#0f172a" stroke-width="0.75" />
    <path d="M -6 1 C -3 4, 3 4, 6 1" stroke="#fef08a" stroke-width="0.8" fill="none" opacity="0.6" />
  </g>
  <!-- Stone 6 (South) -->
  <g transform="translate(64, 98)">
    <ellipse cx="0" cy="0" rx="10" ry="7" fill="url(#stoneGrad2)" stroke="#1c1917" stroke-width="0.75" />
    <path d="M -6 -1 C -3 -4, 3 -4, 6 -1" stroke="#fef08a" stroke-width="0.8" fill="none" opacity="0.6" />
  </g>
  <!-- Stone 7 (South-West) -->
  <g transform="translate(42, 91) rotate(-145)">
    <ellipse cx="0" cy="0" rx="9" ry="6.5" fill="url(#stoneGrad1)" stroke="#0f172a" stroke-width="0.75" />
    <path d="M -5 1 C -2 3.5, 2 3.5, 5 1" stroke="#fef08a" stroke-width="0.8" fill="none" opacity="0.6" />
  </g>
  <!-- Stone 8 (West-South-West) -->
  <g transform="translate(30, 72) rotate(-110)">
    <ellipse cx="0" cy="0" rx="8.5" ry="6" fill="url(#stoneGrad2)" stroke="#1c1917" stroke-width="0.75" />
    <path d="M -5 1 C -2 3.5, 2 3.5, 5 1" stroke="#fef08a" stroke-width="0.8" fill="none" opacity="0.6" />
  </g>
  <!-- Stone 9 (West-North-West) -->
  <g transform="translate(31, 50) rotate(-65)">
    <ellipse cx="0" cy="0" rx="9" ry="6.5" fill="url(#stoneGrad1)" stroke="#0f172a" stroke-width="0.75" />
    <path d="M -5 1 C -2 3.5, 2 3.5, 5 1" stroke="#fef08a" stroke-width="0.8" fill="none" opacity="0.6" />
  </g>
  <!-- Stone 10 (North-West) -->
  <g transform="translate(44, 34) rotate(-30)">
    <ellipse cx="0" cy="0" rx="8.5" ry="6" fill="url(#stoneGrad2)" stroke="#1c1917" stroke-width="0.75" />
    <path d="M -5 1 C -2 3.5, 2 3.5, 5 1" stroke="#fef08a" stroke-width="0.8" fill="none" opacity="0.6" />
  </g>

  <!-- Crossed Charred Firewood Logs -->
  <!-- Log 1 (-35 deg) -->
  <g transform="translate(64, 64) rotate(-35)">
    <rect x="-24" y="-4.5" width="48" height="9" rx="3.5" fill="url(#charredLog)" stroke="#09090b" stroke-width="0.8" />
    <ellipse cx="-22" cy="0" rx="2.5" ry="4" fill="#92400e" stroke="#271003" stroke-width="0.6" />
    <!-- Glowing char crack -->
    <path d="M -8 -1 L 10 1" stroke="#ea580c" stroke-width="0.9" opacity="0.8" />
  </g>

  <!-- Log 2 (45 deg) -->
  <g transform="translate(64, 64) rotate(45)">
    <rect x="-25" y="-5" width="50" height="10" rx="3.5" fill="url(#charredLog)" stroke="#09090b" stroke-width="0.8" />
    <ellipse cx="23" cy="0" rx="2.5" ry="4" fill="#92400e" stroke="#271003" stroke-width="0.6" />
    <path d="M -10 0 L 12 -1" stroke="#ea580c" stroke-width="0.9" opacity="0.8" />
  </g>

  <!-- Log 3 (-80 deg) -->
  <g transform="translate(64, 64) rotate(-80)">
    <rect x="-21" y="-4" width="42" height="8" rx="3" fill="url(#charredLog)" stroke="#09090b" stroke-width="0.8" />
    <ellipse cx="-19" cy="0" rx="2" ry="3.5" fill="#92400e" stroke="#271003" stroke-width="0.6" />
  </g>

  <!-- Roaring Campfire Flame Petals -->
  <!-- Layer 1: Crimson Outer Flares -->
  <path d="M 64 42 C 78 46, 84 58, 80 70 C 76 82, 58 84, 50 74 C 44 64, 50 48, 64 42 Z"
        fill="#dc2626" opacity="0.9" />

  <!-- Layer 2: Crackling Orange Flame Petals -->
  <path d="M 64 44 C 70 50, 76 52, 80 48 C 78 58, 84 64, 82 72 C 76 78, 72 76, 70 82 C 62 86, 54 84, 50 78 C 48 72, 44 72, 42 66 C 45 60, 52 56, 50 48 C 56 52, 60 50, 64 44 Z"
        fill="#f97316" />

  <!-- Layer 3: Blazing Golden Yellow Flame Core -->
  <path d="M 64 48 C 68 54, 74 56, 75 52 C 74 60, 78 64, 76 70 C 70 76, 64 78, 62 76 C 58 78, 54 74, 52 68 C 50 62, 54 60, 52 54 C 56 56, 60 54, 64 48 Z"
        fill="#fde047" />

  <!-- Layer 4: White-Hot Flame Eye -->
  <ellipse cx="64" cy="64" rx="6.5" ry="5.5" fill="#ffffff" />
  <circle cx="64" cy="62" r="3.2" fill="#ffffff" />

  <!-- Drifting Ember Sparks -->
  <circle cx="54" cy="42" r="1.3" fill="#fef08a" />
  <circle cx="76" cy="38" r="1.5" fill="#fef08a" />
  <circle cx="86" cy="54" r="1.1" fill="#f97316" />
  <circle cx="42" cy="70" r="1.2" fill="#fde047" />
  <circle cx="78" cy="80" r="1.2" fill="#f97316" />
  <circle cx="36" cy="54" r="1" fill="#fef08a" />
  <circle cx="66" cy="24" r="1" fill="#fde047" />
  <circle cx="60" cy="18" r="0.8" fill="#fef08a" />
</svg>
