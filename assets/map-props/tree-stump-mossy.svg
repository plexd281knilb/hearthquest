<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Soft Ground Cast Shadow Blur -->
    <filter id="stumpShadowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" />
    </filter>

    <!-- Gnarled Root & Bark Gradient -->
    <linearGradient id="stumpBark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d2812" />
      <stop offset="50%" stop-color="#361b0a" />
      <stop offset="100%" stop-color="#1e0c03" />
    </linearGradient>

    <!-- Cut Heartwood Face Radial Gradient -->
    <radialGradient id="stumpHeartwood" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ddb082" />
      <stop offset="40%" stop-color="#c89665" />
      <stop offset="75%" stop-color="#aa7648" />
      <stop offset="92%" stop-color="#8a562d" />
      <stop offset="100%" stop-color="#5a3214" />
    </radialGradient>

    <!-- Velvet Moss Cushion Gradients -->
    <radialGradient id="stumpMoss1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="50%" stop-color="#4d7c0f" />
      <stop offset="100%" stop-color="#283618" />
    </radialGradient>

    <radialGradient id="stumpMoss2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="45%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#365314" />
    </radialGradient>

    <!-- Cream Toadstool Cap Gradient -->
    <radialGradient id="toadstoolCap" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fef9c3" />
      <stop offset="85%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
  </defs>

  <!-- ==================== AMBIENT GROUND CAST SHADOW ==================== -->
  <g filter="url(#stumpShadowBlur)" opacity="0.6">
    <ellipse cx="68" cy="68" rx="46" ry="40" fill="#080a06" />
    <!-- Root flare shadows -->
    <polygon points="68,68 106,50 98,72 108,94 82,90 74,112 56,98 32,102 44,82 20,54 44,48 58,26 78,44" fill="#080a06" />
  </g>

  <!-- ==================== GNARLED ROOT FLARES ==================== -->
  <g fill="url(#stumpBark)" stroke="#1a0b03" stroke-width="1.0">
    <!-- North Flare -->
    <path d="M 52 38 Q 54 22 60 18 Q 66 22 68 36 Z" />
    <!-- North-East Flare -->
    <path d="M 78 40 Q 94 30 102 36 Q 96 48 84 50 Z" />
    <!-- South-East Flare -->
    <path d="M 86 70 Q 102 82 104 90 Q 92 98 78 86 Z" />
    <!-- South Flare -->
    <path d="M 72 88 Q 72 106 66 110 Q 58 106 58 88 Z" />
    <!-- South-West Flare -->
    <path d="M 44 82 Q 30 96 24 92 Q 26 80 40 70 Z" />
    <!-- North-West Flare -->
    <path d="M 40 50 Q 22 40 26 32 Q 38 34 46 44 Z" />
  </g>

  <!-- ==================== OUTER CORRUGATED BARK RING ==================== -->
  <path d="M 64 24 C 84 22, 100 36, 102 56 C 104 76, 92 94, 76 98 C 56 102, 36 94, 30 76 C 24 56, 38 28, 64 24 Z" fill="url(#stumpBark)" stroke="#150802" stroke-width="1.4" />

  <!-- Bark Ridge Furrows & Grain Texture -->
  <g stroke="#180a03" stroke-width="1.1" fill="none">
    <path d="M 88 38 C 96 48, 98 62, 94 76" />
    <path d="M 94 48 C 100 58, 100 70, 96 82" stroke-width="0.8" />
    <path d="M 38 42 C 32 54, 30 68, 36 80" />
    <path d="M 46 90 C 58 98, 72 98, 82 92" />
    <path d="M 52 28 C 66 24, 78 26, 86 32" />
  </g>

  <!-- ==================== CUT HEARTWOOD FACE ==================== -->
  <g>
    <!-- Smooth Saw-Cut Wood Face -->
    <ellipse cx="63" cy="62" rx="32" ry="28" fill="url(#stumpHeartwood)" stroke="#2d1506" stroke-width="1.4" />

    <!-- Sunlit Northwest Rim Chamfer -->
    <path d="M 36 70 C 32 52, 44 38, 63 34 C 76 34, 88 40, 94 50" fill="none" stroke="#fed7aa" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- Southeast Shadow Under-Rim -->
    <path d="M 94 52 C 98 66, 90 84, 74 88 C 58 92, 44 86, 36 72" fill="none" stroke="#2a1204" stroke-width="1.4" stroke-opacity="0.75" />

    <!-- Concentric Annular Growth Rings -->
    <g fill="none" stroke="#784720" stroke-linecap="round">
      <!-- Ring 1 (Outer) -->
      <path d="M 38 64 C 36 48, 50 38, 64 38 C 78 38, 88 48, 88 64 C 88 78, 76 86, 62 86 C 48 86, 40 78, 38 64 Z" stroke-width="1.0" stroke-opacity="0.5" />
      <!-- Ring 2 -->
      <path d="M 43 63 C 41 51, 51 43, 63 43 C 75 43, 83 51, 83 63 C 83 74, 73 81, 62 81 C 51 81, 45 74, 43 63 Z" stroke-width="1.1" stroke-opacity="0.55" />
      <!-- Ring 3 -->
      <path d="M 48 62 C 47 53, 54 48, 63 48 C 72 48, 78 54, 78 62 C 78 71, 71 76, 62 76 C 54 76, 49 70, 48 62 Z" stroke-width="1.0" stroke-opacity="0.6" />
      <!-- Ring 4 -->
      <path d="M 53 62 C 52 56, 57 52, 63 52 C 69 52, 73 56, 73 62 C 73 68, 68 72, 63 72 C 57 72, 54 68, 53 62 Z" stroke-width="0.9" stroke-opacity="0.65" />
      <!-- Ring 5 -->
      <ellipse cx="63" cy="62" rx="6" ry="5.5" stroke-width="0.9" stroke-opacity="0.7" />
      <!-- Ring 6 (Inner Core Pith) -->
      <ellipse cx="63" cy="62" rx="2.5" ry="2.2" stroke-width="0.8" stroke-opacity="0.8" fill="#3a1c09" />
    </g>

    <!-- Radial Drying Cracks / Checks in Heartwood -->
    <g fill="none" stroke="#361706" stroke-linecap="round">
      <path d="M 63 62 L 74 72 L 84 76" stroke-width="1.2" />
      <path d="M 74 72 L 79 68" stroke-width="0.7" />
      <path d="M 63 62 L 53 54 L 44 52" stroke-width="1.1" />
      <path d="M 63 62 L 61 46" stroke-width="0.9" />
    </g>
  </g>

  <!-- ==================== PLUSH EMERALD MOSS CUSHION ==================== -->
  <!-- Moss Spilling Over NW Bark onto Cut Face -->
  <g stroke="#1a2e05" stroke-width="0.6">
    <!-- Base Moss Mound -->
    <path d="M 32 46 C 26 34, 42 24, 52 28 C 58 24, 72 26, 70 36 C 68 44, 56 46, 52 52 C 44 56, 34 58, 32 46 Z" fill="url(#stumpMoss1)" />

    <!-- Secondary Cushion Lobes -->
    <circle cx="40" cy="38" r="9.5" fill="url(#stumpMoss1)" />
    <circle cx="52" cy="36" r="8.5" fill="url(#stumpMoss2)" />
    <circle cx="34" cy="50" r="7.5" fill="url(#stumpMoss2)" />
    <circle cx="44" cy="48" r="9" fill="url(#stumpMoss2)" />
    <circle cx="54" cy="44" r="7" fill="url(#stumpMoss1)" />

    <!-- Tiny Droplet Moss Details creeping onto heartwood -->
    <circle cx="48" cy="56" r="3.2" fill="#84cc16" />
    <circle cx="56" cy="52" r="2.8" fill="#65a30d" />
    <circle cx="38" cy="60" r="2.5" fill="#4d7c0f" />
    <circle cx="62" cy="40" r="3.0" fill="#84cc16" />

    <!-- Moss Clumps on Southern Roots -->
    <circle cx="74" cy="92" r="3.8" fill="#4d7c0f" />
    <circle cx="77" cy="93" r="2.4" fill="#84cc16" />
    <circle cx="42" cy="80" r="3.2" fill="#365314" />
  </g>

  <!-- ==================== TINY CREAM WOODLAND TOADSTOOLS ==================== -->
  <g>
    <!-- Toadstool 1 (Medium at x=34, y=36) -->
    <g transform="translate(34, 36) rotate(-15)">
      <!-- Stalk -->
      <path d="M 0 5 L -1 1" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round" fill="none" />
      <ellipse cx="-1" cy="0" rx="4.8" ry="3.5" fill="url(#toadstoolCap)" stroke="#a16207" stroke-width="0.6" />
      <!-- Speckle dots on cap -->
      <circle cx="-2" cy="-1" r="0.6" fill="#ffffff" />
      <circle cx="1" cy="0" r="0.5" fill="#ffffff" />
    </g>

    <!-- Toadstool 2 (Small at x=28, y=44) -->
    <g transform="translate(28, 44) rotate(-30)">
      <path d="M 0 4 L -1 1" stroke="#ca8a04" stroke-width="1.0" stroke-linecap="round" fill="none" />
      <ellipse cx="-1" cy="0" rx="3.6" ry="2.6" fill="url(#toadstoolCap)" stroke="#a16207" stroke-width="0.5" />
      <circle cx="-1" cy="-0.5" r="0.5" fill="#ffffff" />
    </g>

    <!-- Toadstool 3 (Button at x=41, y=30) -->
    <g transform="translate(41, 30) rotate(10)">
      <ellipse cx="0" cy="0" rx="3.2" ry="2.4" fill="url(#toadstoolCap)" stroke="#a16207" stroke-width="0.5" />
      <circle cx="0.5" cy="-0.5" r="0.4" fill="#ffffff" />
    </g>

    <!-- Toadstool 4 (Sprouting near heartwood edge at x=42, y=56) -->
    <g transform="translate(42, 56) rotate(45)">
      <ellipse cx="0" cy="0" rx="2.8" ry="2.0" fill="url(#toadstoolCap)" stroke="#a16207" stroke-width="0.5" />
    </g>
  </g>
</svg>