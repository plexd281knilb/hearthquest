<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bbShadow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#040d08" stop-opacity="0.62" />
      <stop offset="72%" stop-color="#040d08" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#040d08" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bbLeafDark" cx="46%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#22633a" />
      <stop offset="65%" stop-color="#144326" />
      <stop offset="100%" stop-color="#0a2715" />
    </radialGradient>
    <radialGradient id="bbLeafMid" cx="42%" cy="38%" r="54%">
      <stop offset="0%" stop-color="#48a860" />
      <stop offset="65%" stop-color="#23703d" />
      <stop offset="100%" stop-color="#144525" />
    </radialGradient>
    <radialGradient id="bbLeafBright" cx="38%" cy="34%" r="52%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="55%" stop-color="#34a85a" />
      <stop offset="100%" stop-color="#1b6938" />
    </radialGradient>
    <radialGradient id="bbRedBerry" cx="34%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fecaca" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>
    <radialGradient id="bbBlueBerry" cx="34%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="42%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>
  </defs>

  <!-- Soft Ambient Ground Shadow -->
  <ellipse cx="66" cy="70" rx="52" ry="48" fill="url(#bbShadow)" />

  <!-- Woody Twig & Stem Under-Lattice -->
  <g stroke="#4a2e19" stroke-width="3.2" stroke-linecap="round" fill="none">
    <path d="M 64 66 Q 42 48 24 38" />
    <path d="M 64 66 Q 86 44 104 34" />
    <path d="M 64 66 Q 42 86 24 94" />
    <path d="M 64 66 Q 88 86 105 94" />
    <path d="M 64 66 Q 64 36 64 18" />
  </g>

  <!-- Outer Dark-Green Shrub Lobes -->
  <g stroke="#082112" stroke-width="1.3">
    <circle cx="34" cy="52" r="21" fill="url(#bbLeafDark)" />
    <circle cx="92" cy="48" r="22" fill="url(#bbLeafDark)" />
    <circle cx="38" cy="86" r="21" fill="url(#bbLeafDark)" />
    <circle cx="88" cy="84" r="22" fill="url(#bbLeafDark)" />
    <circle cx="64" cy="30" r="22" fill="url(#bbLeafDark)" />
    <circle cx="64" cy="96" r="20" fill="url(#bbLeafDark)" />
  </g>

  <!-- Mid-Canopy Overlapping Leaf Clusters -->
  <g stroke="#0e311b" stroke-width="1.2">
    <circle cx="44" cy="46" r="18" fill="url(#bbLeafMid)" />
    <circle cx="82" cy="45" r="18" fill="url(#bbLeafMid)" />
    <circle cx="45" cy="80" r="17" fill="url(#bbLeafMid)" />
    <circle cx="82" cy="79" r="18" fill="url(#bbLeafMid)" />
    <circle cx="63" cy="64" r="24" fill="url(#bbLeafMid)" />
    <circle cx="29" cy="67" r="14" fill="url(#bbLeafMid)" />
    <circle cx="98" cy="65" r="14" fill="url(#bbLeafMid)" />
  </g>

  <!-- Sunlit Upper Leaf Rosettes & Edge Serations -->
  <g stroke="#14532d" stroke-width="1">
    <ellipse cx="52" cy="48" rx="13" ry="11" fill="url(#bbLeafBright)" />
    <ellipse cx="76" cy="52" rx="12" ry="10" fill="url(#bbLeafBright)" />
    <ellipse cx="58" cy="74" rx="13" ry="10" fill="url(#bbLeafBright)" />
    <ellipse cx="64" cy="59" rx="14" ry="12" fill="url(#bbLeafBright)" />
    <circle cx="38" cy="60" r="9" fill="url(#bbLeafBright)" />
    <circle cx="88" cy="66" r="9" fill="url(#bbLeafBright)" />
  </g>

  <!-- Crisp Leaf Vein Accent Strokes -->
  <g stroke="#dcfce7" stroke-width="1.1" stroke-opacity="0.48" stroke-linecap="round" fill="none">
    <path d="M 46 47 L 57 49" />
    <path d="M 71 52 L 82 50" />
    <path d="M 59 58 L 69 57" />
    <path d="M 52 75 L 62 72" />
  </g>

  <!-- Wild Red & Blue Berry Clusters with Specular Catchlights -->
  <g>
    <circle cx="44" cy="44" r="3.6" fill="url(#bbRedBerry)" />
    <circle cx="49" cy="49" r="3.2" fill="url(#bbRedBerry)" />
    <circle cx="41" cy="50" r="3.1" fill="url(#bbRedBerry)" />

    <circle cx="81" cy="46" r="3.6" fill="url(#bbBlueBerry)" />
    <circle cx="86" cy="51" r="3.2" fill="url(#bbBlueBerry)" />
    <circle cx="77" cy="51" r="3.0" fill="url(#bbBlueBerry)" />

    <circle cx="62" cy="62" r="3.7" fill="url(#bbRedBerry)" />
    <circle cx="67" cy="66" r="3.2" fill="url(#bbRedBerry)" />

    <circle cx="47" cy="79" r="3.5" fill="url(#bbBlueBerry)" />
    <circle cx="52" cy="83" r="3.1" fill="url(#bbBlueBerry)" />

    <circle cx="82" cy="77" r="3.6" fill="url(#bbRedBerry)" />
    <circle cx="86" cy="82" r="3.1" fill="url(#bbRedBerry)" />

    <circle cx="66" cy="34" r="3.3" fill="url(#bbBlueBerry)" />
    <circle cx="61" cy="38" r="3.0" fill="url(#bbBlueBerry)" />

    <circle cx="33" cy="65" r="3.2" fill="url(#bbRedBerry)" />
    <circle cx="94" cy="63" r="3.2" fill="url(#bbBlueBerry)" />
  </g>
</svg>
