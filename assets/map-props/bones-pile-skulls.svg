<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="bonesDustShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" />
    </filter>

    <!-- Ivory Bone Gradient -->
    <radialGradient id="ivoryBone" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef3c7" />
      <stop offset="75%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>

    <linearGradient id="longBoneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Weathered Buckler Wood & Iron -->
    <radialGradient id="shieldBoss" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#271003" />
    </radialGradient>

    <linearGradient id="ironShieldRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Ambient Ground & Dungeon Dust Shadow -->
  <g id="dustShadow" fill="#09090b" opacity="0.45" filter="url(#bonesDustShadow)">
    <circle cx="52" cy="68" r="28" />
    <circle cx="74" cy="56" r="22" />
    <ellipse cx="64" cy="66" rx="42" ry="26" />
  </g>

  <!-- Half-Buried Cracked Adventurer Buckler (Shield) -->
  <g id="crackedBuckler" transform="translate(48, 70) rotate(-18)">
    <!-- Weathered Buckler Wood Planks -->
    <circle cx="0" cy="0" r="22" fill="#52525b" stroke="#18181b" stroke-width="1.2" />

    <!-- Wood Plank Seams -->
    <line x1="-7" y1="-21" x2="-7" y2="21" stroke="#27272a" stroke-width="1.1" />
    <line x1="7" y1="-21" x2="7" y2="21" stroke="#27272a" stroke-width="1.1" />

    <!-- Split Crack in Shield Wood -->
    <path d="M -16 -10 L -4 -2 L -10 6 L 2 18" stroke="#18181b" stroke-width="1.5" fill="none" />

    <!-- Buckler Outer Iron Rim Hoop -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#ironShieldRim)" stroke-width="2.5" />
    <circle cx="0" cy="0" r="23.2" fill="none" stroke="#09090b" stroke-width="0.8" />
    <circle cx="0" cy="0" r="20.8" fill="none" stroke="#cbd5e1" stroke-width="0.5" opacity="0.4" />

    <!-- Rim Rivets -->
    <circle cx="0" cy="-21" r="1" fill="#cbd5e1" stroke="#09090b" stroke-width="0.3" />
    <circle cx="21" cy="0" r="1" fill="#cbd5e1" stroke="#09090b" stroke-width="0.3" />
    <circle cx="0" cy="21" r="1" fill="#cbd5e1" stroke="#09090b" stroke-width="0.3" />
    <circle cx="-21" cy="0" r="1" fill="#cbd5e1" stroke="#09090b" stroke-width="0.3" />

    <!-- Conical Bronze / Iron Shield Boss in Center -->
    <circle cx="0" cy="0" r="8" fill="url(#shieldBoss)" stroke="#1c0a01" stroke-width="0.8" />
    <circle cx="-1" cy="-1" r="2.5" fill="#fde68a" opacity="0.6" />
    <circle cx="0" cy="0" r="8.8" fill="none" stroke="#ca8a04" stroke-width="0.5" />
  </g>

  <!-- Crossed Femur Long Bones -->
  <!-- Long Bone 1 (Crossing diagonally: top-left to bottom-right) -->
  <g id="femur1" transform="translate(62, 64) rotate(42)">
    <g fill="url(#longBoneGrad)" stroke="#475569" stroke-width="0.75">
      <!-- Shaft -->
      <rect x="-24" y="-3.5" width="48" height="7" rx="3.5" />
      <!-- Left Double Condyles -->
      <circle cx="-24" cy="-3.5" r="4.2" />
      <circle cx="-24" cy="3.5" r="4.2" />
      <!-- Right Double Condyles -->
      <circle cx="24" cy="-3.5" r="4.2" />
      <circle cx="24" cy="3.5" r="4.2" />
    </g>
    <!-- Bone Specular Ridge -->
    <path d="M -18 -1 L 18 -1" stroke="#ffffff" stroke-width="0.8" opacity="0.7" />
  </g>

  <!-- Long Bone 2 (Crossing diagonally: bottom-left to top-right) -->
  <g id="femur2" transform="translate(64, 66) rotate(-38)">
    <g fill="url(#longBoneGrad)" stroke="#475569" stroke-width="0.75">
      <!-- Shaft -->
      <rect x="-26" y="-3.5" width="52" height="7" rx="3.5" />
      <!-- Left Double Condyles -->
      <circle cx="-26" cy="-3.5" r="4.2" />
      <circle cx="-26" cy="3.5" r="4.2" />
      <!-- Right Double Condyles -->
      <circle cx="26" cy="-3.5" r="4.2" />
      <circle cx="26" cy="3.5" r="4.2" />
    </g>
    <!-- Bone Specular Ridge -->
    <path d="M -20 -1 L 20 -1" stroke="#ffffff" stroke-width="0.8" opacity="0.7" />
  </g>

  <!-- Curved Rib Splinters & Spinal Vertebrae Discs -->
  <g id="ribSplinters" fill="none" stroke="url(#longBoneGrad)" stroke-width="2.2" stroke-linecap="round">
    <!-- Rib 1 (Curving under skull) -->
    <path d="M 36 44 C 44 38, 56 38, 62 46" />
    <!-- Rib 2 (Curving near buckler) -->
    <path d="M 32 88 C 42 96, 54 94, 60 86" />
    <!-- Rib 3 (Curving south-east) -->
    <path d="M 76 86 C 86 92, 96 88, 102 78" />
  </g>

  <!-- Spinal Vertebrae Discs Scattered -->
  <g id="vertebrae">
    <circle cx="44" cy="48" r="3.2" fill="url(#ivoryBone)" stroke="#475569" stroke-width="0.6" />
    <circle cx="44" cy="48" r="1.2" fill="#1e293b" />
    <circle cx="86" cy="82" r="3.2" fill="url(#ivoryBone)" stroke="#475569" stroke-width="0.6" />
    <circle cx="86" cy="82" r="1.2" fill="#1e293b" />
    <circle cx="98" cy="68" r="2.8" fill="url(#ivoryBone)" stroke="#475569" stroke-width="0.6" />
    <circle cx="98" cy="68" r="1" fill="#1e293b" />
  </g>

  <!-- Weathered Ivory Skull (Top-Down View, resting proudly) -->
  <g id="ivorySkull" transform="translate(74, 52) rotate(14)">
    <!-- Skull Drop Shadow -->
    <ellipse cx="0" cy="2" rx="17" ry="19" fill="#09090b" opacity="0.3" filter="url(#bonesDustShadow)" />

    <!-- Cranium / Calvarium Base Silhouette -->
    <path d="M -14 -4 C -14 -16, 14 -16, 14 -4 C 15 4, 11 14, 7 18 C 3 20, -3 20, -7 18 C -11 14, -15 4, -14 -4 Z"
          fill="url(#ivoryBone)" stroke="#334155" stroke-width="1.1" />

    <!-- Cranial Suture Lines (Coronal & Sagittal Sutures) -->
    <path d="M -11 -6 Q -6 -4, 0 -7 Q 6 -4, 11 -6" fill="none" stroke="#64748b" stroke-width="0.6" stroke-dasharray="1.2 0.8" opacity="0.75" />
    <path d="M 0 -7 Q 1 -13, 0 -16" fill="none" stroke="#64748b" stroke-width="0.6" stroke-dasharray="1.2 0.8" opacity="0.75" />

    <!-- Weathered Hairline Crack on Brow -->
    <path d="M 4 -12 L 2 -6 L 5 -2" fill="none" stroke="#475569" stroke-width="0.65" opacity="0.8" />

    <!-- Brow Ridge Highlight Arches -->
    <path d="M -11 2 C -8 0, -4 0, -2 3" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.8" />
    <path d="M 2 3 C 4 0, 8 0, 11 2" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.8" />

    <!-- Dark Recessed Eye Orbits -->
    <ellipse cx="-6" cy="6" rx="4" ry="4.5" fill="#0f172a" stroke="#334155" stroke-width="0.6" />
    <ellipse cx="6" cy="6" rx="4" ry="4.5" fill="#0f172a" stroke="#334155" stroke-width="0.6" />

    <!-- Nasal Cavity (Inverted Heart/Teardrop Notch) -->
    <path d="M 0 10 L -2 14 Q 0 15 2 14 Z" fill="#0f172a" />

    <!-- Maxillary Dental Row / Teeth Arch -->
    <g id="teeth" fill="#fef9c3" stroke="#475569" stroke-width="0.4">
      <rect x="-5" y="17" width="2" height="2.5" rx="0.5" />
      <rect x="-2.5" y="17.5" width="2.2" height="2.5" rx="0.5" />
      <rect x="0.3" y="17.5" width="2.2" height="2.5" rx="0.5" />
      <rect x="3" y="17" width="2" height="2.5" rx="0.5" />
    </g>

    <!-- Zygomatic Cheekbone Arches -->
    <path d="M -12 7 C -14 11, -12 15, -9 15" fill="none" stroke="#64748b" stroke-width="0.8" />
    <path d="M 12 7 C 14 11, 12 15, 9 15" fill="none" stroke="#64748b" stroke-width="0.8" />

    <!-- Cranium Specular Highlight -->
    <ellipse cx="-4" cy="-8" rx="5" ry="3.5" fill="#ffffff" opacity="0.6" />
  </g>
</svg>
