<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shelfShadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
    <filter id="candleGlowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>

    <linearGradient id="oakCornice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="35%" stop-color="#a16207" />
      <stop offset="70%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="oakBaseDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#240e02" />
    </linearGradient>

    <linearGradient id="scrollGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <radialGradient id="brassCandle" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#eab308" />
      <stop offset="85%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>

    <radialGradient id="candleLightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#fde047" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <rect x="8" y="44" width="112" height="42" rx="4" fill="#09090b" opacity="0.4" filter="url(#shelfShadowFilter)" />

  <!-- Bookcase Structure -->
  <g id="bookshelfStructure">
    <!-- Back & Side Timber Walls -->
    <rect x="10" y="44" width="108" height="38" rx="2" fill="url(#oakBaseDark)" stroke="#1a0901" stroke-width="1.2" />

    <!-- Interior Shelf Recess Bed (Deep Shadow) -->
    <rect x="14" y="52" width="100" height="23" fill="#1c0a01" />

    <!-- Books on Shelf (Top-Down Spines & Paper Tops) -->
    <!-- Book 1: Heavy Crimson Tome -->
    <g id="book1" transform="translate(16, 53)">
      <rect x="0" y="0" width="5.5" height="20" rx="0.8" fill="#881337" stroke="#4c0519" stroke-width="0.5" />
      <rect x="0.8" y="1" width="3.9" height="18" fill="#fef3c7" />
      <path d="M 0 4 L 5.5 4 M 0 10 L 5.5 10 M 0 16 L 5.5 16" stroke="#fbbf24" stroke-width="0.6" />
    </g>

    <!-- Book 2: Midnight Blue Folio -->
    <g id="book2" transform="translate(22.5, 53)">
      <rect x="0" y="0" width="4.5" height="21" rx="0.8" fill="#1e3a8a" stroke="#0f172a" stroke-width="0.5" />
      <rect x="0.6" y="1" width="3.3" height="19" fill="#f8fafc" />
      <path d="M 0 5 L 4.5 5 M 0 15 L 4.5 15" stroke="#e2e8f0" stroke-width="0.6" />
    </g>

    <!-- Book 3: Emerald Grimoire -->
    <g id="book3" transform="translate(28, 54)">
      <rect x="0" y="0" width="6" height="19" rx="0.8" fill="#065f46" stroke="#022c22" stroke-width="0.5" />
      <rect x="0.8" y="1" width="4.4" height="17" fill="#fef3c7" />
      <path d="M 0 7 L 6 7 M 0 13 L 6 13" stroke="#facc15" stroke-width="0.6" />
    </g>

    <!-- Book 4: Russet Brown Codex -->
    <g id="book4" transform="translate(35, 53)">
      <rect x="0" y="0" width="4" height="20" rx="0.8" fill="#78350f" stroke="#291102" stroke-width="0.5" />
      <rect x="0.6" y="1" width="2.8" height="18" fill="#fef3c7" />
    </g>

    <!-- Book 5: Royal Purple Arcana -->
    <g id="book5" transform="translate(40, 53.5)">
      <rect x="0" y="0" width="5" height="19.5" rx="0.8" fill="#581c87" stroke="#2e1065" stroke-width="0.5" />
      <rect x="0.7" y="1" width="3.6" height="17.5" fill="#fef3c7" />
      <path d="M 0 6 L 5 6 M 0 14 L 5 14" stroke="#eab308" stroke-width="0.6" />
    </g>

    <!-- Book 6 & 7: Leaning Books -->
    <g id="book6" transform="translate(47.5, 54) rotate(7)">
      <rect x="0" y="0" width="4.5" height="18" rx="0.8" fill="#991b1b" stroke="#450a0a" stroke-width="0.5" />
      <rect x="0.6" y="1" width="3.3" height="16" fill="#fef3c7" />
    </g>
    <g id="book7" transform="translate(54, 55.5) rotate(14)">
      <rect x="0" y="0" width="4" height="17" rx="0.8" fill="#0f766e" stroke="#042f2e" stroke-width="0.5" />
      <rect x="0.5" y="1" width="3" height="15" fill="#fef3c7" />
    </g>

    <!-- Central Partition Divider -->
    <rect x="63" y="52" width="3" height="23" fill="#3b1704" stroke="#1c0a01" stroke-width="0.5" />

    <!-- Rolled Parchment Scrolls Stacked -->
    <!-- Scroll 1 -->
    <g id="scroll1" transform="translate(68, 55)">
      <rect x="0" y="0" width="16" height="5" rx="2.5" fill="url(#scrollGrad)" stroke="#b45309" stroke-width="0.6" />
      <!-- Red ribbon tie -->
      <rect x="7" y="0" width="2.2" height="5" fill="#dc2626" />
    </g>
    <!-- Scroll 2 -->
    <g id="scroll2" transform="translate(69, 61)">
      <rect x="0" y="0" width="18" height="5.5" rx="2.7" fill="url(#scrollGrad)" stroke="#b45309" stroke-width="0.6" />
      <rect x="8" y="0" width="2.5" height="5.5" fill="#2563eb" />
    </g>
    <!-- Scroll 3 (Slight angle) -->
    <g id="scroll3" transform="translate(68, 68) rotate(-4)">
      <rect x="0" y="0" width="15" height="4.5" rx="2.2" fill="url(#scrollGrad)" stroke="#b45309" stroke-width="0.6" />
      <rect x="6" y="0" width="2" height="4.5" fill="#16a34a" />
    </g>

    <!-- Brass Candle Saucer with glowing candle -->
    <g id="candleSaucer" transform="translate(101, 63)">
      <!-- Candle Light Ambient Glow -->
      <circle cx="0" cy="0" r="22" fill="url(#candleLightGlow)" filter="url(#candleGlowFilter)" />
      <!-- Brass Saucer Dish -->
      <ellipse cx="0" cy="0" rx="9" ry="8" fill="url(#brassCandle)" stroke="#713f12" stroke-width="0.8" />
      <!-- Saucer Lip ring -->
      <ellipse cx="0" cy="0" rx="7.2" ry="6.2" fill="none" stroke="#fef08a" stroke-width="0.5" opacity="0.6" />
      <!-- Finger Ring Handle -->
      <path d="M 8 -2 C 12 -3, 12 3, 8 2" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round" />
      <!-- Tallow Candle Stub -->
      <ellipse cx="0" cy="-0.5" rx="3.5" ry="3" fill="#fef9c3" stroke="#d97706" stroke-width="0.5" />
      <!-- Black Wick & Flame -->
      <circle cx="0" cy="-0.8" r="0.9" fill="#18181b" />
      <circle cx="0" cy="-1.5" r="2" fill="#fde047" />
      <circle cx="0" cy="-1.5" r="1" fill="#ffffff" />
    </g>

    <!-- Moulded Oak Top Cornice (Heavy Timber Overhang) -->
    <rect x="10" y="44" width="108" height="8.5" rx="2" fill="url(#oakCornice)" stroke="#240e02" stroke-width="1" />
    <!-- Cornice Top Specular Highlight Edge -->
    <path d="M 12 45 L 116 45" stroke="#fde047" stroke-width="0.8" opacity="0.45" />
    <path d="M 12 52 L 116 52" stroke="#240e02" stroke-width="1" />

    <!-- Front Shelf Retaining Rail / Lip -->
    <rect x="10" y="74.5" width="108" height="7.5" rx="1.5" fill="url(#oakCornice)" stroke="#240e02" stroke-width="1" />
    <path d="M 12 75.5 L 116 75.5" stroke="#ca8a04" stroke-width="0.75" opacity="0.5" />
    <path d="M 12 81.5 L 116 81.5" stroke="#1a0901" stroke-width="1" />
  </g>
</svg>
