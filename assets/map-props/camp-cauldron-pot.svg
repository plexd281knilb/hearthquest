<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="cauldronShadowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
    <filter id="cauldronGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>

    <!-- Warm Under-Coals Glow -->
    <radialGradient id="cauldronFireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#fde047" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.3" />
      <stop offset="85%" stop-color="#991b1b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0" />
    </radialGradient>

    <!-- Cast Iron Rim Gradient -->
    <radialGradient id="castIronRim" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <!-- Simmering Stew Broth Gradient -->
    <radialGradient id="stewBroth" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="45%" stop-color="#a16207" />
      <stop offset="80%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>

    <!-- Wooden Spoon Gradient -->
    <linearGradient id="spoonWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="tripodIron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Ambient Under-Fire Ground Glow -->
  <circle cx="64" cy="64" r="50" fill="url(#cauldronFireGlow)" filter="url(#cauldronGlowFilter)" />

  <!-- Ground Cast Shadow under Cauldron & Tripod Legs -->
  <g id="groundShadow" fill="#09090b" opacity="0.4" filter="url(#cauldronShadowFilter)">
    <circle cx="64" cy="68" r="28" />
    <circle cx="64" cy="110" r="6" />
    <circle cx="24" cy="42" r="6" />
    <circle cx="104" cy="42" r="6" />
  </g>

  <!-- Glowing Charcoal Embers under Cauldron -->
  <g id="embersUnder">
    <ellipse cx="64" cy="65" rx="18" ry="12" fill="#292524" />
    <circle cx="60" cy="64" r="4.5" fill="#f97316" />
    <circle cx="68" cy="66" r="4" fill="#dc2626" />
    <circle cx="64" cy="63" r="3" fill="#fde047" />
    <circle cx="64" cy="63" r="1.5" fill="#ffffff" />
  </g>

  <!-- Iron Tripod Stand Legs (Projecting Past Cauldron) -->
  <g id="tripodLegs">
    <!-- South Leg -->
    <path d="M 61 74 L 60 106 C 60 110, 68 110, 68 106 L 67 74 Z" fill="url(#tripodIron)" stroke="#09090b" stroke-width="0.8" />
    <circle cx="64" cy="107" r="3.5" fill="url(#tripodIron)" stroke="#09090b" stroke-width="0.8" />
    <circle cx="64" cy="107" r="1.5" fill="#cbd5e1" />

    <!-- North-West Leg -->
    <g transform="rotate(120 64 64)">
      <path d="M 61 74 L 60 106 C 60 110, 68 110, 68 106 L 67 74 Z" fill="url(#tripodIron)" stroke="#09090b" stroke-width="0.8" />
      <circle cx="64" cy="107" r="3.5" fill="url(#tripodIron)" stroke="#09090b" stroke-width="0.8" />
      <circle cx="64" cy="107" r="1.5" fill="#cbd5e1" />
    </g>

    <!-- North-East Leg -->
    <g transform="rotate(240 64 64)">
      <path d="M 61 74 L 60 106 C 60 110, 68 110, 68 106 L 67 74 Z" fill="url(#tripodIron)" stroke="#09090b" stroke-width="0.8" />
      <circle cx="64" cy="107" r="3.5" fill="url(#tripodIron)" stroke="#09090b" stroke-width="0.8" />
      <circle cx="64" cy="107" r="1.5" fill="#cbd5e1" />
    </g>
  </g>

  <!-- Cast-Iron Cauldron Body -->
  <g id="cauldronBody">
    <!-- Side Lifting Ears / Ring Loops -->
    <!-- Left Ear -->
    <path d="M 38 60 C 32 60, 32 68, 38 68 Z" fill="url(#tripodIron)" stroke="#09090b" stroke-width="1" />
    <circle cx="36" cy="64" r="2.2" fill="#09090b" />
    <!-- Right Ear -->
    <path d="M 90 60 C 96 60, 96 68, 90 68 Z" fill="url(#tripodIron)" stroke="#09090b" stroke-width="1" />
    <circle cx="92" cy="64" r="2.2" fill="#09090b" />

    <!-- Heavy Cast-Iron Pot Rim (Outer Wall) -->
    <circle cx="64" cy="64" r="27" fill="url(#castIronRim)" stroke="#09090b" stroke-width="1.8" />
    <circle cx="64" cy="64" r="25.5" fill="none" stroke="#64748b" stroke-width="0.9" opacity="0.6" />
    <circle cx="64" cy="64" r="21.5" fill="none" stroke="#09090b" stroke-width="1.2" />

    <!-- Interior Simmering Stew Broth -->
    <circle cx="64" cy="64" r="21" fill="url(#stewBroth)" />

    <!-- Stew Chunks & Herbs Floating in Broth -->
    <!-- Potato Cubes -->
    <g id="potatoes">
      <rect x="52" y="52" width="5.5" height="5" rx="1" fill="#fef08a" stroke="#ca8a04" stroke-width="0.5" />
      <rect x="68" y="70" width="6" height="5.5" rx="1" fill="#fef08a" stroke="#ca8a04" stroke-width="0.5" />
      <rect x="71" y="54" width="5" height="4.5" rx="1" fill="#fef08a" stroke="#ca8a04" stroke-width="0.5" />
    </g>

    <!-- Carrot Slices (Orange Rounds) -->
    <g id="carrots">
      <ellipse cx="60" cy="72" rx="3.5" ry="3" fill="#ea580c" stroke="#9a3412" stroke-width="0.5" />
      <circle cx="60" cy="72" r="1.5" fill="#f97316" />
      <ellipse cx="70" cy="62" rx="3.5" ry="3" fill="#ea580c" stroke="#9a3412" stroke-width="0.5" />
      <circle cx="70" cy="62" r="1.5" fill="#f97316" />
      <ellipse cx="54" cy="62" rx="3.2" ry="2.8" fill="#ea580c" stroke="#9a3412" stroke-width="0.5" />
      <circle cx="54" cy="62" r="1.3" fill="#f97316" />
    </g>

    <!-- Parsley & Herb Flecks -->
    <g id="herbs" fill="#15803d">
      <circle cx="58" cy="57" r="1" />
      <circle cx="62" cy="54" r="0.8" />
      <circle cx="65" cy="58" r="1" />
      <circle cx="63" cy="70" r="0.9" />
      <circle cx="74" cy="67" r="1" />
      <circle cx="56" cy="68" r="0.8" />
    </g>

    <!-- Simmering Glossy Bubbles -->
    <g id="bubbles">
      <circle cx="61" cy="60" r="2.2" fill="#ca8a04" stroke="#fef08a" stroke-width="0.5" />
      <circle cx="60.5" cy="59.5" r="0.6" fill="#ffffff" />
      <circle cx="67" cy="56" r="1.8" fill="#ca8a04" stroke="#fef08a" stroke-width="0.5" />
      <circle cx="66.5" cy="55.5" r="0.5" fill="#ffffff" />
      <circle cx="64" cy="68" r="1.5" fill="#ca8a04" stroke="#fef08a" stroke-width="0.5" />
    </g>

    <!-- Wooden Spoon / Ladle Resting in Stew -->
    <g id="woodenSpoon" transform="rotate(-32 64 64)">
      <!-- Spoon Shadow in Broth -->
      <rect x="62" y="24" width="4.5" height="34" rx="2" fill="#09090b" opacity="0.3" />
      <!-- Long Carved Wooden Handle -->
      <rect x="62.5" y="22" width="3.5" height="36" rx="1.75" fill="url(#spoonWood)" stroke="#3b1704" stroke-width="0.6" />
      <!-- Wooden Spoon Oval Bowl (Submerged tip) -->
      <ellipse cx="64.2" cy="58" rx="5" ry="6.5" fill="url(#spoonWood)" stroke="#3b1704" stroke-width="0.6" />
      <ellipse cx="64.2" cy="58" rx="3.8" ry="5.2" fill="#a16207" opacity="0.6" />
      <!-- Specular edge on handle -->
      <path d="M 63.2 24 L 63.2 48" stroke="#fde68a" stroke-width="0.6" opacity="0.6" />
    </g>

    <!-- Arched Cast-Iron Bail Handle Across Rim -->
    <path d="M 37 64 C 37 40, 91 40, 91 64" fill="none" stroke="url(#tripodIron)" stroke-width="3" stroke-linecap="round" />
    <path d="M 37 64 C 37 40, 91 40, 91 64" fill="none" stroke="#09090b" stroke-width="0.8" />
    <path d="M 43 54 C 52 44, 76 44, 85 54" fill="none" stroke="#94a3b8" stroke-width="0.75" opacity="0.5" />
  </g>
</svg>
