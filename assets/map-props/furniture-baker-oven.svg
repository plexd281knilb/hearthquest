<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="ovenShadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
    <filter id="fireGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>

    <radialGradient id="brickDomeGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="45%" stop-color="#c2410c" />
      <stop offset="75%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>

    <radialGradient id="hearthGlow" cx="45%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#f97316" />
      <stop offset="85%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="counterPlank" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="50%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>

    <linearGradient id="peelWood" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="60%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <radialGradient id="pastryGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <g id="groundShadow" fill="#09090b" opacity="0.45" filter="url(#ovenShadowFilter)">
    <circle cx="50" cy="54" r="36" />
    <rect x="68" y="52" width="48" height="54" rx="4" />
  </g>

  <!-- Baker's Prep Counter (Oak Table Attached on Right) -->
  <g id="prepCounter" transform="translate(70, 52)">
    <!-- Base Table Surface -->
    <rect x="0" y="0" width="46" height="52" rx="3" fill="url(#counterPlank)" stroke="#271003" stroke-width="1.2" />

    <!-- Counter Edge Chamfer Highlight -->
    <path d="M 1 1 L 45 1 M 1 1 L 1 51" stroke="#fde047" stroke-width="0.8" opacity="0.4" />
    <path d="M 45 1 L 45 51 M 1 51 L 45 51" stroke="#1c0a01" stroke-width="1.2" />

    <!-- Plank Seams -->
    <path d="M 15 1 L 15 51 M 30 1 L 30 51" stroke="#271003" stroke-width="1.1" />
    <path d="M 16 2 L 16 50 M 31 2 L 31 50" stroke="#f59e0b" stroke-width="0.5" opacity="0.3" />

    <!-- Flour Dusting Patches on Counter -->
    <ellipse cx="22" cy="18" rx="10" ry="6" fill="#ffffff" opacity="0.22" />
    <ellipse cx="28" cy="38" rx="12" ry="7" fill="#ffffff" opacity="0.18" />
    <circle cx="12" cy="34" r="3" fill="#ffffff" opacity="0.2" />
  </g>

  <!-- Stone Hearth Brick Oven Dome (Left) -->
  <g id="ovenDome" transform="translate(50, 52)">
    <!-- Terracotta Brick Outer Dome -->
    <circle cx="0" cy="0" r="34" fill="url(#brickDomeGrad)" stroke="#271003" stroke-width="1.5" />

    <!-- Radial Brick Masonry Rings -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#431407" stroke-width="1.1" stroke-dasharray="14 3" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#431407" stroke-width="1.1" stroke-dasharray="12 3" />
    <circle cx="0" cy="0" r="12" fill="none" stroke="#431407" stroke-width="1" stroke-dasharray="8 2" />

    <!-- Brick Mortar Radial Seams -->
    <path d="M 0 -34 L 0 -28 M 24 -24 L 20 -20 M 34 0 L 28 0 M 24 24 L 20 20 M 0 34 L 0 28 M -24 24 L -20 20 M -34 0 L -28 0 M -24 -24 L -20 -20"
          stroke="#271003" stroke-width="1" />
    <path d="M 14 -14 L 8 -8 M 20 0 L 12 0 M 14 14 L 8 8 M -14 14 L -8 8 M -20 0 L -12 0 M -14 -14 L -8 -8"
          stroke="#271003" stroke-width="0.8" />

    <!-- Stone Masonry Rim Chamfer Highlight -->
    <path d="M -24 -24 C -5 -35, 15 -32, 28 -18" fill="none" stroke="#fdba74" stroke-width="1.1" opacity="0.6" />

    <!-- Stone Chimney / Flue Vent (Top-Left of Dome) -->
    <circle cx="-14" cy="-14" r="6" fill="#334155" stroke="#0f172a" stroke-width="1" />
    <circle cx="-14" cy="-14" r="4.2" fill="#09090b" />
    <circle cx="-15" cy="-15" r="5" fill="none" stroke="#64748b" stroke-width="0.75" />

    <!-- Stone Hearth Apron Arch Opening (Southeast Facing) -->
    <g transform="translate(14, 14) rotate(45)">
      <!-- Apron Stone Lintel Blocks -->
      <rect x="-14" y="-5" width="28" height="10" rx="3" fill="#78350f" stroke="#271003" stroke-width="1" />
      <!-- Firebox Dark Opening -->
      <ellipse cx="0" cy="1" rx="10" ry="4.5" fill="#18181b" />
      <!-- Glowing Coals Core -->
      <ellipse cx="0" cy="1" rx="8" ry="3.5" fill="url(#hearthGlow)" />
      <!-- Fire Sparks / Embers in Opening -->
      <circle cx="-3" cy="0" r="1.2" fill="#ffffff" />
      <circle cx="3" cy="1" r="1" fill="#fef08a" />
      <circle cx="0" cy="-1" r="0.8" fill="#fde047" />
    </g>

    <!-- Warm Fire Glow Radiating onto Counter & Floor -->
    <ellipse cx="24" cy="24" rx="20" ry="14" fill="url(#hearthGlow)" opacity="0.6" filter="url(#fireGlowFilter)" />
  </g>

  <!-- Baker's Peel with Golden Pastries -->
  <g id="bakersPeel" transform="translate(88, 76) rotate(-22)">
    <!-- Peel Shadow onto table -->
    <rect x="-3" y="-30" width="6" height="58" fill="#09090b" opacity="0.25" />
    <rect x="-10" y="8" width="20" height="24" rx="3" fill="#09090b" opacity="0.25" />

    <!-- Long Wooden Peel Handle -->
    <rect x="-2.2" y="-32" width="4.4" height="42" rx="2" fill="url(#peelWood)" stroke="#3f1e06" stroke-width="0.75" />
    <!-- Round Handle Knob Finial -->
    <circle cx="0" cy="-32" r="2.8" fill="url(#peelWood)" stroke="#3f1e06" stroke-width="0.6" />

    <!-- Baker's Peel Paddle Blade -->
    <path d="M -9 8 Q 0 6 9 8 L 8 28 Q 0 31 -8 28 Z" fill="url(#peelWood)" stroke="#3f1e06" stroke-width="0.8" />
    <!-- Wood grain on blade -->
    <path d="M 0 8 L 0 29" stroke="#78350f" stroke-width="0.5" />
    <path d="M -5 10 L -4 28" stroke="#d97706" stroke-width="0.5" opacity="0.5" />

    <!-- 3 Golden Baked Pastries / Rolls on Peel Blade -->
    <!-- Pastry 1 (Top Left) -->
    <g transform="translate(-4, 14)">
      <ellipse cx="0" cy="0" rx="3.5" ry="3" fill="url(#pastryGrad)" stroke="#78350f" stroke-width="0.5" />
      <path d="M -2 0 L 2 0" stroke="#fef08a" stroke-width="0.6" stroke-linecap="round" />
      <circle cx="-1" cy="-1" r="0.8" fill="#ffffff" opacity="0.4" />
    </g>
    <!-- Pastry 2 (Top Right) -->
    <g transform="translate(4, 15)">
      <ellipse cx="0" cy="0" rx="3.5" ry="3" fill="url(#pastryGrad)" stroke="#78350f" stroke-width="0.5" />
      <path d="M -2 0 L 2 0" stroke="#fef08a" stroke-width="0.6" stroke-linecap="round" />
      <circle cx="-1" cy="-1" r="0.8" fill="#ffffff" opacity="0.4" />
    </g>
    <!-- Pastry 3 (Center Bottom - Braided Knot) -->
    <g transform="translate(0, 23)">
      <ellipse cx="0" cy="0" rx="4.8" ry="3.5" fill="url(#pastryGrad)" stroke="#78350f" stroke-width="0.6" />
      <!-- Braided scoring -->
      <path d="M -3 -1 Q 0 2 3 -1 M -3 1 Q 0 -2 3 1" fill="none" stroke="#fef08a" stroke-width="0.75" />
      <ellipse cx="-1.5" cy="-1" rx="1.2" ry="0.8" fill="#ffffff" opacity="0.5" />
    </g>
  </g>
</svg>
