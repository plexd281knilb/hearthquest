<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Soft Ground Cast Shadow Blur -->
    <filter id="boulderShadowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" />
    </filter>

    <!-- Sunlit Granite Facet Gradient (NW) -->
    <linearGradient id="graniteSun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Mid-Tone Granite Facet Gradient -->
    <linearGradient id="graniteMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="45%" stop-color="#64748b" />
      <stop offset="85%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Deep Shadow Granite Facet Gradient (SE) -->
    <linearGradient id="graniteDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="80%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Creeping Moss Radial Gradients -->
    <radialGradient id="boulderMoss1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="50%" stop-color="#4d7c0f" />
      <stop offset="100%" stop-color="#283618" />
    </radialGradient>

    <radialGradient id="boulderMoss2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="50%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#365314" />
    </radialGradient>

    <filter id="gravelShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0.6" dy="0.8" stdDeviation="0.6" flood-color="#080b10" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- ==================== AMBIENT GROUND CAST SHADOW ==================== -->
  <g filter="url(#boulderShadowBlur)" opacity="0.62">
    <!-- Main boulder shadow -->
    <ellipse cx="64" cy="68" rx="42" ry="36" fill="#06090d" />
    <!-- Secondary boulder shadows -->
    <ellipse cx="98" cy="80" rx="20" ry="16" fill="#06090d" />
    <ellipse cx="88" cy="38" rx="16" ry="14" fill="#06090d" />
    <ellipse cx="36" cy="88" rx="14" ry="11" fill="#06090d" />
  </g>

  <!-- ==================== SURROUNDING GRAVEL & SCREE STONES ==================== -->
  <g filter="url(#gravelShadow)">
    <ellipse cx="18" cy="54" rx="4.5" ry="3.2" fill="url(#graniteMid)" stroke="#1e293b" stroke-width="0.6" />
    <ellipse cx="26" cy="38" rx="3.5" ry="2.6" fill="url(#graniteSun)" stroke="#1e293b" stroke-width="0.5" />
    <ellipse cx="44" cy="20" rx="4.0" ry="2.8" fill="url(#graniteMid)" stroke="#1e293b" stroke-width="0.5" />
    <ellipse cx="106" cy="52" rx="3.8" ry="2.8" fill="url(#graniteMid)" stroke="#1e293b" stroke-width="0.5" />
    <ellipse cx="114" cy="74" rx="4.5" ry="3.0" fill="url(#graniteDark)" stroke="#1e293b" stroke-width="0.6" />
    <ellipse cx="82" cy="104" rx="4.2" ry="3.0" fill="url(#graniteDark)" stroke="#1e293b" stroke-width="0.6" />
    <ellipse cx="50" cy="102" rx="3.5" ry="2.5" fill="url(#graniteDark)" stroke="#1e293b" stroke-width="0.5" />
    <ellipse cx="22" cy="74" rx="3.0" ry="2.2" fill="url(#graniteMid)" stroke="#1e293b" stroke-width="0.5" />

    <!-- Tiny Scree Chips -->
    <circle cx="14" cy="64" r="1.2" fill="#94a3b8" />
    <circle cx="34" cy="24" r="1.1" fill="#cbd5e1" />
    <circle cx="104" cy="36" r="1.3" fill="#94a3b8" />
    <circle cx="118" cy="86" r="1.4" fill="#475569" />
    <circle cx="66" cy="108" r="1.2" fill="#475569" />
    <circle cx="28" cy="98" r="1.1" fill="#64748b" />
  </g>

  <!-- ==================== SECONDARY FLANK BOULDERS ==================== -->
  <!-- Flank Boulder 1 (North-East: cx=84, cy=34) -->
  <g stroke="#1e293b" stroke-width="1.0">
    <!-- Shadow Face -->
    <polygon points="84,24 96,28 100,40 88,46 76,40" fill="url(#graniteDark)" />
    <!-- Sunlit Face -->
    <polygon points="84,24 74,32 76,40 88,46 84,34" fill="url(#graniteSun)" />
    <!-- Specular Ridge -->
    <line x1="84" y1="24" x2="88" y2="46" stroke="#f8fafc" stroke-width="1.0" stroke-linecap="round" />
  </g>

  <!-- Flank Boulder 2 (South-West: cx=32, cy=84) -->
  <g stroke="#1e293b" stroke-width="1.0">
    <polygon points="32,74 42,78 44,90 32,94 22,88 24,78" fill="url(#graniteDark)" />
    <polygon points="32,74 24,78 22,88 32,84" fill="url(#graniteSun)" />
    <line x1="32" y1="74" x2="32" y2="94" stroke="#f8fafc" stroke-width="0.9" stroke-linecap="round" />
  </g>

  <!-- Flank Boulder 3 (East-Southeast: cx=94, cy=74) -->
  <g stroke="#1e293b" stroke-width="1.1">
    <!-- Dark SE facets -->
    <polygon points="92,60 106,66 112,78 104,90 88,86 86,72" fill="url(#graniteDark)" />
    <!-- Mid facet -->
    <polygon points="92,60 86,72 88,86 82,78 84,66" fill="url(#graniteMid)" />
    <!-- Sunlit NW facet -->
    <polygon points="92,60 84,66 94,68 106,66" fill="url(#graniteSun)" />
    <line x1="92" y1="60" x2="88" y2="86" stroke="#f8fafc" stroke-width="1.0" stroke-linecap="round" />
  </g>

  <!-- ==================== MAIN CRAGGY GRANITE BOULDER ==================== -->
  <g stroke="#161e29" stroke-width="1.2">
    <!-- Deep Southeast Shadow Facet -->
    <polygon points="62,60 76,52 92,62 88,82 72,92 56,86" fill="url(#graniteDark)" />

    <!-- East Sloping Facet -->
    <polygon points="60,42 76,34 86,46 76,52 62,60" fill="url(#graniteMid)" />

    <!-- South Crevasse Facet -->
    <polygon points="44,70 56,86 72,92 64,96 46,94 38,82" fill="url(#graniteDark)" />

    <!-- Central Plateau Facet (Mid-Light) -->
    <polygon points="46,44 60,42 62,60 44,70 36,58" fill="url(#graniteMid)" />

    <!-- North Sunlit Crest Facet -->
    <polygon points="42,26 62,24 76,34 60,42 46,44" fill="url(#graniteSun)" />

    <!-- Northwest Specular Sunlit Face -->
    <polygon points="26,42 42,26 46,44 36,58 24,56" fill="url(#graniteSun)" />

    <!-- West Sloping Sunlit Facet -->
    <polygon points="24,56 36,58 44,70 38,82 26,76" fill="url(#graniteSun)" />
  </g>

  <!-- Specular Sunlit Ridge Highlights (Sharp Fractured Edges) -->
  <g stroke="#f8fafc" stroke-linecap="round" fill="none">
    <line x1="42" y1="26" x2="62" y2="24" stroke-width="1.3" />
    <line x1="42" y1="26" x2="26" y2="42" stroke-width="1.2" />
    <line x1="26" y1="42" x2="24" y2="56" stroke-width="1.1" />
    <line x1="42" y1="26" x2="46" y2="44" stroke-width="1.2" />
    <line x1="46" y1="44" x2="36" y2="58" stroke-width="1.1" />
    <line x1="36" y1="58" x2="44" y2="70" stroke-width="1.0" />
    <line x1="46" y1="44" x2="60" y2="42" stroke-width="1.1" />
    <line x1="60" y1="42" x2="76" y2="34" stroke-width="1.1" />
    <line x1="60" y1="42" x2="62" y2="60" stroke-width="1.0" />
    <line x1="62" y1="60" x2="44" y2="70" stroke-width="0.9" />
  </g>

  <!-- Mica & Quartz Crystalline Flecks -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="36" cy="34" r="0.8" />
    <circle cx="48" cy="30" r="0.7" />
    <circle cx="32" cy="50" r="0.8" />
    <circle cx="52" cy="46" r="0.6" />
    <circle cx="40" cy="62" r="0.7" />
  </g>

  <!-- Deep Stone Fracture Cracks -->
  <g stroke="#090d14" stroke-width="1.0" stroke-linecap="round" fill="none">
    <path d="M 62 60 L 68 72 L 74 76" />
    <path d="M 68 72 L 64 80" stroke-width="0.7" />
    <path d="M 50 52 L 56 56" stroke-width="0.8" />
    <path d="M 76 52 L 82 58" stroke-width="0.8" />
  </g>

  <!-- ==================== CREEPING MOSS VINES & SEAM MOSS ==================== -->
  <g stroke="#1e340a" stroke-width="0.5">
    <!-- Crevice Moss at junction (x=60..70, y=50..70) -->
    <path d="M 58 48 C 64 44, 70 48, 68 56 C 66 64, 58 68, 54 62 C 52 56, 54 50, 58 48 Z" fill="url(#boulderMoss1)" />
    <circle cx="62" cy="52" r="6.0" fill="url(#boulderMoss1)" />
    <circle cx="67" cy="58" r="5.5" fill="url(#boulderMoss2)" />
    <circle cx="56" cy="60" r="4.8" fill="url(#boulderMoss2)" />
    <circle cx="64" cy="65" r="4.2" fill="#84cc16" />

    <!-- Creeping Moss Vine Runner along North Ridge -->
    <path d="M 40 24 Q 48 22 56 26 Q 64 28 72 26" stroke="#2d500e" stroke-width="1.0" fill="none" />
    <circle cx="44" cy="24" r="2.4" fill="#65a30d" />
    <circle cx="52" cy="25" r="2.8" fill="#84cc16" />
    <circle cx="60" cy="27" r="2.2" fill="#a3e635" />

    <!-- Moss in Crevice between Main & East Boulder -->
    <circle cx="82" cy="66" r="4.5" fill="url(#boulderMoss1)" />
    <circle cx="85" cy="72" r="3.8" fill="url(#boulderMoss2)" />
    <circle cx="80" cy="74" r="2.8" fill="#84cc16" />

    <!-- Moss Clump on SW Flank -->
    <circle cx="34" cy="78" r="3.5" fill="url(#boulderMoss1)" />
    <circle cx="36" cy="82" r="2.6" fill="#84cc16" />
  </g>
</svg>