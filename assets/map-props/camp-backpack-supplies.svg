<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="packShadowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.8" />
    </filter>

    <linearGradient id="leatherPack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="40%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="bedrollGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78716c" />
      <stop offset="50%" stop-color="#57534e" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>

    <linearGradient id="mapTubeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="40%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#592d07" />
    </linearGradient>

    <radialGradient id="canteenGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </radialGradient>

    <radialGradient id="brassGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#713f12" />
    </radialGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <g id="groundShadow" fill="#09090b" opacity="0.42" filter="url(#packShadowFilter)">
    <rect x="22" y="24" width="84" height="20" rx="9" />
    <rect x="30" y="40" width="68" height="64" rx="14" />
    <circle cx="18" cy="70" r="10" />
    <circle cx="110" cy="70" r="10" />
  </g>

  <!-- Rolled Canvas Bedroll Strapped to Top (Horizontal Cylinder) -->
  <g id="topBedroll" transform="translate(64, 30)">
    <!-- Main Cylinder -->
    <rect x="-40" y="-10" width="80" height="20" rx="9" fill="url(#bedrollGrad)" stroke="#1c1917" stroke-width="1" />
    <!-- End Caps (Swirled Rolled Fabric) -->
    <ellipse cx="-40" cy="0" rx="4" ry="9" fill="#44403c" stroke="#1c1917" stroke-width="0.8" />
    <circle cx="-40" cy="0" r="1.5" fill="#1c1917" />
    <ellipse cx="40" cy="0" rx="4" ry="9" fill="#44403c" stroke="#1c1917" stroke-width="0.8" />
    <circle cx="40" cy="0" r="1.5" fill="#1c1917" />
    <!-- Specular Highlight Ridge on Bedroll -->
    <path d="M -34 -4 L 34 -4" stroke="#a8a29e" stroke-width="1.2" opacity="0.45" />

    <!-- Two Leather Cinch Straps -->
    <!-- Left Strap -->
    <rect x="-24" y="-10" width="5" height="20" rx="1" fill="#240e02" stroke="#09090b" stroke-width="0.6" />
    <rect x="-25" y="-3" width="7" height="6" rx="1" fill="url(#brassGrad)" stroke="#451a03" stroke-width="0.5" />
    <rect x="-23.5" y="-1.5" width="4" height="3" fill="#240e02" />
    <!-- Right Strap -->
    <rect x="19" y="-10" width="5" height="20" rx="1" fill="#240e02" stroke="#09090b" stroke-width="0.6" />
    <rect x="18" y="-3" width="7" height="6" rx="1" fill="url(#brassGrad)" stroke="#451a03" stroke-width="0.5" />
    <rect x="19.5" y="-1.5" width="4" height="3" fill="#240e02" />
  </g>

  <!-- Left Flank: Rolled Canvas Map Tube / Scroll Case -->
  <g id="mapTube" transform="translate(24, 72) rotate(14)">
    <rect x="-5" y="-24" width="10" height="48" rx="5" fill="url(#mapTubeGrad)" stroke="#271003" stroke-width="0.9" />
    <!-- Brass End Caps -->
    <rect x="-5.5" y="-25" width="11" height="6" rx="2" fill="url(#brassGrad)" stroke="#592d07" stroke-width="0.6" />
    <rect x="-5.5" y="19" width="11" height="6" rx="2" fill="url(#brassGrad)" stroke="#592d07" stroke-width="0.6" />
    <!-- Specular Glint along tube -->
    <path d="M -1 -20 L -1 18" stroke="#fde047" stroke-width="0.75" opacity="0.6" />
    <!-- Strap ties to backpack -->
    <rect x="-6" y="-10" width="12" height="3" fill="#240e02" />
    <rect x="-6" y="8" width="12" height="3" fill="#240e02" />
  </g>

  <!-- Right Flank: Water Canteen / Adventurer Waterskin -->
  <g id="waterCanteen" transform="translate(104, 72) rotate(-10)">
    <!-- Canteen Body (Classic Blue-Enamel / Leather Adventurer Flask) -->
    <circle cx="0" cy="2" r="12" fill="url(#canteenGrad)" stroke="#082f49" stroke-width="1.1" />
    <circle cx="0" cy="2" r="10.5" fill="none" stroke="#38bdf8" stroke-width="0.6" opacity="0.6" />
    <!-- Leather Harness Straps across flask -->
    <line x1="-12" y1="2" x2="12" y2="2" stroke="#451a03" stroke-width="2.5" />
    <line x1="0" y1="-10" x2="0" y2="14" stroke="#451a03" stroke-width="2.5" />
    <!-- Brass Neck & Screw Stopper Cap -->
    <rect x="-3" y="-14" width="6" height="5" rx="1.5" fill="url(#brassGrad)" stroke="#451a03" stroke-width="0.6" />
    <!-- Brass Retention Chain -->
    <path d="M 0 -11 Q 5 -8 6 -3" fill="none" stroke="#eab308" stroke-width="0.8" stroke-dasharray="1 1" />
  </g>

  <!-- Main Stitched Leather Backpack Body -->
  <g id="packBody" transform="translate(64, 72)">
    <!-- Base Rucksack Sack -->
    <rect x="-28" y="-28" width="56" height="56" rx="12" fill="url(#leatherPack)" stroke="#271003" stroke-width="1.4" />

    <!-- Leather Surface Creases & Specular Highlight -->
    <path d="M -24 -24 Q 0 -20 24 -24" stroke="#d97706" stroke-width="1" fill="none" opacity="0.4" />
    <path d="M -26 -10 Q -15 2 -26 14" stroke="#451a03" stroke-width="0.9" fill="none" />
    <path d="M 26 -10 Q 15 2 26 14" stroke="#451a03" stroke-width="0.9" fill="none" />

    <!-- Top Closure Flap -->
    <path d="M -26 -26 L 26 -26 L 24 4 Q 0 12 -24 4 Z" fill="url(#leatherPack)" stroke="#1c0a01" stroke-width="1.1" />
    <!-- Flap Edge Stitching -->
    <path d="M -23 -24 L 23 -24 L 21 2 Q 0 9 -21 2 Z" fill="none" stroke="#fde047" stroke-width="0.6" stroke-dasharray="1.5 1.5" opacity="0.75" />

    <!-- Twin Harness Straps & Brass Buckles -->
    <!-- Left Harness Strap -->
    <rect x="-16" y="-27" width="5.5" height="42" rx="1.5" fill="#240e02" stroke="#09090b" stroke-width="0.6" />
    <!-- Left Buckle -->
    <rect x="-17.5" y="2" width="8.5" height="7" rx="1.2" fill="url(#brassGrad)" stroke="#3b1704" stroke-width="0.5" />
    <rect x="-15.5" y="3.5" width="4.5" height="4" fill="#240e02" />
    <line x1="-13.2" y1="2" x2="-13.2" y2="9" stroke="#fef08a" stroke-width="0.8" />

    <!-- Right Harness Strap -->
    <rect x="10.5" y="-27" width="5.5" height="42" rx="1.5" fill="#240e02" stroke="#09090b" stroke-width="0.6" />
    <!-- Right Buckle -->
    <rect x="9" y="2" width="8.5" height="7" rx="1.2" fill="url(#brassGrad)" stroke="#3b1704" stroke-width="0.5" />
    <rect x="11" y="3.5" width="4.5" height="4" fill="#240e02" />
    <line x1="13.2" y1="2" x2="13.2" y2="9" stroke="#fef08a" stroke-width="0.8" />

    <!-- Coiled Hemp Climbing Rope Strapped to Bottom of Flap -->
    <g transform="translate(0, 18)">
      <!-- Rope loops coil -->
      <ellipse cx="0" cy="0" rx="12" ry="6" fill="#78350f" stroke="#451a03" stroke-width="0.8" />
      <ellipse cx="0" cy="0" rx="10.5" ry="5" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="2.5 1" />
      <ellipse cx="0" cy="0" rx="7.5" ry="3.5" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="2 1" />
      <ellipse cx="0" cy="0" rx="4" ry="2" fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="1.8 1" />
      <!-- Center binding knot -->
      <rect x="-3" y="-5" width="6" height="10" rx="1.5" fill="#451a03" stroke="#240e02" stroke-width="0.5" />
    </g>

    <!-- Top Carrying Grab Handle -->
    <path d="M -8 -27 C -8 -33, 8 -33, 8 -27" fill="none" stroke="#240e02" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -8 -27 C -8 -33, 8 -33, 8 -27" fill="none" stroke="#ca8a04" stroke-width="0.6" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
