<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Soft ground shadow filter -->
    <filter id="softGndShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
    <filter id="itemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" />
    </filter>

    <!-- Wood table gradients -->
    <linearGradient id="oakBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="25%" stop-color="#713f12" />
      <stop offset="70%" stop-color="#592d07" />
      <stop offset="100%" stop-color="#3f1e06" />
    </linearGradient>

    <linearGradient id="plankLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a16207" stop-opacity="0.7" />
      <stop offset="30%" stop-color="#78350f" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="ironBracketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="45%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="parchmentGrad" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="70%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <radialGradient id="loafGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#581c87" stop-opacity="0.4" />
    </radialGradient>

    <radialGradient id="trencherGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="80%" stop-color="#5a2e0a" />
      <stop offset="100%" stop-color="#2a1203" />
    </radialGradient>

    <radialGradient id="pewterGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <rect x="14" y="32" width="100" height="66" rx="6" fill="#09090b" opacity="0.4" filter="url(#softGndShadow)" />

  <!-- Oak Table Solid Body -->
  <g id="tableBody">
    <!-- Main Table Slab -->
    <rect x="16" y="32" width="96" height="64" rx="4" fill="url(#oakBase)" stroke="#271003" stroke-width="1.5" />

    <!-- Table Edge Bevel Highlight (Top/Left) -->
    <path d="M 18 33 L 110 33 M 17 34 L 17 93" stroke="#ca8a04" stroke-width="1" stroke-linecap="round" opacity="0.45" />
    <!-- Table Edge Bevel Shadow (Bottom/Right) -->
    <path d="M 17 95 L 111 95 M 111 34 L 111 95" stroke="#1c0c02" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />

    <!-- 5 Chamfered Longitudinal Planks -->
    <!-- Plank 1 -->
    <rect x="17" y="33" width="94" height="12" fill="url(#plankLight)" opacity="0.6" />
    <path d="M 16 45 L 112 45" stroke="#240e02" stroke-width="1.2" />
    <path d="M 28 39 Q 45 37 72 38" stroke="#a16207" stroke-width="0.8" fill="none" opacity="0.35" />

    <!-- Plank 2 -->
    <rect x="17" y="46" width="94" height="12" fill="url(#plankLight)" opacity="0.4" />
    <path d="M 16 58 L 112 58" stroke="#240e02" stroke-width="1.2" />
    <path d="M 35 52 Q 65 50 95 53" stroke="#a16207" stroke-width="0.8" fill="none" opacity="0.3" />

    <!-- Plank 3 -->
    <rect x="17" y="59" width="94" height="12" fill="url(#plankLight)" opacity="0.5" />
    <path d="M 16 71 L 112 71" stroke="#240e02" stroke-width="1.2" />
    <path d="M 22 65 Q 50 67 80 64" stroke="#a16207" stroke-width="0.8" fill="none" opacity="0.35" />

    <!-- Plank 4 -->
    <rect x="17" y="72" width="94" height="12" fill="url(#plankLight)" opacity="0.3" />
    <path d="M 16 84 L 112 84" stroke="#240e02" stroke-width="1.2" />
    <path d="M 30 78 Q 70 76 100 79" stroke="#a16207" stroke-width="0.8" fill="none" opacity="0.3" />

    <!-- Plank 5 -->
    <rect x="17" y="85" width="94" height="10" fill="url(#plankLight)" opacity="0.5" />
    <path d="M 40 90 Q 60 88 88 91" stroke="#a16207" stroke-width="0.8" fill="none" opacity="0.3" />

    <!-- Four Forged Iron Corner Brackets -->
    <!-- Top-Left Bracket -->
    <path d="M 16 46 L 24 46 L 24 38 L 32 38 L 32 32 L 16 32 Z" fill="url(#ironBracketGrad)" stroke="#09090b" stroke-width="0.8" />
    <circle cx="20" cy="36" r="1.3" fill="#cbd5e1" stroke="#09090b" stroke-width="0.5" />
    <circle cx="20" cy="42" r="1.3" fill="#cbd5e1" stroke="#09090b" stroke-width="0.5" />
    <circle cx="28" cy="36" r="1.3" fill="#cbd5e1" stroke="#09090b" stroke-width="0.5" />

    <!-- Top-Right Bracket -->
    <path d="M 112 46 L 104 46 L 104 38 L 96 38 L 96 32 L 112 32 Z" fill="url(#ironBracketGrad)" stroke="#09090b" stroke-width="0.8" />
    <circle cx="108" cy="36" r="1.3" fill="#cbd5e1" stroke="#09090b" stroke-width="0.5" />
    <circle cx="108" cy="42" r="1.3" fill="#cbd5e1" stroke="#09090b" stroke-width="0.5" />
    <circle cx="100" cy="36" r="1.3" fill="#cbd5e1" stroke="#09090b" stroke-width="0.5" />

    <!-- Bottom-Left Bracket -->
    <path d="M 16 82 L 24 82 L 24 90 L 32 90 L 32 96 L 16 96 Z" fill="url(#ironBracketGrad)" stroke="#09090b" stroke-width="0.8" />
    <circle cx="20" cy="92" r="1.3" fill="#cbd5e1" stroke="#09090b" stroke-width="0.5" />
    <circle cx="20" cy="86" r="1.3" fill="#cbd5e1" stroke="#09090b" stroke-width="0.5" />
    <circle cx="28" cy="92" r="1.3" fill="#cbd5e1" stroke="#09090b" stroke-width="0.5" />

    <!-- Bottom-Right Bracket -->
    <path d="M 112 82 L 104 82 L 104 90 L 96 90 L 96 96 L 112 96 Z" fill="url(#ironBracketGrad)" stroke="#09090b" stroke-width="0.8" />
    <circle cx="108" cy="92" r="1.3" fill="#cbd5e1" stroke="#09090b" stroke-width="0.5" />
    <circle cx="108" cy="86" r="1.3" fill="#cbd5e1" stroke="#09090b" stroke-width="0.5" />
    <circle cx="100" cy="92" r="1.3" fill="#cbd5e1" stroke="#09090b" stroke-width="0.5" />
  </g>

  <!-- Tabletop Items -->
  <!-- 1. Unrolled Adventurer Parchment Map -->
  <g id="parchmentMap" transform="translate(56, 62) rotate(-6)">
    <!-- Map Cast Shadow -->
    <rect x="-21" y="-15" width="42" height="30" rx="1.5" fill="#09090b" opacity="0.3" filter="url(#itemShadow)" />
    <!-- Map Parchment Base -->
    <rect x="-20" y="-14" width="40" height="28" rx="1" fill="url(#parchmentGrad)" stroke="#b45309" stroke-width="0.75" />
    <!-- Curled parchment roll edges on top and bottom -->
    <path d="M -20 -14 C -10 -16, 10 -16, 20 -14 L 20 -12 C 10 -14, -10 -14, -20 -12 Z" fill="#fef9c3" stroke="#d97706" stroke-width="0.5" />
    <path d="M -20 14 C -10 12, 10 12, 20 14 L 20 12 C 10 10, -10 10, -20 12 Z" fill="#d97706" opacity="0.6" />
    <!-- Map Details: Coastline & river & island -->
    <path d="M -16 -4 Q -10 2, -4 -3 T 6 5 T 16 0" fill="none" stroke="#78350f" stroke-width="1" stroke-linecap="round" />
    <path d="M -8 -8 Q -4 -5, 2 -9" fill="none" stroke="#0284c7" stroke-width="0.8" opacity="0.7" />
    <!-- Dashed travel trail -->
    <path d="M -12 7 Q -4 9, 2 3 T 10 7" fill="none" stroke="#dc2626" stroke-width="0.8" stroke-dasharray="2 1.5" />
    <!-- Red X treasure marker -->
    <path d="M 8 5 L 12 9 M 12 5 L 8 9" stroke="#b91c1c" stroke-width="1.2" stroke-linecap="round" />
    <!-- Compass Rose Fleur -->
    <polygon points="-13,-8 -11,-11 -9,-8 -11,-5" fill="#92400e" opacity="0.75" />
  </g>

  <!-- 2. Trencher & Golden Loaf -->
  <g id="trencherLoaf" transform="translate(93, 56)">
    <!-- Trencher Shadow -->
    <ellipse cx="1" cy="2" rx="13" ry="11" fill="#09090b" opacity="0.35" filter="url(#itemShadow)" />
    <!-- Wooden Trencher (Plate) -->
    <ellipse cx="0" cy="0" rx="13" ry="11" fill="url(#trencherGrad)" stroke="#1c0c02" stroke-width="0.9" />
    <ellipse cx="0" cy="0" rx="10.5" ry="8.5" fill="none" stroke="#a16207" stroke-width="0.6" opacity="0.5" />

    <!-- Golden Bread Loaf -->
    <ellipse cx="0" cy="-0.5" rx="8.5" ry="6.8" fill="url(#loafGrad)" stroke="#78350f" stroke-width="0.75" />
    <!-- Scored Crust Lines -->
    <path d="M -5 -2 C -4 -4, -2 -5, 0 -5" fill="none" stroke="#fef08a" stroke-width="1" stroke-linecap="round" />
    <path d="M -3 1 C -1 -1, 1 -2, 4 -2" fill="none" stroke="#fef08a" stroke-width="1.1" stroke-linecap="round" />
    <path d="M 0 4 C 2 2, 4 1, 6 1" fill="none" stroke="#fef08a" stroke-width="1" stroke-linecap="round" />
    <!-- Butter/crust glint -->
    <ellipse cx="-2.5" cy="-2.5" rx="2" ry="1.2" fill="#ffffff" opacity="0.35" />
  </g>

  <!-- 3. Pewter Tankard with Frothy Ale -->
  <g id="tankard" transform="translate(28, 72)">
    <circle cx="1" cy="1.5" r="7" fill="#09090b" opacity="0.35" filter="url(#itemShadow)" />
    <!-- Pewter Rim & Body -->
    <circle cx="0" cy="0" r="6" fill="url(#pewterGrad)" stroke="#1e293b" stroke-width="0.9" />
    <!-- Tankard Handle sticking out to the left -->
    <path d="M -5 -3 C -9 -3, -9 3, -5 3" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" />
    <!-- Ale Core -->
    <circle cx="0" cy="0" r="4.3" fill="#78350f" />
    <!-- Frothy Foam Head -->
    <circle cx="0.5" cy="-0.5" r="3.2" fill="#fef08a" opacity="0.9" />
    <circle cx="-0.8" cy="1" r="2.2" fill="#fef9c3" opacity="0.85" />
    <circle cx="1" cy="0.8" r="1.2" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
