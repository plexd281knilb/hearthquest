<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="skelShadowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>

    <!-- Ivory Bone Gradient -->
    <linearGradient id="ivoryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef3c7" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <radialGradient id="skullBone" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef3c7" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </radialGradient>

    <!-- Rusty Shortblade Gradients -->
    <linearGradient id="bladeSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="45%" stop-color="#64748b" />
      <stop offset="55%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="rustGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="60%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <linearGradient id="pommelBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>
  </defs>

  <!-- Ambient Ground Shadow under Skeleton & Blade -->
  <g id="groundShadow" fill="#09090b" opacity="0.38" filter="url(#skelShadowFilter)">
    <circle cx="52" cy="24" r="14" />
    <rect x="36" y="34" width="32" height="34" rx="10" />
    <rect x="40" y="66" width="26" height="16" rx="6" />
    <rect x="38" y="78" width="12" height="38" rx="5" />
    <rect x="54" y="78" width="12" height="38" rx="5" />
    <rect x="22" y="38" width="12" height="34" rx="4" />
    <rect x="68" y="38" width="12" height="34" rx="4" />
    <rect x="88" y="36" width="10" height="64" rx="4" transform="rotate(6 93 68)" />
  </g>

  <!-- Articulated Forgotten Skeleton -->
  <g id="skeletonBody">
    <!-- 1. Skull (Top, slightly tilted) -->
    <g id="skull" transform="translate(52, 22) rotate(-5)">
      <!-- Cranium Dome -->
      <path d="M -11 -3 C -11 -12, 11 -12, 11 -3 C 12 3, 9 10, 6 13 C 2 15, -2 15, -6 13 C -9 10, -12 3, -11 -3 Z"
            fill="url(#skullBone)" stroke="#334155" stroke-width="0.9" />
      <!-- Coronal Suture Line -->
      <path d="M -8 -4 Q -4 -3, 0 -5 Q 4 -3, 8 -4" fill="none" stroke="#64748b" stroke-width="0.5" stroke-dasharray="1 0.7" />
      <!-- Dark Eye Orbits -->
      <ellipse cx="-4.5" cy="4.5" rx="3" ry="3.5" fill="#0f172a" stroke="#334155" stroke-width="0.4" />
      <ellipse cx="4.5" cy="4.5" rx="3" ry="3.5" fill="#0f172a" stroke="#334155" stroke-width="0.4" />
      <!-- Nasal Notch -->
      <polygon points="0,8 -1.2,11 1.2,11" fill="#0f172a" />
      <!-- Teeth -->
      <g fill="#fef9c3" stroke="#475569" stroke-width="0.3">
        <rect x="-3.5" y="12.5" width="1.5" height="2" rx="0.3" />
        <rect x="-1.7" y="13" width="1.6" height="2" rx="0.3" />
        <rect x="0.2" y="13" width="1.6" height="2" rx="0.3" />
        <rect x="2" y="12.5" width="1.5" height="2" rx="0.3" />
      </g>
      <!-- Cranium Specular Highlight -->
      <ellipse cx="-3" cy="-6" rx="4" ry="2.5" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- 2. Cervical & Thoracic Spine Column (Vertebrae) -->
    <g id="spine">
      <!-- 8 Vertebrae Discs -->
      <ellipse cx="52" cy="35" rx="3" ry="1.8" fill="url(#ivoryGrad)" stroke="#475569" stroke-width="0.5" />
      <ellipse cx="52" cy="39" rx="3.2" ry="1.8" fill="url(#ivoryGrad)" stroke="#475569" stroke-width="0.5" />
      <ellipse cx="52" cy="43" rx="3.4" ry="1.8" fill="url(#ivoryGrad)" stroke="#475569" stroke-width="0.5" />
      <ellipse cx="52" cy="47" rx="3.5" ry="1.9" fill="url(#ivoryGrad)" stroke="#475569" stroke-width="0.5" />
      <ellipse cx="52" cy="51" rx="3.5" ry="1.9" fill="url(#ivoryGrad)" stroke="#475569" stroke-width="0.5" />
      <ellipse cx="52" cy="55" rx="3.4" ry="1.9" fill="url(#ivoryGrad)" stroke="#475569" stroke-width="0.5" />
      <ellipse cx="52" cy="59" rx="3.3" ry="1.9" fill="url(#ivoryGrad)" stroke="#475569" stroke-width="0.5" />
      <ellipse cx="52" cy="63" rx="3.2" ry="1.9" fill="url(#ivoryGrad)" stroke="#475569" stroke-width="0.5" />
    </g>

    <!-- 3. Ribcage (Curved Rib Pairs flanking spine) -->
    <g id="ribcage" fill="none" stroke="url(#ivoryGrad)" stroke-width="1.6" stroke-linecap="round">
      <!-- Rib Pair 1 -->
      <path d="M 50 39 C 42 37, 39 42, 45 44" />
      <path d="M 54 39 C 62 37, 65 42, 59 44" />
      <!-- Rib Pair 2 -->
      <path d="M 49 43 C 38 41, 36 48, 45 50" />
      <path d="M 55 43 C 66 41, 68 48, 59 50" />
      <!-- Rib Pair 3 -->
      <path d="M 49 47 C 37 45, 35 53, 46 55" />
      <path d="M 55 47 C 67 45, 69 53, 58 55" />
      <!-- Rib Pair 4 -->
      <path d="M 49 51 C 38 49, 36 57, 47 59" />
      <path d="M 55 51 C 66 49, 68 57, 57 59" />
      <!-- Rib Pair 5 -->
      <path d="M 50 55 C 40 54, 38 61, 48 63" />
      <path d="M 54 55 C 64 54, 66 61, 56 63" />
      <!-- Rib Pair 6 (Floating Ribs) -->
      <path d="M 50 59 C 42 59, 41 64, 49 65" />
      <path d="M 54 59 C 62 59, 63 64, 55 65" />
    </g>

    <!-- Clavicles (Collarbones) -->
    <path d="M 52 35 Q 42 33 34 37" fill="none" stroke="url(#ivoryGrad)" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 52 35 Q 62 33 70 37" fill="none" stroke="url(#ivoryGrad)" stroke-width="1.8" stroke-linecap="round" />

    <!-- 4. Pelvis / Hip Girdle -->
    <g id="pelvis" transform="translate(52, 69)">
      <!-- Left Ilium Wing -->
      <path d="M -2 -3 C -10 -5, -14 0, -11 7 C -8 11, -3 8, 0 3 Z" fill="url(#ivoryGrad)" stroke="#475569" stroke-width="0.75" />
      <!-- Right Ilium Wing -->
      <path d="M 2 -3 C 10 -5, 14 0, 11 7 C 8 11, 3 8, 0 3 Z" fill="url(#ivoryGrad)" stroke="#475569" stroke-width="0.75" />
      <!-- Sacrum Notch in Center -->
      <polygon points="-2,1 2,1 0,6" fill="#1e293b" />
    </g>

    <!-- 5. Arms & Hands -->
    <!-- Left Arm -->
    <g id="leftArm">
      <!-- Shoulder Joint -->
      <circle cx="33" cy="38" r="2.2" fill="url(#ivoryGrad)" stroke="#475569" stroke-width="0.5" />
      <!-- Humerus -->
      <line x1="33" y1="38" x2="26" y2="52" stroke="url(#ivoryGrad)" stroke-width="2.5" stroke-linecap="round" />
      <!-- Elbow Joint -->
      <circle cx="26" cy="52" r="2" fill="url(#ivoryGrad)" stroke="#475569" stroke-width="0.5" />
      <!-- Radius & Ulna (Forearm) -->
      <line x1="26" y1="52" x2="24" y2="68" stroke="url(#ivoryGrad)" stroke-width="2.2" stroke-linecap="round" />
      <!-- Hand / Finger Phalanges -->
      <path d="M 24 68 L 22 74 M 24 68 L 24 75 M 24 68 L 26 74" stroke="url(#ivoryGrad)" stroke-width="1.1" stroke-linecap="round" />
    </g>

    <!-- Right Arm (Resting along torso) -->
    <g id="rightArm">
      <!-- Shoulder Joint -->
      <circle cx="71" cy="38" r="2.2" fill="url(#ivoryGrad)" stroke="#475569" stroke-width="0.5" />
      <!-- Humerus -->
      <line x1="71" y1="38" x2="74" y2="52" stroke="url(#ivoryGrad)" stroke-width="2.5" stroke-linecap="round" />
      <!-- Elbow Joint -->
      <circle cx="74" cy="52" r="2" fill="url(#ivoryGrad)" stroke="#475569" stroke-width="0.5" />
      <!-- Forearm -->
      <line x1="74" y1="52" x2="70" y2="68" stroke="url(#ivoryGrad)" stroke-width="2.2" stroke-linecap="round" />
      <!-- Hand phalanges resting near hip -->
      <path d="M 70 68 L 68 74 M 70 68 L 70 75 M 70 68 L 72 74" stroke="url(#ivoryGrad)" stroke-width="1.1" stroke-linecap="round" />
    </g>

    <!-- 6. Legs & Feet -->
    <!-- Left Leg -->
    <g id="leftLeg">
      <!-- Femur (Thigh bone) -->
      <line x1="43" y1="74" x2="40" y2="94" stroke="url(#ivoryGrad)" stroke-width="3" stroke-linecap="round" />
      <!-- Knee Joint (Patella) -->
      <circle cx="40" cy="94" r="2.5" fill="url(#ivoryGrad)" stroke="#475569" stroke-width="0.6" />
      <!-- Tibia & Fibula (Shin) -->
      <line x1="40" y1="94" x2="38" y2="114" stroke="url(#ivoryGrad)" stroke-width="2.6" stroke-linecap="round" />
      <!-- Foot Phalanges -->
      <path d="M 38 114 L 35 120 M 38 114 L 38 121 M 38 114 L 41 120" stroke="url(#ivoryGrad)" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Right Leg -->
    <g id="rightLeg">
      <!-- Femur -->
      <line x1="61" y1="74" x2="63" y2="94" stroke="url(#ivoryGrad)" stroke-width="3" stroke-linecap="round" />
      <!-- Knee Joint -->
      <circle cx="63" cy="94" r="2.5" fill="url(#ivoryGrad)" stroke="#475569" stroke-width="0.6" />
      <!-- Shin -->
      <line x1="63" y1="94" x2="65" y2="114" stroke="url(#ivoryGrad)" stroke-width="2.6" stroke-linecap="round" />
      <!-- Foot Phalanges -->
      <path d="M 65 114 L 62 120 M 65 114 L 65 121 M 65 114 L 68 120" stroke="url(#ivoryGrad)" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Relic: Notched Rusty Adventurer Shortblade (Resting beside skeleton) -->
  <g id="rustyShortblade" transform="translate(93, 68) rotate(6)">
    <!-- Blade Drop Shadow -->
    <rect x="-3" y="-30" width="6" height="58" fill="#09090b" opacity="0.3" filter="url(#skelShadowFilter)" />

    <!-- Double-Edged Shortsword Blade -->
    <path d="M -3 -26 L 0 -34 L 3 -26 L 2.5 16 L -2.5 16 Z" fill="url(#bladeSteel)" stroke="#1e293b" stroke-width="0.75" />
    <!-- Blade Fuller / Center Spine Line -->
    <line x1="0" y1="-28" x2="0" y2="15" stroke="#1e293b" stroke-width="0.8" />
    <line x1="0.5" y1="-28" x2="0.5" y2="15" stroke="#f1f5f9" stroke-width="0.4" opacity="0.6" />

    <!-- Battle Notches / Nicks in Blade Edge -->
    <polygon points="-3,-14 -1.5,-12 -3,-10" fill="#09090b" />
    <polygon points="3,-4 1.5,-2 3,0" fill="#09090b" />

    <!-- Rust Patches along Blade -->
    <path d="M -2.5 -8 Q 0 -6 2 -9 L 2.2 -3 Q 0 -1 -2.3 -4 Z" fill="url(#rustGrad)" opacity="0.85" />
    <path d="M -2.2 4 Q 0 6 2.4 3 L 2.4 10 Q 0 12 -2.2 9 Z" fill="url(#rustGrad)" opacity="0.85" />

    <!-- Forged Iron Crossguard -->
    <rect x="-8" y="16" width="16" height="3" rx="1" fill="#334155" stroke="#09090b" stroke-width="0.6" />
    <circle cx="-7.5" cy="17.5" r="1.2" fill="url(#pommelBrass)" />
    <circle cx="7.5" cy="17.5" r="1.2" fill="url(#pommelBrass)" />

    <!-- Leather-Wrapped Grip Hilt -->
    <rect x="-1.8" y="19" width="3.6" height="12" rx="0.8" fill="#451a03" stroke="#1c0a01" stroke-width="0.5" />
    <!-- Wire Grip Wrappings -->
    <line x1="-1.8" y1="22" x2="1.8" y2="21" stroke="#ca8a04" stroke-width="0.6" />
    <line x1="-1.8" y1="25" x2="1.8" y2="24" stroke="#ca8a04" stroke-width="0.6" />
    <line x1="-1.8" y1="28" x2="1.8" y2="27" stroke="#ca8a04" stroke-width="0.6" />

    <!-- Round Brass Pommel Stone -->
    <circle cx="0" cy="33" r="3.2" fill="url(#pommelBrass)" stroke="#271003" stroke-width="0.6" />
    <circle cx="-0.8" cy="32.2" r="1" fill="#ffffff" opacity="0.6" />
  </g>
</svg>
