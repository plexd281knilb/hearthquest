<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="cotShadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>

    <linearGradient id="timberPole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="35%" stop-color="#92400e" />
      <stop offset="70%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#271003" />
    </linearGradient>

    <linearGradient id="pillowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef3c7" />
      <stop offset="85%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d4b483" />
    </linearGradient>

    <linearGradient id="cuffGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <pattern id="quiltPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <!-- 4 mini quilt patches -->
      <rect x="0" y="0" width="8" height="8" fill="#1e3a8a" />
      <rect x="8" y="0" width="8" height="8" fill="#b45309" />
      <rect x="0" y="8" width="8" height="8" fill="#15803d" />
      <rect x="8" y="8" width="8" height="8" fill="#991b1b" />
      <!-- Stitch lines -->
      <path d="M 0 8 L 16 8 M 8 0 L 8 16" stroke="#fef3c7" stroke-width="0.6" stroke-dasharray="1.5 1.5" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Ambient Ground Shadow -->
  <rect x="32" y="16" width="64" height="98" rx="8" fill="#09090b" opacity="0.4" filter="url(#cotShadowFilter)" />

  <!-- Cot Stretched Canvas Base -->
  <rect x="38" y="20" width="52" height="88" rx="3" fill="#d4a373" stroke="#8c5825" stroke-width="1" />

  <!-- Side Timber Poles -->
  <!-- Left Side Pole -->
  <rect x="34" y="15" width="7" height="98" rx="3.5" fill="url(#timberPole)" stroke="#1c0a01" stroke-width="0.8" />
  <!-- Left Pole Highlights & End Rings -->
  <ellipse cx="37.5" cy="16" rx="3" ry="1.5" fill="#ca8a04" />
  <ellipse cx="37.5" cy="112" rx="3" ry="1.5" fill="#ca8a04" />
  <path d="M 36.5 17 L 36.5 111" stroke="#fde68a" stroke-width="0.6" opacity="0.4" />

  <!-- Right Side Pole -->
  <rect x="87" y="15" width="7" height="98" rx="3.5" fill="url(#timberPole)" stroke="#1c0a01" stroke-width="0.8" />
  <!-- Right Pole Highlights & End Rings -->
  <ellipse cx="90.5" cy="16" rx="3" ry="1.5" fill="#ca8a04" />
  <ellipse cx="90.5" cy="112" rx="3" ry="1.5" fill="#ca8a04" />
  <path d="M 89.5 17 L 89.5 111" stroke="#fde68a" stroke-width="0.6" opacity="0.4" />

  <!-- Top Cross Timber -->
  <rect x="33" y="17" width="62" height="5.5" rx="2.5" fill="url(#timberPole)" stroke="#1c0a01" stroke-width="0.75" />
  <!-- Bottom Cross Timber -->
  <rect x="33" y="105.5" width="62" height="5.5" rx="2.5" fill="url(#timberPole)" stroke="#1c0a01" stroke-width="0.75" />

  <!-- Corner Rope Lashings -->
  <!-- Top-Left Lashing -->
  <g transform="translate(34, 16)">
    <path d="M 1 1 L 6 6 M 6 1 L 1 6" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="3.5" cy="3.5" r="1" fill="#78350f" />
  </g>
  <!-- Top-Right Lashing -->
  <g transform="translate(87, 16)">
    <path d="M 1 1 L 6 6 M 6 1 L 1 6" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="3.5" cy="3.5" r="1" fill="#78350f" />
  </g>
  <!-- Bottom-Left Lashing -->
  <g transform="translate(34, 105)">
    <path d="M 1 1 L 6 6 M 6 1 L 1 6" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="3.5" cy="3.5" r="1" fill="#78350f" />
  </g>
  <!-- Bottom-Right Lashing -->
  <g transform="translate(87, 105)">
    <path d="M 1 1 L 6 6 M 6 1 L 1 6" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="3.5" cy="3.5" r="1" fill="#78350f" />
  </g>

  <!-- Plump Cream Pillow -->
  <g id="pillow" transform="translate(64, 30)">
    <!-- Pillow drop shadow onto cot -->
    <rect x="-21" y="-8" width="42" height="18" rx="6" fill="#09090b" opacity="0.25" />
    <!-- Pillow body -->
    <rect x="-21" y="-9" width="42" height="18" rx="6" fill="url(#pillowGrad)" stroke="#c29d66" stroke-width="0.8" />
    <!-- Pillow tuft indentation in center -->
    <ellipse cx="0" cy="0" rx="4" ry="2" fill="#d4b483" opacity="0.6" />
    <circle cx="0" cy="0" r="1" fill="#8c5825" />
    <!-- Pillow seam & fold creases radiating from center -->
    <path d="M -3 0 C -9 -2, -15 -1, -19 -4" fill="none" stroke="#d4b483" stroke-width="0.8" opacity="0.7" />
    <path d="M 3 0 C 9 -2, 15 -1, 19 -4" fill="none" stroke="#d4b483" stroke-width="0.8" opacity="0.7" />
    <path d="M -2 1 C -7 4, -13 5, -18 6" fill="none" stroke="#d4b483" stroke-width="0.8" opacity="0.7" />
    <path d="M 2 1 C 7 4, 13 5, 18 6" fill="none" stroke="#d4b483" stroke-width="0.8" opacity="0.7" />
    <!-- Top specular highlight -->
    <path d="M -16 -6 C -8 -8, 8 -8, 16 -6" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8" />
  </g>

  <!-- Quilted Patchwork Blanket (Folded Over Cot) -->
  <g id="quiltedBlanket">
    <!-- Main Blanket Area -->
    <rect x="38" y="44" width="52" height="58" rx="3" fill="url(#quiltPattern)" stroke="#1c0a01" stroke-width="1" />

    <!-- Soft Fabric Shading Overlay (Depth & Folds) -->
    <rect x="38" y="44" width="52" height="58" rx="3" fill="#000000" opacity="0.12" />

    <!-- Blanket Sag & Fold Shadow Creases -->
    <path d="M 38 60 Q 64 64 90 60" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.2" />
    <path d="M 38 78 Q 64 82 90 78" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.2" />
    <path d="M 38 92 Q 64 96 90 92" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.25" />

    <!-- Clean Folded Top Linen Sheet Cuff -->
    <rect x="37" y="39" width="54" height="6.5" rx="1.5" fill="url(#cuffGrad)" stroke="#c29d66" stroke-width="0.8" />
    <!-- Cuff stitch row -->
    <path d="M 39 44 L 89 44" stroke="#a16207" stroke-width="0.6" stroke-dasharray="1.5 1" opacity="0.6" />
    <!-- Cuff cast shadow onto quilt -->
    <path d="M 38 46 L 90 46" stroke="#000000" stroke-width="1.2" opacity="0.3" />
  </g>
</svg>
