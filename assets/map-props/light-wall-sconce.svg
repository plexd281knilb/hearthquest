<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="sconceShadowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <filter id="torchLightFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" />
    </filter>

    <!-- Warm Torch Fan Glow -->
    <radialGradient id="torchGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#fef08a" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#f97316" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#ea580c" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ironArmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <radialGradient id="torchRingGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <linearGradient id="tarWrapGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="50%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
  </defs>

  <!-- Ambient Wall & Floor Light Halo -->
  <path d="M 64 56 L 14 116 A 70 70 0 0 0 114 116 Z" fill="url(#torchGlow)" opacity="0.65" filter="url(#torchLightFilter)" />
  <circle cx="64" cy="68" r="48" fill="url(#torchGlow)" opacity="0.5" filter="url(#torchLightFilter)" />

  <!-- Ground / Wall Cast Shadow -->
  <g id="sconceShadow" fill="#09090b" opacity="0.4" filter="url(#sconceShadowFilter)">
    <rect x="44" y="16" width="40" height="10" rx="2" />
    <rect x="60" y="22" width="8" height="42" rx="3" />
    <circle cx="64" cy="68" r="18" />
  </g>

  <!-- Iron Wall Mounting Bracket -->
  <g id="wallPlate">
    <!-- Backplate attached to wall at top (y=16) -->
    <rect x="46" y="15" width="36" height="8" rx="2" fill="url(#ironArmGrad)" stroke="#09090b" stroke-width="0.8" />
    <path d="M 47 16 L 81 16" stroke="#94a3b8" stroke-width="0.6" opacity="0.6" />

    <!-- 4 Wall Stud Bolts -->
    <circle cx="49" cy="19" r="1.2" fill="#cbd5e1" stroke="#09090b" stroke-width="0.4" />
    <circle cx="79" cy="19" r="1.2" fill="#cbd5e1" stroke="#09090b" stroke-width="0.4" />
    <circle cx="55" cy="19" r="1" fill="#cbd5e1" stroke="#09090b" stroke-width="0.3" />
    <circle cx="73" cy="19" r="1" fill="#cbd5e1" stroke="#09090b" stroke-width="0.3" />

    <!-- Projecting Iron Bracket Arm (reaching from wall to torch basket) -->
    <path d="M 61 22 L 67 22 L 66 58 L 62 58 Z" fill="url(#ironArmGrad)" stroke="#09090b" stroke-width="0.8" />
    <!-- Center Bevel Ridge -->
    <path d="M 63.5 22 L 63.5 58" stroke="#94a3b8" stroke-width="0.8" opacity="0.7" />

    <!-- Ornate Scrollwork Wings -->
    <path d="M 61 28 C 50 32, 50 44, 62 48" fill="none" stroke="url(#ironArmGrad)" stroke-width="2" stroke-linecap="round" />
    <path d="M 67 28 C 78 32, 78 44, 66 48" fill="none" stroke="url(#ironArmGrad)" stroke-width="2" stroke-linecap="round" />
    <circle cx="53" cy="38" r="1.5" fill="#09090b" />
    <circle cx="75" cy="38" r="1.5" fill="#09090b" />
  </g>

  <!-- Torch Socket Ring & Basket -->
  <g id="torchHolder">
    <!-- Circular Iron Socket Ring -->
    <circle cx="64" cy="62" r="16" fill="none" stroke="url(#torchRingGrad)" stroke-width="3" />
    <circle cx="64" cy="62" r="17.5" fill="none" stroke="#09090b" stroke-width="0.8" />
    <circle cx="64" cy="62" r="14.5" fill="none" stroke="#cbd5e1" stroke-width="0.5" opacity="0.5" />

    <!-- Radial Sconce Basket Prongs -->
    <line x1="64" y1="46" x2="64" y2="43" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
    <line x1="80" y1="62" x2="83" y2="62" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
    <line x1="64" y1="78" x2="64" y2="81" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
    <line x1="48" y1="62" x2="45" y2="62" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />

    <!-- 4 Sconce Studs -->
    <circle cx="53" cy="51" r="1.1" fill="#cbd5e1" stroke="#09090b" stroke-width="0.3" />
    <circle cx="75" cy="51" r="1.1" fill="#cbd5e1" stroke="#09090b" stroke-width="0.3" />
    <circle cx="75" cy="73" r="1.1" fill="#cbd5e1" stroke="#09090b" stroke-width="0.3" />
    <circle cx="53" cy="73" r="1.1" fill="#cbd5e1" stroke="#09090b" stroke-width="0.3" />
  </g>

  <!-- Tar-Wrapped Torch Head & Dynamic Flames -->
  <g id="torchHeadAndFlame">
    <!-- Pitch/Tar Wrapped Linen Torch Head Core -->
    <circle cx="64" cy="62" r="14" fill="url(#tarWrapGrad)" stroke="#09090b" stroke-width="1" />

    <!-- Pitch/Tar Criss-Cross Strap Texture -->
    <path d="M 52 56 Q 64 62 76 68 M 52 68 Q 64 62 76 56" stroke="#44403c" stroke-width="1.2" opacity="0.6" />
    <path d="M 56 52 Q 64 62 72 72 M 56 72 Q 64 62 72 52" stroke="#44403c" stroke-width="1.2" opacity="0.6" />

    <!-- Layer 1: Crimson Red Outer Flame Flaring South/Outward -->
    <path d="M 64 48 C 76 50, 84 62, 78 76 C 74 86, 64 92, 54 86 C 44 80, 48 62, 64 48 Z"
          fill="#dc2626" opacity="0.85" />

    <!-- Layer 2: Vivid Amber Fire Petals -->
    <path d="M 64 49 C 72 54, 80 62, 74 74 C 70 82, 64 86, 58 82 C 50 76, 54 58, 64 49 Z"
          fill="#f97316" />
    <!-- Individual flame tongue flares -->
    <path d="M 64 52 C 70 56, 75 60, 78 66 C 72 68, 74 76, 68 80 C 64 84, 60 84, 56 80 C 52 74, 54 68, 50 64 C 54 60, 58 56, 64 52 Z"
          fill="#f59e0b" />

    <!-- Layer 3: Radiant Golden-Yellow Core -->
    <path d="M 64 55 C 69 58, 73 64, 70 72 C 67 76, 62 78, 58 74 C 55 70, 58 60, 64 55 Z"
          fill="#fde047" />

    <!-- Layer 4: Incandescent White-Hot Flame Eye -->
    <ellipse cx="64" cy="65" rx="5" ry="6" fill="#ffffff" />

    <!-- Drifting Ember Sparks -->
    <circle cx="78" cy="84" r="1.3" fill="#fef08a" />
    <circle cx="85" cy="74" r="1.1" fill="#f97316" />
    <circle cx="50" cy="86" r="1.4" fill="#fef08a" />
    <circle cx="42" cy="74" r="1.1" fill="#f97316" />
    <circle cx="64" cy="95" r="1.5" fill="#fde047" />
    <circle cx="58" cy="102" r="1" fill="#fef08a" />
    <circle cx="70" cy="100" r="0.9" fill="#f97316" />
  </g>
</svg>
