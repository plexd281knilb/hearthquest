<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="brassHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#713f12" />
    </radialGradient>
    <linearGradient id="brassGear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Outer Standee Double Ring -->
  <circle cx="128" cy="128" r="122" fill="#1c1917" stroke="url(#brassHalo)" stroke-width="8" />
  <circle cx="128" cy="128" r="110" fill="#0c0a09" stroke="#eab308" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Clockwork Big Bushy Brass Tail (Spiral/Gear motif) -->
  <path d="M 160 170 C 220 170 235 90 190 60 C 160 40 140 70 160 100 C 170 115 170 135 150 145 Z" fill="#d97706" stroke="#78350f" stroke-width="3" />
  <circle cx="185" cy="85" r="14" fill="#b45309" stroke="#fde047" stroke-width="2" />
  <circle cx="185" cy="85" r="5" fill="#fef08a" />

  <!-- Brass Squirrel Body & Chest Plate -->
  <ellipse cx="120" cy="155" rx="42" ry="48" fill="#ca8a04" stroke="#713f12" stroke-width="3" />
  <rect x="105" y="135" width="30" height="30" rx="6" fill="#fef08a" stroke="#854d0e" stroke-width="2" opacity="0.8" />
  <!-- Rivets on body -->
  <circle cx="95" cy="135" r="2.5" fill="#451a03" />
  <circle cx="145" cy="135" r="2.5" fill="#451a03" />
  <circle cx="95" cy="175" r="2.5" fill="#451a03" />
  <circle cx="145" cy="175" r="2.5" fill="#451a03" />

  <!-- Pointed Brass Ears -->
  <polygon points="90,85 75,50 105,75" fill="#d97706" stroke="#78350f" stroke-width="2.5" />
  <polygon points="135,75 165,50 150,85" fill="#d97706" stroke="#78350f" stroke-width="2.5" />

  <!-- Head -->
  <circle cx="120" cy="100" r="38" fill="#eab308" stroke="#713f12" stroke-width="3" />
  
  <!-- Glowing Turquoise Optical Eyes (clockwork lenses) -->
  <circle cx="106" cy="98" r="9" fill="#065f46" stroke="#34d399" stroke-width="2" />
  <circle cx="106" cy="98" r="4" fill="#6ee7b7" />
  <circle cx="108" cy="96" r="1.5" fill="#ffffff" />
  <circle cx="134" cy="98" r="9" fill="#065f46" stroke="#34d399" stroke-width="2" />
  <circle cx="134" cy="98" r="4" fill="#6ee7b7" />
  <circle cx="136" cy="96" r="1.5" fill="#ffffff" />

  <!-- Cute Nose & Keyhole Mouth -->
  <circle cx="120" cy="112" r="4" fill="#713f12" />
  <path d="M 120 116 L 120 122" stroke="#713f12" stroke-width="2" />

  <!-- Clockwork Brass Nut Held in Paws -->
  <polygon points="120,165 132,172 132,186 120,193 108,186 108,172" fill="#fde047" stroke="#854d0e" stroke-width="2" />
  <circle cx="120" cy="179" r="4" fill="#78350f" />
  
  <!-- Paws clasping nut -->
  <circle cx="104" cy="175" r="7" fill="#b45309" stroke="#78350f" stroke-width="2" />
  <circle cx="136" cy="175" r="7" fill="#b45309" stroke="#78350f" stroke-width="2" />
</svg>