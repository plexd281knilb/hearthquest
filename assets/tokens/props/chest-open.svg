<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="openChestHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <radialGradient id="lootGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="openWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Outer Standee Double Ring -->
  <circle cx="128" cy="128" r="122" fill="#1c1917" stroke="url(#openChestHalo)" stroke-width="8" />
  <circle cx="128" cy="128" r="110" fill="#0f172a" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Radiating Divine Light Beams from Chest -->
  <polygon points="128,120 40,40 60,30" fill="#fef08a" opacity="0.25" />
  <polygon points="128,120 100,20 120,15" fill="#fef08a" opacity="0.35" />
  <polygon points="128,120 140,15 160,20" fill="#fef08a" opacity="0.35" />
  <polygon points="128,120 200,30 220,40" fill="#fef08a" opacity="0.25" />

  <!-- Shadow below chest -->
  <ellipse cx="128" cy="198" rx="72" ry="14" fill="#000000" opacity="0.6" />

  <!-- Open Lid (Tilted Upwards) -->
  <path d="M 52 110 C 52 65 204 65 204 110 L 195 90 C 195 50 61 50 61 90 Z" fill="url(#openWood)" stroke="#271003" stroke-width="3" />
  <!-- Inside of lid (dark wood interior) -->
  <path d="M 58 112 C 58 75 198 75 198 112 Z" fill="#2e1065" opacity="0.4" />

  <!-- Chest Body (Lower base) -->
  <rect x="58" y="130" width="140" height="60" rx="6" fill="url(#openWood)" stroke="#271003" stroke-width="3" />

  <!-- Gold Trim Bands -->
  <rect x="74" y="130" width="12" height="60" fill="url(#goldShine)" stroke="#78350f" stroke-width="1.5" />
  <rect x="170" y="130" width="12" height="60" fill="url(#goldShine)" stroke="#78350f" stroke-width="1.5" />
  <rect x="54" y="125" width="148" height="9" rx="3" fill="url(#goldShine)" stroke="#78350f" stroke-width="2" />

  <!-- Glowing Treasure Light Dome -->
  <circle cx="128" cy="120" r="35" fill="url(#lootGlow)" />

  <!-- Overflowing Gold Coins & Gems -->
  <circle cx="110" cy="125" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
  <circle cx="124" cy="121" r="8" fill="#fde047" stroke="#d97706" stroke-width="1.5" />
  <circle cx="138" cy="124" r="7.5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
  <circle cx="116" cy="132" r="7" fill="#fde047" stroke="#d97706" stroke-width="1.5" />
  <circle cx="132" cy="131" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
  <circle cx="148" cy="128" r="6.5" fill="#fef08a" stroke="#d97706" stroke-width="1.5" />
  <circle cx="102" cy="130" r="6.5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />

  <!-- Sparkling Ruby & Sapphire Gems -->
  <!-- Ruby Diamond -->
  <polygon points="128,105 136,114 128,122 120,114" fill="#ef4444" stroke="#991b1b" stroke-width="1.5" />
  <polygon points="128,107 133,114 128,119 123,114" fill="#f87171" />
  <!-- Sapphire Gem -->
  <polygon points="146,112 153,118 148,126 140,122" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />

  <!-- Sparkles -->
  <path d="M 85 85 Q 85 95 95 95 Q 85 95 85 105 Q 85 95 75 95 Q 85 95 85 85 Z" fill="#ffffff" />
  <path d="M 175 75 Q 175 85 185 85 Q 175 85 175 95 Q 175 85 165 85 Q 175 85 175 75 Z" fill="#ffffff" />
  <path d="M 128 70 Q 128 80 138 80 Q 128 80 128 90 Q 128 80 118 80 Q 128 80 128 70 Z" fill="#fef08a" />
</svg>