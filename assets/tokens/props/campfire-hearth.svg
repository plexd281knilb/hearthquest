<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="campHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="75%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>
    <radialGradient id="hearthGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="logGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>
  <!-- Outer Standee Double Ring -->
  <circle cx="128" cy="128" r="122" fill="#18181b" stroke="url(#campHalo)" stroke-width="8" />
  <circle cx="128" cy="128" r="110" fill="#09090b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Ambient Cozy Light Field -->
  <circle cx="128" cy="128" r="85" fill="url(#hearthGlow)" opacity="0.65" />

  <!-- Ring of River Stones -->
  <ellipse cx="68" cy="155" rx="18" ry="12" fill="url(#stoneGrad)" stroke="#0f172a" stroke-width="2" />
  <ellipse cx="98" cy="178" rx="20" ry="13" fill="url(#stoneGrad)" stroke="#0f172a" stroke-width="2" />
  <ellipse cx="138" cy="184" rx="22" ry="14" fill="url(#stoneGrad)" stroke="#0f172a" stroke-width="2" />
  <ellipse cx="178" cy="172" rx="20" ry="13" fill="url(#stoneGrad)" stroke="#0f172a" stroke-width="2" />
  <ellipse cx="198" cy="148" rx="18" ry="12" fill="url(#stoneGrad)" stroke="#0f172a" stroke-width="2" />
  <ellipse cx="186" cy="120" rx="17" ry="11" fill="url(#stoneGrad)" stroke="#0f172a" stroke-width="2" />
  <ellipse cx="152" cy="104" rx="19" ry="12" fill="url(#stoneGrad)" stroke="#0f172a" stroke-width="2" />
  <ellipse cx="104" cy="106" rx="19" ry="12" fill="url(#stoneGrad)" stroke="#0f172a" stroke-width="2" />
  <ellipse cx="70" cy="125" rx="17" ry="11" fill="url(#stoneGrad)" stroke="#0f172a" stroke-width="2" />

  <!-- Ash & Red Hot Coals Bed -->
  <ellipse cx="128" cy="150" rx="48" ry="24" fill="#292524" />
  <circle cx="118" cy="152" r="8" fill="#ef4444" opacity="0.8" />
  <circle cx="138" cy="150" r="7" fill="#f97316" opacity="0.9" />
  <circle cx="126" cy="156" r="6" fill="#facc15" opacity="0.9" />

  <!-- Crossed Firewood Logs -->
  <!-- Log 1 (Left to Right) -->
  <g transform="translate(80, 130) rotate(22)">
    <rect x="0" y="0" width="105" height="18" rx="6" fill="url(#logGrad)" stroke="#271003" stroke-width="2" />
    <ellipse cx="4" cy="9" rx="5" ry="9" fill="#b45309" stroke="#271003" stroke-width="1.5" />
    <circle cx="4" cy="9" r="2" fill="#fef08a" />
  </g>
  <!-- Log 2 (Right to Left) -->
  <g transform="translate(80, 168) rotate(-24)">
    <rect x="0" y="0" width="105" height="18" rx="6" fill="url(#logGrad)" stroke="#271003" stroke-width="2" />
    <ellipse cx="101" cy="9" rx="5" ry="9" fill="#b45309" stroke="#271003" stroke-width="1.5" />
    <circle cx="101" cy="9" r="2" fill="#fef08a" />
  </g>

  <!-- Wild Cozy Campfire Flames -->
  <!-- Back Flame (Red) -->
  <path d="M 128 42 C 90 90 85 140 108 152 C 128 158 155 152 155 152 C 172 140 162 90 128 42 Z" fill="#dc2626" opacity="0.9" />
  <!-- Mid Flame (Orange) -->
  <path d="M 128 62 C 105 100 100 135 116 148 C 128 152 144 148 144 148 C 158 135 150 100 128 62 Z" fill="#f97316" />
  <!-- Front Flame Tongue (Yellow) -->
  <path d="M 128 82 C 114 112 110 138 122 144 C 128 147 136 144 136 144 C 145 138 140 112 128 82 Z" fill="#fde047" />
  <!-- White-Hot Flame Core -->
  <path d="M 128 105 C 122 122 118 135 125 140 C 128 142 131 140 131 140 C 136 135 134 122 128 105 Z" fill="#ffffff" />

  <!-- Floating Sparks / Embers drifting upward -->
  <circle cx="118" cy="50" r="3" fill="#fef08a" />
  <circle cx="138" cy="40" r="2.5" fill="#fef08a" />
  <circle cx="110" cy="30" r="2" fill="#f97316" />
  <circle cx="145" cy="22" r="1.5" fill="#fbbf24" />
  <circle cx="128" cy="18" r="2" fill="#fef08a" />
</svg>