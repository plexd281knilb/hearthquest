<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="knightHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    <linearGradient id="shieldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  <!-- Outer Standee Double Ring -->
  <circle cx="128" cy="128" r="122" fill="#0f172a" stroke="url(#knightHalo)" stroke-width="8" />
  <circle cx="128" cy="128" r="110" fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Terrier Puppy Head with Knight Helm -->
  <!-- Cute Puppy Ears -->
  <path d="M 60 70 C 40 40 50 110 70 100 Z" fill="#b45309" />
  <path d="M 196 70 C 216 40 206 110 186 100 Z" fill="#b45309" />

  <!-- Puppy Face -->
  <ellipse cx="128" cy="120" rx="55" ry="48" fill="#d97706" />
  <ellipse cx="128" cy="135" rx="30" ry="24" fill="#fef3c7" />

  <!-- Nose & Snout -->
  <polygon points="120,130 136,130 128,140" fill="#1c1917" />
  <!-- Cheerful Eyes -->
  <circle cx="106" cy="115" r="7" fill="#1c1917" />
  <circle cx="108" cy="113" r="2.5" fill="#ffffff" />
  <circle cx="150" cy="115" r="7" fill="#1c1917" />
  <circle cx="152" cy="113" r="2.5" fill="#ffffff" />

  <!-- Shining Knight Helmet Visor -->
  <path d="M 75 90 C 100 65 156 65 181 90 L 175 105 C 150 85 106 85 81 105 Z" fill="url(#shieldPlate)" stroke="#f59e0b" stroke-width="3" />
  <!-- Helmet Plume / Feather -->
  <path d="M 128 65 Q 140 20 170 30 Q 140 45 132 65 Z" fill="#ef4444" />

  <!-- Sunbeam Buckler (Held in Front) -->
  <circle cx="128" cy="190" r="42" fill="url(#shieldPlate)" stroke="#f59e0b" stroke-width="6" />
  <!-- Sun Crest on Shield -->
  <circle cx="128" cy="190" r="18" fill="#fbbf24" />
  <path d="M 128 165 L 128 171 M 128 209 L 128 215 M 103 190 L 109 190 M 147 190 L 153 190 M 110 172 L 115 177 M 141 203 L 146 208 M 110 208 L 115 203 M 141 177 L 146 172" stroke="#d97706" stroke-width="4" stroke-linecap="round" />
</svg>
