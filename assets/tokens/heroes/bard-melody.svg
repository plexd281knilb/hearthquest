<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bardHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="65%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
  </defs>
  <!-- Outer Standee Double Ring -->
  <circle cx="128" cy="128" r="122" fill="#082f49" stroke="url(#bardHalo)" stroke-width="8" />
  <circle cx="128" cy="128" r="110" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Bard Feathered Hat -->
  <ellipse cx="128" cy="90" rx="55" ry="16" fill="#0284c7" stroke="#38bdf8" stroke-width="3" />
  <path d="M 85 90 C 85 60 171 60 171 90 Z" fill="#0369a1" />
  <path d="M 155 75 Q 195 25 215 35 Q 185 55 165 80 Z" fill="#f43f5e" />

  <!-- Happy Bard Face -->
  <circle cx="128" cy="125" r="35" fill="#fde68a" />
  <circle cx="116" cy="120" r="5" fill="#0f172a" />
  <circle cx="140" cy="120" r="5" fill="#0f172a" />
  <path d="M 120 135 Q 128 145 136 135" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Golden Tabletop Lute -->
  <g transform="translate(100, 140)">
    <ellipse cx="28" cy="55" rx="26" ry="32" fill="#d97706" stroke="#fbbf24" stroke-width="4" />
    <circle cx="28" cy="50" r="10" fill="#451a03" />
    <rect x="23" y="0" width="10" height="40" rx="2" fill="#78350f" />
    <line x1="26" y1="5" x2="26" y2="70" stroke="#fef08a" stroke-width="1.5" />
    <line x1="30" y1="5" x2="30" y2="70" stroke="#fef08a" stroke-width="1.5" />
  </g>

  <!-- Floating Musical Melody Notes -->
  <text x="65" y="150" font-size="28" fill="#38bdf8" font-family="sans-serif">♪</text>
  <text x="180" y="165" font-size="34" fill="#f472b6" font-family="sans-serif">♫</text>
</svg>
