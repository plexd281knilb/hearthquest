<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="arAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="arStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <radialGradient id="arCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#7c3aed" />
    </radialGradient>
  </defs>

  <!-- Pulsing Arcane Sigil Glow -->
  <circle cx="64" cy="64" r="60" fill="url(#arAura)" />

  <!-- Outer Runic Ring & Degree Ticks -->
  <circle cx="64" cy="64" r="46" fill="#0f172a" fill-opacity="0.55" stroke="url(#arStroke)" stroke-width="3" />
  <circle cx="64" cy="64" r="39" fill="none" stroke="#a5f3fc" stroke-width="1.5" stroke-dasharray="6 5" />

  <!-- Geometric Arcane Hexagram -->
  <polygon points="64,20 102,86 26,86" fill="none" stroke="url(#arStroke)" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="64,108 102,42 26,42" fill="none" stroke="url(#arStroke)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Four Brass Conduit Gem Anchors -->
  <circle cx="64" cy="18" r="4.5" fill="#f472b6" stroke="#ffffff" stroke-width="1" />
  <circle cx="64" cy="110" r="4.5" fill="#f472b6" stroke="#ffffff" stroke-width="1" />
  <circle cx="18" cy="64" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="110" cy="64" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />

  <!-- Glowing Inner Crystal Core -->
  <polygon points="64,46 78,64 64,82 50,64" fill="url(#arCore)" stroke="#ffffff" stroke-width="1.8" />
  <circle cx="64" cy="64" r="5.5" fill="#ffffff" />
</svg>
