version: "3.9"

services:
  quest-ai-bridge:
    image: ghcr.io/plexd281knilb/hearthquest:${HEARTHQUEST_CHANNEL:-beta}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hearthquest-ai-bridge
    command: ["npm", "run", "dev:ai"]
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HEARTHQUEST_CHANNEL=${HEARTHQUEST_CHANNEL:-beta}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://192.168.1.100:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:14b-instruct}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped

  quest-vtt:
    image: ghcr.io/plexd281knilb/hearthquest:${HEARTHQUEST_CHANNEL:-beta}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hearthquest-vtt
    command: ["npm", "run", "dev:vtt"]
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - HEARTHQUEST_CHANNEL=${HEARTHQUEST_CHANNEL:-beta}
      - HEARTHQUEST_DATA_DIR=/app/data
      - OLLAMA_HOST=${OLLAMA_HOST:-http://192.168.1.100:11434}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
    depends_on:
      - quest-ai-bridge
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/plexd281knilb/hearthquest/dev/assets/hearthquest-icon.png"
    restart: unless-stopped

  quest-admin:
    image: ghcr.io/plexd281knilb/hearthquest:${HEARTHQUEST_CHANNEL:-beta}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hearthquest-admin
    command: ["npm", "run", "dev:admin"]
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HEARTHQUEST_CHANNEL=${HEARTHQUEST_CHANNEL:-beta}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://192.168.1.100:11434}
    depends_on:
      - quest-ai-bridge
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/plexd281knilb/hearthquest/dev/assets/hearthquest-icon.png"
    restart: unless-stopped
